    <circle cx="52" cy="-702" r="28" fill="#c23b3b" stroke-width="6"/>
    <circle cx="-30" cy="-696" r="10" fill="#05060c" stroke="none"/>
    <circle cx="48" cy="-698" r="9" fill="#05060c" stroke="none"/>
    <circle cx="-44" cy="-710" r="6" fill="#ffd2c8" stroke="none"/>
    <circle cx="42" cy="-712" r="5" fill="#ffd2c8" stroke="none"/>
