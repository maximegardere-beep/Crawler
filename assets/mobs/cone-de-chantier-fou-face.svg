<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- Cône de Chantier Fou, Parking Souterrain Maudit, cadrage « face » (il t'a vu). Aucun texte. -->
  <defs>
    <pattern id="cone-de-chantier-fou-f-wall" width="120" height="70" patternUnits="userSpaceOnUse">
      <rect width="120" height="70" fill="#2e3032"/>
      <rect y="67" width="120" height="3" fill="#232527"/>
      <rect x="58" width="3" height="70" fill="#292b2d"/>
      <circle cx="28" cy="22" r="2.5" fill="#242628"/>
      <circle cx="92" cy="44" r="3" fill="#242628"/>
      <circle cx="70" cy="14" r="2" fill="#36383b"/>
    </pattern>
    <radialGradient id="cone-de-chantier-fou-f-glow">
      <stop offset="0" stop-color="#dbeafe" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#dbeafe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cone-de-chantier-fou-f-rage">
      <stop offset="0" stop-color="#e07a3a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e07a3a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Mur de béton, plafond à poutres -->
