    <path d="M44 -806 L66 -806 L76 -760 L54 -760 Z" fill="#a8a49a" stroke="none"/>
    <path d="M-30 -798 l14 0 l-6 30 l-14 0 Z" fill="#ffffff" stroke="none" opacity="0.8"/>
    <path d="M-24 -940 L-6 -980" stroke="#f3a46c" stroke-width="7" fill="none"/>
