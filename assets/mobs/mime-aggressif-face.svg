<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- Mime Aggressif (Rue des Illusions), cadrage « face ». Mannequin de couture sur pied (archétype
       mannequin) : tête ovale beige #d9cbb0 fardée de blanc, béret noir #2a2f3a, marinière à rayures
       #2a2f3a, gants blancs #e8e4d8, accent rouge #c23b3b (lèvres, foulard). Il bondit sur son pied
       vers nous : poing ganté en avant, l'autre main tire une corde imaginaire. Aucun texte. -->
  <defs>
    <pattern id="mime-aggressif-f-bricks" width="84" height="44" patternUnits="userSpaceOnUse">
      <rect width="84" height="44" fill="#110e15"/>
      <rect x="2" y="2" width="38" height="18" rx="2" fill="#221c2a"/>
      <rect x="44" y="2" width="38" height="18" rx="2" fill="#1d1824"/>
      <rect x="-19" y="24" width="38" height="18" rx="2" fill="#1d1824"/>
      <rect x="23" y="24" width="38" height="18" rx="2" fill="#221c2a"/>
      <rect x="65" y="24" width="38" height="18" rx="2" fill="#201a27"/>
    </pattern>
    <pattern id="mime-aggressif-f-cobbles" width="70" height="36" patternUnits="userSpaceOnUse">
      <rect width="70" height="36" fill="#141218"/>
      <rect x="3" y="3" width="30" height="13" rx="6" fill="#27242d"/>
      <rect x="37" y="3" width="30" height="13" rx="6" fill="#222029"/>
      <rect x="-14" y="20" width="30" height="13" rx="6" fill="#222029"/>
      <rect x="20" y="20" width="30" height="13" rx="6" fill="#27242d"/>
      <rect x="54" y="20" width="30" height="13" rx="6" fill="#25222b"/>
    </pattern>
    <radialGradient id="mime-aggressif-f-glow">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="mime-aggressif-f-torso">
      <path d="M232 478 Q228 468 246 466 L490 462 Q508 464 506 480 Q520 600 470 770 L300 776 Q236 620 232 478 Z"/>
    </clipPath>
  </defs>
  <!-- Mur de briques, ciel de nuit -->
  <rect x="0" y="0" width="750" height="900" fill="url(#mime-aggressif-f-bricks)"/>
  <rect x="0" y="0" width="750" height="120" fill="#07080f"/>
  <g fill="#3a3450"><circle cx="90" cy="40" r="3"/><circle cx="300" cy="26" r="2"/><circle cx="520" cy="58" r="3"/><circle cx="690" cy="30" r="2"/></g>
  <!-- Façades de travers -->
  <g stroke="#05060c" stroke-width="6" stroke-linejoin="round">
    <path d="M-10 170 L215 140 L225 880 L-10 880 Z" fill="#2b2336"/>
    <path d="M540 150 L760 176 L760 880 L530 880 Z" fill="#262032"/>
    <g stroke-width="4">
      <rect x="30" y="220" width="52" height="70" fill="#14111a"/>
      <rect x="120" y="210" width="52" height="70" fill="#5a4c34"/>
      <rect x="30" y="360" width="52" height="70" fill="#4a3f2c"/>
      <rect x="120" y="350" width="52" height="70" fill="#14111a"/>
      <rect x="580" y="230" width="50" height="66" fill="#14111a"/>
      <rect x="670" y="240" width="50" height="66" fill="#544630"/>
      <rect x="580" y="370" width="50" height="66" fill="#4a3f2c"/>
      <rect x="670" y="380" width="50" height="66" fill="#14111a"/>
    </g>
  </g>
  <!-- Affiche de spectacle de mime, illisible -->
  <g stroke="#05060c" stroke-width="5">
    <rect x="410" y="170" width="96" height="128" rx="6" fill="#2f2840" transform="rotate(5 458 234)"/>
    <ellipse cx="458" cy="222" rx="24" ry="30" fill="#8d8698" transform="rotate(5 458 234)"/>
    <path d="M436 272 h44 M442 286 h30" stroke="#4d4462" stroke-width="6" transform="rotate(5 458 234)"/>
  </g>
  <!-- Réverbères -->
  <ellipse cx="96" cy="300" rx="150" ry="130" fill="url(#mime-aggressif-f-glow)"/>
  <ellipse cx="660" cy="320" rx="150" ry="130" fill="url(#mime-aggressif-f-glow)"/>
  <g stroke="#05060c" stroke-width="5" stroke-linejoin="round">
    <rect x="44" y="250" width="14" height="650" fill="#1a1620"/>
    <path d="M51 256 q20 -50 60 -30" fill="none" stroke="#1a1620" stroke-width="10"/>
    <path d="M90 230 h44 l-8 36 h-28 Z" fill="#1a1620"/>
    <rect x="100" y="266" width="24" height="16" fill="#e8c46a"/>
    <rect x="692" y="270" width="14" height="630" fill="#1a1620"/>
    <path d="M699 276 q-20 -50 -60 -30" fill="none" stroke="#1a1620" stroke-width="10"/>
    <path d="M660 250 h-44 l8 36 h28 Z" fill="#1a1620"/>
    <rect x="626" y="286" width="24" height="16" fill="#e8c46a"/>
  </g>
  <!-- Pavés + brume -->
  <rect x="0" y="880" width="750" height="454" fill="url(#mime-aggressif-f-cobbles)"/>
  <path d="M0 880 H750" stroke="#05060c" stroke-width="6"/>
  <path d="M0 820 Q180 790 360 830 T750 812 L750 910 L0 910 Z" fill="#8b84a0" opacity="0.08"/>
  <path d="M0 860 Q200 840 420 870 T750 858 L750 930 L0 930 Z" fill="#8b84a0" opacity="0.07"/>
  <!-- Chapeau de quête retourné, quelques pièces -->
  <g stroke="#05060c" stroke-width="5">
    <ellipse cx="626" cy="984" rx="62" ry="17" fill="#1d1a24"/>
    <path d="M582 984 Q584 946 626 944 Q668 946 670 984 Z" fill="#25212e"/>
    <ellipse cx="626" cy="952" rx="38" ry="9" fill="#0d0b11"/>
    <circle cx="560" cy="1004" r="9" fill="#9a8342"/>
    <circle cx="690" cy="1000" r="8" fill="#9a8342"/>
  </g>
  <rect x="0" y="0" width="50" height="1334" fill="#05060c" opacity="0.25"/>
  <rect x="700" y="0" width="50" height="1334" fill="#05060c" opacity="0.25"/>

  <!-- ===== LE MIME ===== -->
  <ellipse cx="400" cy="1060" rx="150" ry="22" fill="#05060c" opacity="0.45"/>
  <!-- traînées du bond -->
  <g fill="none" stroke="#a49cba" stroke-linecap="round" opacity="0.5" stroke-width="7">
    <path d="M250 940 h-110"/><path d="M262 978 h-150"/><path d="M244 1012 h-90"/>
  </g>
  <g fill="#6b6478" opacity="0.6" stroke="none">
