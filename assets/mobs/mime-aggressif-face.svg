    <g transform="rotate(-9 392 1008)">
      <rect x="298" y="992" width="188" height="32" rx="9" fill="#2a2f3a" stroke-width="7"/>
      <path d="M312 1000 h160" stroke="#3c4352" stroke-width="5"/>
    </g>
    <!-- pied -->
    <path d="M362 826 L386 826 L404 998 L380 998 Z" fill="#2a2f3a" stroke-width="6"/>
    <rect x="352" y="822" width="46" height="18" rx="4" fill="#2a2f3a" stroke-width="5"/>
    <!-- bras arrière : tire une corde imaginaire -->
    <path d="M240 498 L168 420 L190 318" fill="none" stroke-width="40"/>
    <path d="M240 498 L168 420 L190 318" fill="none" stroke="#d9cbb0" stroke-width="27"/>
    <circle cx="168" cy="420" r="19" fill="#c9bb9f" stroke-width="6"/>
    <path d="M190 90 V440" stroke="#e8e4d8" stroke-width="5" stroke-dasharray="4 20" opacity="0.4"/>
    <path d="M168 326 L212 338 L216 302 L172 294 Z" fill="#e8e4d8" stroke-width="6"/>
    <path d="M150 300 C146 256 166 238 194 240 C226 242 238 266 234 300 C230 318 212 324 192 322 C170 322 154 318 150 300 Z" fill="#e8e4d8" stroke-width="7"/>
    <path d="M160 264 h66 M156 282 h72 M160 300 h66" fill="none" stroke="#a9a293" stroke-width="4"/>
    <path d="M128 250 l-18 -8 M126 280 h-22 M244 250 l18 -8 M248 280 h22" fill="none" stroke="#e8e4d8" stroke-width="5" opacity="0.6"/>
    <!-- hanches -->
    <rect x="312" y="768" width="130" height="62" rx="18" fill="#d9cbb0" stroke-width="8"/>
    <!-- buste de mannequin en marinière -->
    <path d="M232 478 Q228 468 246 466 L490 462 Q508 464 506 480 Q520 600 470 770 L300 776 Q236 620 232 478 Z" fill="#d9cbb0" stroke-width="9"/>
    <g clip-path="url(#mime-aggressif-f-torso)" fill="#2a2f3a">
      <rect x="200" y="512" width="340" height="22"/>
      <rect x="200" y="566" width="340" height="22"/>
      <rect x="200" y="620" width="340" height="22"/>
      <rect x="200" y="674" width="340" height="22"/>
      <rect x="200" y="728" width="340" height="22"/>
      <path d="M440 470 Q480 610 452 780 L540 780 L540 460 Z" fill="#05060c" opacity="0.18"/>
    </g>
    <path d="M232 478 Q228 468 246 466 L490 462 Q508 464 506 480 Q520 600 470 770 L300 776 Q236 620 232 478 Z" fill="none" stroke-width="9"/>
    <!-- cou + foulard rouge -->
    <rect x="336" y="420" width="52" height="56" fill="#d9cbb0" stroke-width="7"/>
    <path d="M314 466 L410 464 L366 528 Z" fill="#c23b3b" stroke-width="6"/>
    <circle cx="362" cy="468" r="13" fill="#c23b3b" stroke-width="5"/>
    <!-- bras avant : le poing ganté fonce vers nous -->
    <circle cx="496" cy="494" r="24" fill="#c9bb9f" stroke-width="6"/>
    <path d="M496 494 L566 560 L548 640" fill="none" stroke-width="44"/>
    <path d="M496 494 L566 560 L548 640" fill="none" stroke="#d9cbb0" stroke-width="30"/>
    <circle cx="566" cy="560" r="21" fill="#c9bb9f" stroke-width="6"/>
    <g fill="none" stroke="#e8e4d8" stroke-width="7" opacity="0.7">
      <path d="M408 610 l-44 -26"/><path d="M400 700 h-56"/><path d="M420 790 l-40 30"/>
      <path d="M560 832 l12 52"/><path d="M660 790 l40 32"/><path d="M684 690 h52"/><path d="M664 594 l40 -30"/>
    </g>
    <path d="M500 610 L600 606 L612 646 L490 652 Z" fill="#e8e4d8" stroke-width="7"/>
    <path d="M448 692 C444 640 476 622 510 626 C522 610 552 608 568 624 C590 610 622 618 630 642 C656 650 666 684 652 716 C646 768 606 790 548 790 C490 790 452 760 448 692 Z" fill="#e8e4d8" stroke-width="9"/>
    <path d="M510 628 C504 650 506 664 514 676 M568 626 C562 648 564 664 572 676 M630 644 C620 660 622 676 630 688" fill="none" stroke-width="5"/>
    <path d="M462 716 C500 700 548 700 590 722 C566 744 520 748 476 738" fill="#d4cebf" stroke-width="6"/>
    <path d="M470 760 C520 784 600 780 640 740 C626 776 590 790 548 790 C510 790 484 780 470 760 Z" fill="#c9c3b4" stroke="none"/>
    <!-- tête de mannequin fardée -->
    <g transform="rotate(-8 360 330)">
      <ellipse cx="360" cy="330" rx="90" ry="110" fill="#d9cbb0" stroke-width="10"/>
      <path d="M290 300 C290 250 320 238 362 238 C404 238 434 252 434 300 C440 360 428 418 362 432 C300 420 284 360 290 300 Z" fill="#f3efe4" stroke="none"/>
      <path d="M298 284 L350 312" stroke-width="13"/>
      <path d="M424 284 L374 312" stroke-width="13"/>
      <ellipse cx="326" cy="332" rx="19" ry="15" fill="#ffffff" stroke-width="5"/>
      <ellipse cx="398" cy="332" rx="19" ry="15" fill="#ffffff" stroke-width="5"/>
      <circle cx="332" cy="335" r="8" fill="#05060c" stroke="none"/>
      <circle cx="392" cy="335" r="8" fill="#05060c" stroke="none"/>
      <path d="M326 352 l-6 18 l6 11 l6 -11 Z" fill="#05060c" stroke-width="2"/>
      <path d="M398 352 l-6 18 l6 11 l6 -11 Z" fill="#05060c" stroke-width="2"/>
      <path d="M316 398 Q362 380 410 396 Q406 430 362 434 Q320 432 316 398 Z" fill="#c23b3b" stroke-width="6"/>
      <path d="M330 402 Q362 392 396 400 L394 416 Q362 422 332 418 Z" fill="#ffffff" stroke-width="4"/>
      <path d="M346 398 v22 M362 395 v26 M378 397 v23" stroke-width="3"/>
      <path d="M438 280 q-10 -8 -2 -18 M452 292 q8 -10 18 -4 M444 312 q12 4 8 16 M428 302 q-10 6 -18 0" fill="none" stroke="#c23b3b" stroke-width="5"/>
      <!-- béret -->
      <path d="M252 232 Q270 176 360 172 Q452 174 466 228 Z" fill="#2a2f3a" stroke-width="8"/>
      <ellipse cx="358" cy="232" rx="112" ry="30" fill="#2a2f3a" stroke-width="8"/>
      <path d="M290 222 Q330 206 390 210" fill="none" stroke="#3c4352" stroke-width="6"/>
      <path d="M362 172 l4 -22" stroke-width="10"/>
      <path d="M362 172 l4 -22" stroke="#2a2f3a" stroke-width="5"/>
    </g>
  </g>
</svg>
