    <rect x="420" y="398" width="96" height="76" rx="6" fill="#fbbf24" stroke-width="5"/>
    <path d="M426 410 L462 428 M510 410 L474 428" stroke-width="9" stroke-linecap="round"/>
    <rect x="438" y="434" width="16" height="18" fill="#05060c" stroke="none"/>
    <rect x="480" y="434" width="16" height="18" fill="#05060c" stroke="none"/>
    <path d="M432 466 l10 -7 l10 7 l10 -7 l10 7 l10 -7 l10 7 l10 -7 l10 7" fill="none" stroke-width="4"/>
    <rect x="424" y="402" width="20" height="8" fill="#fff6d0" stroke="none" opacity="0.7"/>
    <!-- Clavier -->
    <g fill="#4a553a" stroke-width="4">
      <rect x="420" y="504" width="26" height="20" rx="4"/><rect x="456" y="504" width="26" height="20" rx="4"/><rect x="492" y="504" width="26" height="20" rx="4"/>
      <rect x="420" y="532" width="26" height="20" rx="4"/><rect x="456" y="532" width="26" height="20" rx="4"/><rect x="492" y="532" width="26" height="20" rx="4" fill="#c23b3b"/>
    </g>
    <!-- Deux boutons ronds -->
    <circle cx="272" cy="630" r="30" fill="#4a553a"/>
    <circle cx="378" cy="630" r="30" fill="#4a553a"/>
    <circle cx="266" cy="622" r="8" fill="#6b7850" stroke="none"/>
    <circle cx="372" cy="622" r="8" fill="#6b7850" stroke="none"/>
    <!-- Fente à tickets + ticket qui jaillit -->
    <rect x="436" y="622" width="104" height="18" rx="4" fill="#05060c" stroke="none"/>
    <g transform="rotate(14 470 632)">
      <rect x="470" y="618" width="210" height="58" rx="5" fill="#e8e4d8" stroke-width="6"/>
      <path d="M492 636 h90 M492 656 h60 M600 634 v28 M612 634 v28 M620 634 v28 M634 634 v28 M644 634 v28" stroke-width="5"/>
    </g>
    <!-- Trappe à monnaie -->
    <rect x="236" y="720" width="276" height="200" rx="12" fill="none" stroke="#4a553a" stroke-width="7"/>
    <circle cx="482" cy="820" r="9" fill="#05060c" stroke="none"/>
