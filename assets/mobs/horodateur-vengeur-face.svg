    <circle cx="330" cy="440" r="60" fill="#e2e0cc" stroke-width="5"/>
    <path d="M330 440 L372 398 A60 60 0 0 1 390 440 Z" fill="#c23b3b" stroke="none"/>
    <path d="M330 386 v12 M282 412 l10 6 M378 412 l-10 6 M276 452 h12 M384 452 h-12" stroke-width="5"/>
    <path d="M330 440 L378 396" stroke="#c23b3b" stroke-width="10" stroke-linecap="round"/>
    <circle cx="330" cy="440" r="10" fill="#05060c" stroke="none"/>
    <path d="M392 380 q10 4 12 14 M398 368 q16 6 18 22" fill="none" stroke="#c23b3b" stroke-width="4" stroke-linecap="round"/>
