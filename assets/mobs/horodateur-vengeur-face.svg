      <path d="M594 282 h52 M594 298 h34 M664 280 v22 M674 280 v22" stroke-width="4"/>
    </g>
    <circle cx="640" cy="620" r="38" fill="#fbbf24" stroke-width="6"/>
    <circle cx="640" cy="620" r="22" fill="none" stroke="#b7861a" stroke-width="5"/>
    <circle cx="160" cy="330" r="26" fill="#fbbf24" stroke-width="5"/>
    <circle cx="160" cy="330" r="14" fill="none" stroke="#b7861a" stroke-width="4"/>
    <ellipse cx="104" cy="800" rx="10" ry="26" fill="#fbbf24" stroke-width="5" transform="rotate(30 104 800)"/>
    <ellipse cx="610" cy="170" rx="8" ry="20" fill="#fbbf24" stroke-width="4" transform="rotate(-30 610 170)"/>
  </g>
  <g fill="none" stroke="#e8e4d8" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <path d="M248 540 l60 20 M250 586 l50 10"/>
    <path d="M592 600 l-50 14 M594 640 l-40 4"/>
    <path d="M190 344 l46 18"/>
  </g>
</svg>
