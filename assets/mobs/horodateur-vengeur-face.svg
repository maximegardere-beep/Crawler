    <path d="M516 254 h50 l-4 20 h-42 Z M576 250 h26 v46 h-26 Z M522 286 h40 l2 32 h-46 Z M612 256 l34 4 l-4 28 l-32 -4 Z M580 306 h64 l-10 18 h-50 Z"/>
    <rect x="176" y="340" width="140" height="8"/><rect x="516" y="340" width="140" height="8"/>
  </g>
