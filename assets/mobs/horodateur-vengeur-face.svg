    <rect x="90" y="142" width="160" height="18" rx="8" fill="#55606c"/>
    <path d="M470 122 v20 M620 122 v20 M120 122 v20 M220 122 v20" stroke-width="5"/>
  </g>
  <ellipse cx="545" cy="190" rx="220" ry="80" fill="#dbeafe" opacity="0.07"/>
