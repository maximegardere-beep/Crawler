  <path d="M130 600 C100 430 200 250 330 230 C440 200 600 260 640 400 C690 560 650 800 600 940 C560 1020 420 1040 300 1020 C180 1000 150 820 130 600 Z" fill="#fbbf24" opacity="0.07"/>
  <path d="M190 620 C170 470 250 330 360 310 C470 300 560 360 580 480 C600 620 580 820 540 920 C500 980 400 990 320 970 C230 950 200 790 190 620 Z" fill="#fbbf24" opacity="0.08"/>
