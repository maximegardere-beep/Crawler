<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- Horodateur Vengeur, Parking Souterrain Maudit, cadrage « face » : il crache ses contraventions sur toi. Aucun texte. -->
  <defs>
    <pattern id="horodateur-vengeur-f-beton" width="150" height="76" patternUnits="userSpaceOnUse">
      <rect width="150" height="76" fill="#2c2e30"/>
      <rect x="75" y="38" width="75" height="38" fill="#292b2d"/>
      <rect x="0" y="0" width="75" height="38" fill="#2a2c2e"/>
      <path d="M0 37 H150 M75 0 V37 M0 38 V76 M150 38 V76" stroke="#17181a" stroke-width="3"/>
      <circle cx="30" cy="20" r="2.5" fill="#1f2022"/>
      <circle cx="112" cy="56" r="3" fill="#1f2022"/>
      <circle cx="96" cy="14" r="2" fill="#34363a"/>
    </pattern>
    <radialGradient id="horodateur-vengeur-f-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
