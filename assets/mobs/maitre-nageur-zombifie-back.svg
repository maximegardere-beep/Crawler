<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- Maître-Nageur Zombifié, cadrage « back » : au bord du bassin vide, il siffle un canard en plastique qui « court » au fond. Aucun texte. -->
  <defs>
    <pattern id="maitre-nageur-zombifie-b-tiles" width="54" height="28" patternUnits="userSpaceOnUse">
      <rect width="54" height="28" fill="#18303d"/>
      <rect x="1" y="1" width="25" height="12" rx="1.5" fill="#203f4f"/>
      <rect x="28" y="1" width="25" height="12" rx="1.5" fill="#234455"/>
      <rect x="-12" y="15" width="25" height="12" rx="1.5" fill="#234455"/>
      <rect x="15" y="15" width="25" height="12" rx="1.5" fill="#203f4f"/>
      <rect x="42" y="15" width="25" height="12" rx="1.5" fill="#22424f"/>
    </pattern>
    <pattern id="maitre-nageur-zombifie-b-pool" width="36" height="18" patternUnits="userSpaceOnUse">
      <rect width="36" height="18" fill="#1c3a48"/>
      <rect x="1" y="1" width="16" height="7.5" rx="1" fill="#28505f"/>
      <rect x="19" y="1" width="16" height="7.5" rx="1" fill="#2a5464"/>
      <rect x="-8" y="10" width="16" height="7.5" rx="1" fill="#2a5464"/>
      <rect x="10" y="10" width="16" height="7.5" rx="1" fill="#28505f"/>
      <rect x="28" y="10" width="16" height="7.5" rx="1" fill="#28505f"/>
    </pattern>
    <pattern id="maitre-nageur-zombifie-b-floor" width="90" height="46" patternUnits="userSpaceOnUse">
      <rect width="90" height="46" fill="#162a34"/>
      <rect x="2" y="2" width="86" height="42" rx="3" fill="#1d3743"/>
    </pattern>
  </defs>
  <!-- Mur du fond -->
  <rect x="0" y="0" width="750" height="500" fill="url(#maitre-nageur-zombifie-b-tiles)"/>
  <rect x="0" y="0" width="750" height="90" fill="#121c24"/>
  <path d="M0 90 H750 M250 0 V90 M520 0 V90" fill="none" stroke="#1d2a33" stroke-width="10"/>
  <g stroke="#05060c" stroke-width="4">
    <rect x="330" y="104" width="150" height="18" rx="5" fill="#1a2a34"/>
  </g>
  <rect x="336" y="108" width="138" height="10" rx="5" fill="#bae6fd" opacity="0.75"/>
  <ellipse cx="405" cy="230" rx="230" ry="130" fill="#bae6fd" opacity="0.06"/>
  <g fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" opacity="0.13">
    <path d="M240 190 q30 -14 60 0 t60 0 M480 240 q30 -14 60 0 t60 0 M300 300 q24 12 48 0 t48 0 M560 170 q20 -10 40 0"/>
  </g>
  <g stroke="#05060c" stroke-width="4">
    <rect x="560" y="300" width="100" height="42" rx="6" fill="#1d3b4a"/>
    <path d="M574 316 h70 M574 328 h44" stroke="#6f8f9c" stroke-width="6"/>
    <circle cx="300" cy="380" r="34" fill="#7f4a50"/>
    <circle cx="300" cy="380" r="16" fill="#18303d"/>
    <path d="M276 356 l10 10 M324 356 l-10 10 M276 404 l10 -10 M324 404 l-10 -10" stroke="#a8a294" stroke-width="9"/>
  </g>
  <!-- Plongeoir sur le bord d'en face -->
  <g stroke="#05060c" stroke-width="4">
    <rect x="610" y="420" width="16" height="84" fill="#2a3a45"/>
    <rect x="560" y="408" width="190" height="16" rx="5" fill="#3a5560"/>
  </g>
  <!-- Bassin vide -->
  <rect x="0" y="498" width="750" height="12" fill="#2a4652" stroke="#05060c" stroke-width="4"/>
  <rect x="0" y="510" width="750" height="120" fill="url(#maitre-nageur-zombifie-b-pool)"/>
  <path d="M0 540 H750" stroke="#c94f5a" stroke-width="5" opacity="0.25"/>
  <path d="M0 630 H750 V720 H0 Z" fill="#142a34"/>
  <path d="M0 630 H750" stroke="#05060c" stroke-width="5"/>
  <path d="M60 670 H690" stroke="#0e1e26" stroke-width="10"/>
  <g fill="none" stroke-linecap="round">
    <path d="M150 630 V520 Q150 498 172 498" stroke="#05060c" stroke-width="12"/>
    <path d="M150 630 V520 Q150 498 172 498" stroke="#56707a" stroke-width="5"/>
    <path d="M196 630 V520 Q196 498 218 498" stroke="#05060c" stroke-width="12"/>
    <path d="M196 630 V520 Q196 498 218 498" stroke="#56707a" stroke-width="5"/>
    <path d="M150 560 H196 M150 600 H196" stroke="#05060c" stroke-width="7"/>
  </g>
  <!-- Bonde, feuilles mortes et canard en plastique -->
  <ellipse cx="320" cy="684" rx="30" ry="8" fill="#0b161c" stroke="#05060c" stroke-width="3"/>
  <path d="M308 684 h24 M320 678 v12" stroke="#2a3a45" stroke-width="3"/>
  <g fill="#5f5a3a" stroke="#05060c" stroke-width="2"><path d="M420 690 q10 -8 18 0 q-8 6 -18 0 Z"/><path d="M240 700 q8 -8 16 0 q-8 6 -16 0 Z"/><path d="M690 682 q10 -6 16 2 q-8 6 -16 -2 Z"/></g>
  <g stroke="#05060c" stroke-width="3">
    <ellipse cx="610" cy="690" rx="22" ry="13" fill="#fbbf24"/>
    <circle cx="626" cy="672" r="10" fill="#fbbf24"/>
    <path d="M635 670 l12 3 l-12 4 Z" fill="#f97316"/>
    <path d="M590 686 l-8 -6" fill="none"/>
  </g>
  <g fill="none" stroke="#e8e4d8" stroke-width="3" stroke-linecap="round" opacity="0.6"><path d="M578 694 h-16 M580 684 h-12"/></g>
  <!-- Bord de bassin, côté crawler -->
  <rect x="0" y="716" width="750" height="18" fill="#2a4652" stroke="#05060c" stroke-width="4"/>
  <rect x="0" y="734" width="750" height="600" fill="url(#maitre-nageur-zombifie-b-floor)"/>
  <rect x="0" y="734" width="750" height="120" fill="#05060c" opacity="0.18"/>
