  <g stroke="#05060c" stroke-width="5" stroke-linecap="round" transform="translate(76 0)">
    <path d="M590 740 L620 500 M680 740 L660 500" fill="none" stroke-width="12"/>
    <path d="M590 740 L620 500 M680 740 L660 500" fill="none" stroke="#c9c2b0" stroke-width="5"/>
    <path d="M600 660 H676 M610 580 H668" fill="none" stroke-width="7"/>
    <rect x="606" y="488" width="72" height="16" rx="4" fill="#8c4a50"/>
    <path d="M612 488 V440 H674 V488" fill="#2a3a45"/>
  </g>
  <ellipse cx="712" cy="744" rx="70" ry="10" fill="#05060c" opacity="0.4"/>
  <ellipse cx="420" cy="745" rx="92" ry="13" fill="#05060c" opacity="0.45"/>
  <!-- Le maître-nageur, de dos -->
  <g stroke="#05060c" stroke-linejoin="round" stroke-linecap="round" transform="translate(420 742) scale(0.95)">
    <!-- Ondes du sifflet, vers le fond -->
    <g fill="none" stroke-linecap="round">
      <path d="M70 -380 Q110 -380 130 -350 M90 -410 Q144 -410 170 -366" stroke="#05060c" stroke-width="9"/>
      <path d="M70 -380 Q110 -380 130 -350 M90 -410 Q144 -410 170 -366" stroke="#a5f3fc" stroke-width="3.5"/>
    </g>
    <!-- Jambes (pantalon rouge), talons verts, tongs -->
    <path d="M-52 -178 L-10 -178 L-14 -18 L-50 -18 Z" fill="#c94f5a" stroke-width="6"/>
    <path d="M8 -178 L50 -178 L54 -18 L18 -18 Z" fill="#c94f5a" stroke-width="6"/>
    <path d="M-30 -160 L-32 -24 M32 -160 L36 -24" stroke="#9e3a45" stroke-width="5"/>
    <path d="M-52 -22 Q-32 -30 -12 -22 L-12 -4 L-52 -4 Z" fill="#9cb06e" stroke-width="5"/>
    <path d="M16 -22 Q36 -30 56 -22 L56 -4 L16 -4 Z" fill="#9cb06e" stroke-width="5"/>
    <path d="M-56 -4 H-8 V4 H-56 Z M12 -4 H60 V4 H12 Z" fill="#1e7a8c" stroke-width="4"/>
    <!-- Frite : bout qui dépasse derrière -->
    <path d="M-60 -262 L-170 -210" fill="none" stroke-width="40"/>
    <path d="M-60 -262 L-170 -210" fill="none" stroke="#fbbf24" stroke-width="30"/>
    <path d="M-110 -250 l10 22 M-146 -232 l10 22" stroke="#c94f5a" stroke-width="7"/>
    <ellipse cx="-172" cy="-209" rx="14" ry="17" fill="#e09f12" stroke-width="5" transform="rotate(-25 -172 -209)"/>
    <circle cx="-172" cy="-209" r="5" fill="#05060c" stroke="none"/>
    <!-- Dos vert -->
    <path d="M-72 -310 Q0 -328 72 -310 Q86 -236 62 -166 L-62 -166 Q-86 -236 -72 -310 Z" fill="#9cb06e" stroke-width="7"/>
    <path d="M40 -310 Q76 -240 58 -166 L62 -166 Q86 -236 72 -310 Z" fill="#7a8c52" stroke="none"/>
    <path d="M0 -300 Q-4 -240 2 -180" fill="none" stroke="#6f8150" stroke-width="5"/>
    <path d="M-48 -282 Q-30 -266 -14 -282 M14 -282 Q32 -266 48 -282" fill="none" stroke="#6f8150" stroke-width="5"/>
    <path d="M22 -228 l10 10 M32 -228 l-10 10" stroke="#6f8150" stroke-width="4"/>
    <!-- Ceinture rouge (cordon noué devant, invisible) -->
    <path d="M-64 -186 Q0 -172 64 -186 L64 -164 Q0 -152 -64 -164 Z" fill="#c94f5a" stroke-width="5"/>
    <!-- Bras droit (à gauche) qui coince la frite -->
    <path d="M-70 -306 Q-96 -270 -94 -226 L-66 -222 Q-66 -256 -52 -284 Z" fill="#c94f5a" stroke-width="6"/>
    <path d="M-94 -230 Q-96 -196 -82 -176 L-62 -184 Q-70 -204 -68 -226 Z" fill="#9cb06e" stroke-width="5"/>
    <path d="M-90 -244 Q-80 -232 -66 -238" fill="none" stroke="#c94f5a" stroke-width="16"/>
    <!-- Bras gauche tendu : il montre le canard du doigt -->
    <path d="M58 -304 Q96 -300 124 -268 L108 -248 Q84 -274 52 -280 Z" fill="#c94f5a" stroke-width="6"/>
    <path d="M120 -272 Q138 -250 150 -226 L132 -214 Q120 -236 106 -252 Z" fill="#9cb06e" stroke-width="5"/>
    <circle cx="144" cy="-216" r="12" fill="#9cb06e" stroke-width="5"/>
    <path d="M150 -208 L166 -186" stroke-width="11"/>
    <path d="M150 -208 L166 -186" stroke="#9cb06e" stroke-width="4"/>
    <!-- Nuque et cordon du sifflet -->
    <rect x="-20" y="-338" width="40" height="34" fill="#9cb06e" stroke-width="6"/>
    <path d="M-24 -318 Q0 -306 24 -318" fill="none" stroke="#05060c" stroke-width="7"/>
    <path d="M-24 -318 Q0 -306 24 -318" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <!-- Tête vue de derrière : oreilles, nuque, arrière du bonnet -->
    <path d="M-54 -376 q-18 -2 -18 16 q2 16 20 12 Z" fill="#9cb06e" stroke-width="5"/>
    <path d="M54 -380 q18 0 18 16 q-2 16 -20 12 Z" fill="#9cb06e" stroke-width="5"/>
    <path d="M-52 -380 Q-54 -440 0 -444 Q54 -440 52 -380 Q48 -336 0 -330 Q-48 -336 -52 -380 Z" fill="#9cb06e" stroke-width="7"/>
    <path d="M30 -430 Q56 -390 40 -340 Q52 -380 46 -410 Z" fill="#7a8c52" stroke="none"/>
    <path d="M-20 -350 l8 -6 M10 -346 l10 4" stroke="#6f8150" stroke-width="4"/>
    <g transform="rotate(6 0 -400)">
      <path d="M-56 -376 Q-62 -456 0 -462 Q62 -456 56 -376 Q30 -390 0 -390 Q-30 -390 -56 -376 Z" fill="#c94f5a" stroke-width="7"/>
      <path d="M-58 -404 Q0 -424 58 -404 L58 -390 Q0 -408 -58 -390 Z" fill="#e8e4d8" stroke-width="4"/>
      <path d="M30 -452 Q52 -430 56 -390 L44 -392 Q42 -424 24 -446 Z" fill="#9e3a45" stroke="none"/>
    </g>
  </g>
  <!-- Cachette : pilier carrelé et pile de planches de natation -->
  <path d="M0 0 H190 V1334 H0 Z" fill="#0f1a20"/>
  <path d="M172 0 H206 V1334 H172 Z" fill="#17262e" stroke="#05060c" stroke-width="5"/>
  <g fill="#132128"><rect x="16" y="180" width="70" height="34" rx="3"/><rect x="94" y="180" width="70" height="34" rx="3"/><rect x="16" y="222" width="70" height="34" rx="3"/><rect x="94" y="222" width="70" height="34" rx="3"/><rect x="16" y="460" width="70" height="34" rx="3"/><rect x="94" y="460" width="70" height="34" rx="3"/><rect x="16" y="502" width="70" height="34" rx="3"/></g>
  <g stroke="#05060c" stroke-width="6">
    <rect x="30" y="900" width="250" height="44" rx="18" fill="#1b3340"/>
    <rect x="44" y="944" width="236" height="44" rx="18" fill="#1d3a2e"/>
    <rect x="20" y="988" width="262" height="46" rx="18" fill="#3a2a2e"/>
    <rect x="36" y="1034" width="240" height="46" rx="18" fill="#1b3340"/>
  </g>
  <ellipse cx="150" cy="1090" rx="160" ry="16" fill="#05060c" opacity="0.5"/>
  <path d="M250 1334 L750 1334 L750 1230 Q500 1200 250 1290 Z" fill="#05060c" opacity="0.35"/>
</svg>
