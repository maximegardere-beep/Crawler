<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- Ordinateur en Colère, Salle des Machines Infernales, cadrage « back » : il poursuit sa souris qui s'enfuit. Aucun texte. -->
  <defs>
    <pattern id="ordinateur-en-colere-b-tole" width="80" height="51" patternUnits="userSpaceOnUse">
      <rect width="80" height="51" fill="#2a2e33"/>
      <rect x="1.5" y="1.5" width="77" height="48" rx="4" fill="#33393f"/>
      <circle cx="9" cy="9" r="2.2" fill="#23272c"/>
      <circle cx="71" cy="9" r="2.2" fill="#23272c"/>
      <circle cx="9" cy="42" r="2.2" fill="#23272c"/>
      <circle cx="71" cy="42" r="2.2" fill="#23272c"/>
      <path d="M0 25.5 h80" stroke="#23272c" stroke-width="4"/>
      <rect x="15" y="12" width="19" height="9" rx="2" fill="#3a4148"/>
    </pattern>
    <radialGradient id="ordinateur-en-colere-b-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Mur de tôle -->
  <rect x="0" y="0" width="750" height="560" fill="url(#ordinateur-en-colere-b-tole)"/>
  <rect x="0" y="0" width="750" height="50" fill="#1f2226"/>
  <g fill="none" stroke="#05060c" stroke-linecap="round">
    <path d="M0 34 H750" stroke-width="16"/>
    <path d="M0 34 H750" stroke="#2f3439" stroke-width="9"/>
    <path d="M560 34 V96 H680" stroke-width="14"/>
    <path d="M560 34 V96 H680" stroke="#2f3439" stroke-width="7"/>
  </g>
  <!-- Engrenages -->
  <g stroke="#05060c" stroke-width="5" fill="#30353b">
    <path d="M560 200 l12 -40 l20 4 l2 42 l34 -24 l14 14 l-24 34 l42 4 l0 20 l-42 2 l24 36 l-14 14 l-34 -26 l-4 42 l-20 2 l-4 -42 l-34 24 l-14 -14 l24 -34 l-42 -4 l0 -20 l42 -2 l-24 -34 l14 -14 Z"/>
    <circle cx="582" cy="242" r="22" fill="#23272c"/>
    <path d="M660 140 l7 -18 l12 3 l0 20 l18 -8 l6 11 l-16 13 l17 9 l-5 11 l-18 -7 l1 20 l-12 3 l-5 -18 l-16 12 l-8 -9 l13 -16 l-18 -7 l4 -11 l20 4 Z" fill="#2c3136"/>
  </g>
  <!-- Manomètres -->
  <g stroke="#05060c" stroke-width="5">
    <circle cx="120" cy="200" r="26" fill="#3a4047"/>
    <circle cx="120" cy="200" r="16" fill="#7a7468"/>
    <path d="M120 200 l12 -10" stroke="#ef4444" stroke-width="4"/>
    <circle cx="180" cy="220" r="20" fill="#3a4047"/>
    <circle cx="180" cy="220" r="11" fill="#7a7468"/>
    <path d="M180 220 l10 4" stroke="#ef4444" stroke-width="4"/>
    <path d="M94 200 h-40 M146 200 h14" stroke-width="8"/>
  </g>
  <!-- Gyrophares -->
  <g stroke="#05060c" stroke-width="4">
    <path d="M250 50 v16 h30 v-16" fill="#2f3439"/>
    <path d="M253 66 a12 12 0 0 0 24 0 Z" fill="#b91c1c"/>
    <path d="M470 50 v16 h30 v-16" fill="#2f3439"/>
    <path d="M473 66 a12 12 0 0 0 24 0 Z" fill="#7f1d1d"/>
  </g>
  <!-- Tuyau horizontal -->
  <g fill="none" stroke-linecap="round">
    <path d="M440 470 H760" stroke="#05060c" stroke-width="24"/>
    <path d="M440 470 H760" stroke="#3a342c" stroke-width="15"/>
    <path d="M520 458 v24 M640 458 v24" stroke="#05060c" stroke-width="5"/>
  </g>
  <!-- Lueur rouge de l'écran, projetée sur le mur devant lui -->
  <ellipse cx="420" cy="320" rx="240" ry="170" fill="url(#ordinateur-en-colere-b-glow)"/>

  <!-- Sol en caillebotis -->
  <rect x="0" y="560" width="750" height="774" fill="#24272b"/>
  <path d="M0 560 H750" stroke="#05060c" stroke-width="5"/>
  <g stroke="#1a1c1f" stroke-width="6">
    <path d="M0 610 H750 M0 680 H750 M0 780 H750 M0 920 H750 M0 1110 H750"/>
    <path d="M330 560 L220 1334 M420 560 L530 1334 M240 560 L-20 1334 M510 560 L770 1334 M150 560 L-260 1334 M600 560 L1010 1334"/>
  </g>
  <ellipse cx="560" cy="580" rx="80" ry="22" fill="#9ca3af" opacity="0.14"/>
  <ellipse cx="590" cy="550" rx="44" ry="20" fill="#9ca3af" opacity="0.12"/>

  <!-- ===== La souris qui s'enfuit (au fond, devant lui, à droite) ===== -->
  <g transform="translate(870 -170) scale(-1.3 1.3)">
  <ellipse cx="180" cy="602" rx="40" ry="8" fill="#05060c" opacity="0.5"/>
  <g stroke="#05060c" stroke-linejoin="round" stroke-linecap="round">
    <path d="M168 598 l-10 12 M188 598 l8 12 M178 598 l0 12" stroke-width="5"/>
    <ellipse cx="180" cy="580" rx="34" ry="21" fill="#cbd5e1" stroke-width="5" transform="rotate(-10 180 580)"/>
    <path d="M196 568 q-10 0 -18 -18" fill="none" stroke-width="3"/>
    <rect x="183" y="558" width="9" height="13" rx="4" fill="#475569" stroke-width="2.5" transform="rotate(-10 187 564)"/>
  </g>
  <g fill="none" stroke="#e5e7eb" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <path d="M230 545 h30 M236 560 h22 M120 552 l-10 -10 M126 540 l-4 -14"/>
  </g>
  <!-- Gouttes de sueur de la souris -->
  <g fill="#93c5fd" stroke="#05060c" stroke-width="2.5"><path d="M150 548 q-6 -10 0 -16 q6 6 0 16 Z"/><path d="M138 560 q-5 -8 0 -13 q5 5 0 13 Z"/></g>

  </g>
  <!-- Touches lancées, éparpillées par terre -->
  <g stroke="#05060c" stroke-width="4" stroke-linejoin="round">
    <g transform="rotate(20 520 640)"><rect x="506" y="626" width="26" height="26" rx="4" fill="#cbd5e1"/><rect x="511" y="630" width="16" height="14" rx="3" fill="#e5e7eb" stroke-width="2.5"/></g>
    <g transform="rotate(-15 250 620)"><rect x="238" y="608" width="24" height="24" rx="4" fill="#cbd5e1"/><rect x="242" y="611" width="16" height="14" rx="3" fill="#e5e7eb" stroke-width="2.5"/></g>
    <g transform="rotate(35 640 520)"><rect x="628" y="508" width="24" height="24" rx="4" fill="#cbd5e1"/><rect x="632" y="511" width="16" height="14" rx="3" fill="#e5e7eb" stroke-width="2.5"/></g>
    <g transform="rotate(-30 320 690)"><rect x="308" y="678" width="24" height="24" rx="4" fill="#cbd5e1"/><rect x="312" y="681" width="16" height="14" rx="3" fill="#e5e7eb" stroke-width="2.5"/></g>
  </g>
  <path d="M300 420 C250 400 230 440 236 600" fill="none" stroke="#e5e7eb" stroke-width="4" stroke-dasharray="10 10" opacity="0.5"/>

  <!-- ===== L'Ordinateur, de dos (trois-quarts dos), penché vers la souris ===== -->
  <ellipse cx="425" cy="702" rx="140" ry="16" fill="#05060c" opacity="0.55"/>
  <g transform="translate(410 560) scale(1.15) rotate(7) translate(-410 -560)" stroke="#05060c" stroke-linejoin="round">
    <!-- pieds -->
    <rect x="336" y="656" width="52" height="30" rx="6" fill="#37435a" stroke-width="6"/>
    <rect x="432" y="660" width="52" height="30" rx="6" fill="#37435a" stroke-width="6"/>
    <!-- antenne + ampoule rouge (à droite vue de dos) -->
    <path d="M462 398 L470 300" stroke-width="7" fill="none"/>
    <circle cx="471" cy="292" r="13" fill="#ef4444" stroke-width="5"/>
    <circle cx="467" cy="288" r="4" fill="#fecaca" stroke="none"/>
    <!-- flanc droit visible -->
    <path d="M500 404 L536 384 L536 640 L500 670 Z" fill="#37435a" stroke-width="7"/>
    <path d="M510 430 l16 -9 M510 452 l16 -9 M510 474 l16 -9" stroke="#2a3346" stroke-width="4"/>
    <!-- dessus -->
    <path d="M330 402 L500 402 L536 384 L368 380 Z" fill="#6b7d9e" stroke-width="7"/>
    <!-- panneau arrière -->
    <rect x="330" y="398" width="172" height="276" rx="12" fill="#5a6b8a" stroke-width="7"/>
    <!-- ventilateur -->
    <circle cx="380" cy="458" r="34" fill="#37435a" stroke-width="6"/>
    <path d="M380 458 q-4 -24 14 -28 M380 458 q24 -4 28 14 M380 458 q4 24 -14 28 M380 458 q-24 4 -28 -14" fill="none" stroke="#2a3346" stroke-width="5"/>
    <circle cx="380" cy="458" r="7" fill="#2a3346" stroke-width="3"/>
    <!-- bloc d'alimentation + prise -->
    <rect x="430" y="424" width="56" height="44" rx="5" fill="#37435a" stroke-width="5"/>
    <rect x="444" y="436" width="28" height="20" rx="3" fill="#1b2130" stroke-width="3"/>
    <!-- ports et fentes -->
    <path d="M350 520 h130 M350 540 h130 M350 560 h130" stroke="#37435a" stroke-width="7"/>
    <rect x="350" y="586" width="20" height="14" rx="2" fill="#1b2130" stroke-width="3"/>
    <rect x="378" y="586" width="20" height="14" rx="2" fill="#1b2130" stroke-width="3"/>
    <rect x="410" y="584" width="60" height="18" rx="3" fill="#1b2130" stroke-width="3"/>
    <!-- vis du panneau -->
    <g fill="#37435a" stroke-width="2.5"><circle cx="344" cy="412" r="4"/><circle cx="488" cy="412" r="4"/><circle cx="344" cy="660" r="4"/><circle cx="488" cy="660" r="4"/></g>
    <!-- câble de la souris branché au dos -->
    <!-- câble d'alimentation qui pend -->
    <path d="M400 600 C360 640 330 660 300 700" fill="none" stroke-width="9" stroke-linecap="round"/>
    <path d="M400 600 C360 640 330 660 300 700" fill="none" stroke="#2a2f3a" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Câble de la souris, branché au dos, tendu -->
  <path d="M450 602 C520 650 560 600 593 574" fill="none" stroke="#05060c" stroke-width="10" stroke-linecap="round"/>
  <path d="M450 602 C520 650 560 600 593 574" fill="none" stroke="#2a2f3a" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Fumée de rage (en haut à gauche, du côté de l'écran) -->
  <g fill="#cbd5e1" stroke="#05060c" stroke-width="4">
    <circle cx="545" cy="236" r="14" opacity="0.7"/>
    <circle cx="570" cy="204" r="18" opacity="0.6"/>
    <circle cx="602" cy="166" r="22" opacity="0.5"/>
  </g>
  <!-- Gribouillis de colère (aucune lettre) -->
  <path d="M360 300 l14 -26 l10 18 l14 -30 l8 22 l16 -20" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M320 340 l-20 -12 M560 300 l18 -14" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>

  <!-- ===== Cachette : armoire de machine au premier plan, à gauche ===== -->
  <g transform="translate(-70 0)" stroke="#05060c" stroke-linejoin="round">
    <path d="M-10 300 L190 340 L190 1334 L-10 1334 Z" fill="#17191c" stroke-width="8"/>
    <path d="M190 340 L240 330 L240 1334 L190 1334 Z" fill="#101215" stroke-width="8"/>
    <path d="M20 420 h140 M20 520 h140 M20 820 h140" stroke="#23262a" stroke-width="10"/>
    <g fill="#23262a" stroke-width="3"><circle cx="30" cy="360" r="6"/><circle cx="170" cy="386" r="6"/><circle cx="30" cy="980" r="6"/><circle cx="170" cy="980" r="6"/></g>
    <rect x="50" y="600" width="90" height="140" rx="8" fill="#1d2024" stroke-width="5"/>
    <path d="M64 628 h62 M64 652 h62 M64 676 h62 M64 700 h62" stroke="#2a2d32" stroke-width="5"/>
    <circle cx="160" cy="900" r="7" fill="#4a1414" stroke-width="3"/>
  </g>
  <!-- Tuyau vertical de premier plan, à droite -->
  <g fill="none">
    <path d="M720 0 V1334" stroke="#05060c" stroke-width="64"/>
    <path d="M720 0 V1334" stroke="#16181b" stroke-width="52"/>
    <path d="M680 300 h80 M680 760 h80" stroke="#05060c" stroke-width="14"/>
  </g>
  <rect x="0" y="0" width="750" height="1334" fill="#05060c" opacity="0.06"/>
  <rect x="0" y="1040" width="750" height="294" fill="#05060c" opacity="0.15"/>
</svg>
