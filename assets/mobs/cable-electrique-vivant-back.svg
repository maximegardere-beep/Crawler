<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- Câble Électrique Vivant, Salle des Machines Infernales, cadrage « back » : il s'acharne à se brancher dans une prise bien trop petite. Aucun texte. -->
  <defs>
    <pattern id="cable-electrique-vivant-b-tole" width="110" height="70" patternUnits="userSpaceOnUse">
      <rect width="110" height="70" fill="#2c3136"/>
      <rect x="2" y="2" width="106" height="66" rx="5" fill="#373e45"/>
      <circle cx="12" cy="12" r="3" fill="#252a30"/>
      <circle cx="98" cy="12" r="3" fill="#252a30"/>
      <circle cx="12" cy="58" r="3" fill="#252a30"/>
      <circle cx="98" cy="58" r="3" fill="#252a30"/>
      <path d="M0 35 h110" stroke="#252a30" stroke-width="5"/>
      <rect x="20" y="16" width="26" height="12" rx="2" fill="#3f4750"/>
      <rect x="64" y="44" width="26" height="12" rx="2" fill="#3f4750"/>
    </pattern>
    <radialGradient id="cable-electrique-vivant-b-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde047" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Mur de tôle, plafond à tuyaux -->
  <rect x="0" y="0" width="750" height="700" fill="url(#cable-electrique-vivant-b-tole)"/>
  <rect x="0" y="0" width="750" height="60" fill="#22262b"/>
  <g fill="none" stroke-linecap="round">
    <path d="M0 84 H750" stroke="#05060c" stroke-width="22"/>
    <path d="M0 84 H750" stroke="#2f353b" stroke-width="13"/>
    <path d="M120 84 V150 H40 V230" stroke="#05060c" stroke-width="18"/>
    <path d="M120 84 V150 H40 V230" stroke="#2f353b" stroke-width="9"/>
  </g>
  <!-- Engrenage et manomètres -->
  <g stroke="#05060c" stroke-width="5" stroke-linejoin="round">
    <path d="M598 196 l12 -3 l5 -15 l15 3 l8 -12 l14 8 l12 -6 l6 15 l15 2 l-2 15 l12 10 l-10 12 l3 15 l-15 5 l-5 15 l-15 -3 l-8 12 l-14 -8 l-12 6 l-6 -15 l-15 -2 l2 -15 l-12 -10 l10 -12 Z" fill="#363c42"/>
    <circle cx="630" cy="218" r="16" fill="#2a2f35"/>
    <circle cx="200" cy="250" r="24" fill="#333b42"/>
    <circle cx="256" cy="250" r="18" fill="#333b42"/>
    <path d="M200 250 l14 -12 M256 250 l12 6" stroke="#ef4444" stroke-width="4"/>
    <path d="M296 160 h26 v-12 a13 13 0 0 0 -26 0 Z" fill="#7f1d1d"/>
  </g>
  <ellipse cx="309" cy="152" rx="46" ry="32" fill="#ef4444" opacity="0.12"/>
  <!-- Armoire électrique avec la minuscule prise murale -->
  <g stroke="#05060c" stroke-width="6">
    <rect x="70" y="330" width="170" height="370" rx="8" fill="#323940"/>
    <path d="M86 380 h138 M86 440 h138 M86 620 h138 M86 670 h138" stroke-width="4"/>
    <circle cx="106" cy="380" r="6" fill="#4ade80"/>
    <circle cx="106" cy="620" r="6" fill="#ef4444"/>
    <rect x="166" y="506" width="32" height="44" rx="5" fill="#d6d0c0" stroke-width="4"/>
    <path d="M178 520 v9 M186 520 v9" stroke-width="3"/>
  </g>
  <!-- Panneau de danger illisible -->
  <g stroke="#05060c" stroke-width="5">
    <path d="M450 300 l22 38 h-44 Z" fill="#3d4750"/>
    <path d="M450 312 v14 M450 332 v3" stroke="#fbbf24" stroke-width="6"/>
  </g>
  <!-- Sol en caillebotis -->
  <rect x="0" y="700" width="750" height="634" fill="#282d33"/>
  <path d="M0 700 H750" stroke="#05060c" stroke-width="5"/>
  <g stroke="#1f2328" stroke-width="5">
    <path d="M0 740 H750 M0 800 H750 M0 890 H750 M0 1020 H750 M0 1200 H750"/>
    <path d="M375 700 L375 1334 M260 700 L120 1334 M490 700 L630 1334 M150 700 L-140 1334 M600 700 L890 1334"/>
  </g>
  <!-- Vapeur au sol -->
  <path d="M560 700 q-10 -30 12 -44 q-2 -28 24 -32 q26 2 22 28 q22 12 10 40 Z" fill="#6b7280" opacity="0.25"/>

  <!-- Halo des étincelles à la prise -->
  <circle cx="196" cy="528" r="100" fill="url(#cable-electrique-vivant-b-glow)"/>
  <ellipse cx="400" cy="708" rx="140" ry="16" fill="#05060c" opacity="0.5"/>

  <!-- ===== LE CÂBLE, de trois-quarts dos ===== -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- deux câbles noués entre eux à force de se tortiller -->
    <path d="M370 590 C340 630 330 660 340 690 C350 712 300 712 296 700" stroke="#05060c" stroke-width="24"/>
    <path d="M370 590 C340 630 330 660 340 690 C350 712 300 712 296 700" stroke="#7a3a1c" stroke-width="15"/>
    <path d="M440 590 C470 620 500 650 520 700" stroke="#05060c" stroke-width="24"/>
    <path d="M440 590 C470 620 500 650 520 700" stroke="#7a3a1c" stroke-width="15"/>
    <path d="M400 598 C380 630 440 640 420 660 C396 684 460 690 468 706" stroke="#05060c" stroke-width="24"/>
    <path d="M400 598 C380 630 440 640 420 660 C396 684 460 690 468 706" stroke="#7a3a1c" stroke-width="15"/>
    <path d="M420 598 C450 630 380 640 404 662 C424 684 370 694 360 706" stroke="#05060c" stroke-width="24"/>
    <path d="M420 598 C450 630 380 640 404 662 C424 684 370 694 360 706" stroke="#7a3a1c" stroke-width="15"/>
    <!-- le noeud -->
    <circle cx="412" cy="661" r="15" fill="#7a3a1c" stroke="#05060c" stroke-width="5"/>
  </g>
  <g stroke-linecap="round">
    <path d="M296 700 l-16 4 M298 702 l-6 12 M468 706 l12 8 M360 706 l-12 8 M520 700 l14 4 M522 704 l6 12" stroke="#05060c" stroke-width="8"/>
    <path d="M296 700 l-16 4 M298 702 l-6 12 M468 706 l12 8 M360 706 l-12 8 M520 700 l14 4 M522 704 l6 12" stroke="#c97a3a" stroke-width="3"/>
  </g>
  <!-- Boule vue de dos (pas d'oeil de ce côté) -->
  <g stroke="#05060c" stroke-linejoin="round">
    <circle cx="410" cy="500" r="104" fill="#c97a3a" stroke-width="8"/>
    <path d="M490 430 C530 500 500 580 430 602 C480 560 506 500 490 430 Z" fill="#a8612c"/>
    <path d="M330 440 C344 420 368 408 392 404" fill="none" stroke="#e8a46a" stroke-width="10" stroke-linecap="round"/>
    <path d="M320 530 C370 556 450 560 500 534" fill="none" stroke="#a8612c" stroke-width="5"/>
    <path d="M340 566 C390 586 440 586 484 566" fill="none" stroke="#a8612c" stroke-width="5"/>
    <!-- étiquette de fabricant au dos, illisible -->
    <rect x="420" y="450" width="44" height="26" rx="4" fill="#e8e4d8" stroke-width="4" transform="rotate(10 442 463)"/>
    <path d="M428 460 h26 M428 467 h18" stroke="#9ca3af" stroke-width="3" transform="rotate(10 442 463)"/>
  </g>
  <!-- La prise de la créature, de profil, écrasée contre la petite prise murale -->
  <g stroke="#05060c" stroke-linejoin="round" stroke-width="6">
    <path d="M300 490 L326 486 L328 546 L302 550 Z" fill="#1c2028"/>
    <path d="M250 492 L302 486 L304 552 L252 556 Z" fill="#2a2f3a"/>
    <rect x="204" y="500" width="50" height="12" rx="3" fill="#b8b2a0" stroke-width="4" transform="rotate(-8 235 506)"/>
    <rect x="206" y="530" width="50" height="12" rx="3" fill="#b8b2a0" stroke-width="4" transform="rotate(10 237 536)"/>
  </g>
  <!-- Câble tendu qui pousse contre le mur pour forcer -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M340 560 C300 600 260 610 244 650" stroke="#05060c" stroke-width="22"/>
    <path d="M340 560 C300 600 260 610 244 650" stroke="#7a3a1c" stroke-width="13"/>
  </g>
  <g stroke-linecap="round">
    <path d="M244 650 l-6 14 M246 652 l10 10 M242 648 l-14 2" stroke="#05060c" stroke-width="8"/>
    <path d="M244 650 l-6 14 M246 652 l10 10 M242 648 l-14 2" stroke="#c97a3a" stroke-width="3"/>
  </g>
  <!-- Étincelle zigzag au-dessus, et petites étincelles d'agacement -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M470 418 L500 394 L478 386 L512 356" stroke="#05060c" stroke-width="15"/>
    <path d="M470 418 L500 394 L478 386 L512 356" stroke="#fde047" stroke-width="8"/>
    <path d="M166 500 l-16 -12 M162 530 l-22 2 M170 560 l-14 16 M196 494 l-2 -22" stroke="#fde047" stroke-width="5"/>
  </g>
  <g fill="#fde047" stroke="#05060c" stroke-width="3">
    <circle cx="140" cy="470" r="5"/><circle cx="136" cy="586" r="4"/><circle cx="260" cy="470" r="4"/>
  </g>
  <!-- Petites bouffées de fumée de frustration -->
  <g fill="#5d6468" stroke="#05060c" stroke-width="3" opacity="0.85">
    <path d="M520 380 q2 -18 20 -18 q10 -14 26 -4 q16 4 8 20 q-10 12 -26 6 q-18 6 -28 -4 Z"/>
    <path d="M300 410 q2 -14 16 -14 q8 -12 20 -2 q12 4 6 16 q-8 8 -20 4 q-14 4 -22 -4 Z"/>
  </g>

  <!-- Premier plan : cachette derrière une grosse armoire et une conduite -->
  <rect x="0" y="0" width="750" height="1334" fill="#05060c" opacity="0.12"/>
  <g stroke="#05060c" stroke-width="6" stroke-linejoin="round">
    <path d="M580 360 L750 346 L750 1334 L596 1334 Z" fill="#15181c"/>
    <path d="M594 420 L750 408 M598 620 L750 610 M602 820 L750 812" stroke="#0b0c0f" stroke-width="6"/>
    <rect x="616" y="470" width="44" height="16" rx="5" fill="#262930" stroke="none"/>
    <rect x="620" y="680" width="44" height="16" rx="5" fill="#262930" stroke="none"/>
    <circle cx="640" cy="910" r="7" fill="#3b1414" stroke="none"/>
    <path d="M582 360 L750 346 L750 376 L584 390 Z" fill="#1d2025"/>
    <path d="M0 980 L300 960 L320 1334 H0 Z" fill="#14161a"/>
    <path d="M0 970 L304 952 L306 984 L0 1004 Z" fill="#1d2025"/>
    <path d="M30 1090 h250 M30 1210 h260" stroke="#0b0c0f" stroke-width="5"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M560 1334 C560 1100 576 1000 594 940" stroke="#05060c" stroke-width="36"/>
    <path d="M560 1334 C560 1100 576 1000 594 940" stroke="#1a1d22" stroke-width="24"/>
  </g>
</svg>
