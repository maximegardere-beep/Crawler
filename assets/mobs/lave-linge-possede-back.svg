  <g fill="none" stroke="#9fdcef" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <path d="M276 330 Q300 360 330 372"/><path d="M262 420 Q296 430 326 424"/><path d="M500 300 Q480 330 470 350"/>
  </g>
  <g stroke="#05060c" stroke-width="3.5" stroke-linejoin="round">
    <path d="M262 300 L300 330 L292 342 L286 338 L276 356 C272 364 258 362 258 352 L266 334 L254 324 Z" fill="#5a4a6b"/>
    
    <path d="M500 270 L520 300 L508 306 L504 300 L488 314 C482 320 472 312 478 304 L494 292 L488 280 Z" fill="#3a5a6b"/>
    <path d="M274 400 L310 404 L310 416 L302 416 L300 434 C300 442 286 442 286 434 L288 416 L274 414 Z" fill="#6b6040" transform="rotate(-20 292 420)"/>
  </g>
  <!-- LE LAVE-LINGE, de trois-quarts dos, le hublot collé à la niche : il gobe en plein essorage -->
  <g stroke="#05060c" stroke-linejoin="round" stroke-linecap="round" transform="rotate(3 420 520)">
    <!-- Traits de tremblement -->
    <path d="M302 352 L336 338 L528 334 L528 684 L338 682 L306 690 Z" fill="none" stroke="#d6d2c4" stroke-width="5" opacity="0.3" transform="translate(-14 -4)"/>
    <path d="M314 352 L348 338 L540 334 L540 684 L350 682 L318 690 Z" fill="none" stroke="#d6d2c4" stroke-width="5" opacity="0.3" transform="translate(14 -4)"/>
    <g fill="none" stroke="#e8e4d8" stroke-width="6" opacity="0.75">
      <path d="M296 380 q-14 40 0 80 M282 400 q-10 30 0 60"/>
      <path d="M546 376 q14 40 0 80 M560 396 q10 30 0 60"/>
      <path d="M300 560 q-12 30 0 60 M546 560 q12 30 0 60"/>
    </g>
    <!-- Pieds -->
    <rect x="330" y="676" width="50" height="28" rx="6" fill="#8a8578" stroke-width="5"/>
    <rect x="478" y="672" width="50" height="28" rx="6" fill="#8a8578" stroke-width="5"/>
    <!-- Flanc gauche -->
    <path d="M314 352 L348 338 L350 682 L318 690 Z" fill="#a8a395" stroke-width="7"/>
    <path d="M322 420 L344 412 M322 520 L346 512 M322 620 L346 612" fill="none" stroke="#8a8578" stroke-width="4"/>
    <!-- Dos -->
