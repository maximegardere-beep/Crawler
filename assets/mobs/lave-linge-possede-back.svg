<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- Lave-Linge Possédé, Catacombes des Chaussettes Perdues, cadrage « dos ». Aucun texte. -->
  <defs>
    <pattern id="lave-linge-possede-b-pierre" width="72" height="42" patternUnits="userSpaceOnUse">
      <rect width="72" height="42" fill="#2a2622"/>
      <rect x="1.5" y="1.5" width="33" height="18" rx="3" fill="#35302a"/>
      <rect x="37.5" y="1.5" width="33" height="18" rx="3" fill="#3a342c"/>
      <rect x="-16" y="22.5" width="33" height="18" rx="3" fill="#3a342c"/>
      <rect x="20" y="22.5" width="33" height="18" rx="3" fill="#35302a"/>
      <rect x="56" y="22.5" width="33" height="18" rx="3" fill="#37312a"/>
    </pattern>
    <radialGradient id="lave-linge-possede-b-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fd6f0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7fd6f0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Mur de pierre et voûte -->
  <rect x="0" y="0" width="750" height="700" fill="url(#lave-linge-possede-b-pierre)"/>
  <path d="M0 0 H750 V80 Q375 14 0 80 Z" fill="#100e0c"/>
  <path d="M0 80 Q375 14 750 80" fill="none" stroke="#05060c" stroke-width="5"/>
  <!-- Fil à linge (déjà à moitié vide) -->
  <path d="M-10 130 Q375 200 760 130" fill="none" stroke="#6b6f75" stroke-width="3"/>
  <g stroke="#05060c" stroke-width="2.5" opacity="0.75">
    <path d="M80 142 v30 q0 10 10 10 h16 v-10 h-10 v-30 Z" fill="#5a4a6b"/>
    <path d="M610 160 v30 q0 10 10 10 h16 v-10 h-10 v-30 Z" fill="#4a5b3a"/>
  </g>
  <g fill="none" stroke="#6b6f75" stroke-width="3"><path d="M300 166 l4 10 l-6 4 M470 168 l-4 10 l6 4"/></g>
  <!-- Torches -->
  <ellipse cx="90" cy="320" rx="100" ry="84" fill="#ffb347" opacity="0.08"/>
  <ellipse cx="664" cy="320" rx="100" ry="84" fill="#ffb347" opacity="0.08"/>
  <g stroke="#05060c" stroke-width="4">
    <path d="M80 344 L100 344 L94 384 L86 384 Z" fill="#3a2a1c"/>
    <path d="M654 344 L674 344 L668 384 L660 384 Z" fill="#3a2a1c"/>
    <path d="M90 340 C76 326 82 306 90 292 C98 306 104 324 90 340 Z" fill="#e8892a"/>
    <path d="M664 340 C650 326 656 306 664 292 C672 306 678 324 664 340 Z" fill="#e8892a"/>
  </g>
  <!-- Petite niche à chaussettes à droite -->
  <path d="M560 560 V470 Q560 424 608 424 Q656 424 656 470 V560 Z" fill="#0d0c10" stroke="#05060c" stroke-width="5"/>
  <g stroke="#05060c" stroke-width="2.5" opacity="0.7">
    <path d="M578 500 v30 q0 9 9 9 h14 v-9 h-9 v-30 Z" fill="#6b6040"/>
    <path d="M614 508 v28 q0 9 9 9 h14 v-9 h-9 v-28 Z" fill="#3a5a6b"/>
  </g>
  <!-- Grande niche que le lave-linge est en train de piller -->
  <path d="M250 600 V380 Q250 268 400 268 Q550 268 550 380 V600 Z" fill="#0d0c10" stroke="#05060c" stroke-width="6"/>
  <!-- Lueur bleue de son hublot, qui éclabousse la niche devant lui -->
  <ellipse cx="410" cy="470" rx="210" ry="170" fill="url(#lave-linge-possede-b-glow)"/>
  <!-- Sol dallé -->
  <rect x="0" y="700" width="750" height="634" fill="#26221e"/>
  <path d="M0 700 H750" stroke="#05060c" stroke-width="5"/>
  <g stroke="#12100e" stroke-width="4" fill="none">
    <path d="M0 760 H750 M0 850 H750 M0 990 H750 M0 1180 H750"/>
    <path d="M180 700 L90 1334 M340 700 L320 1334 M480 700 L540 1334 M630 700 L760 1250"/>
  </g>
  <!-- Flaque de mousse et ombre -->
  <ellipse cx="420" cy="712" rx="170" ry="20" fill="#05060c" opacity="0.5"/>
  <path d="M250 716 C270 700 320 704 350 710 C400 696 470 708 520 704 C560 704 600 712 600 724 C560 738 470 736 410 738 C340 740 270 736 250 716 Z" fill="#bfe3ef" opacity="0.45" stroke="#05060c" stroke-width="3"/>
