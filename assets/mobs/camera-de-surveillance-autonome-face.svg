<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- Caméra de Surveillance Autonome, Studio de Télé-Achat Abandonné, cadrage « face ». Aucun texte. -->
  <defs>
    <pattern id="camera-de-surveillance-autonome-f-mur" width="100" height="60" patternUnits="userSpaceOnUse">
      <rect width="100" height="60" fill="#1e1c2e"/>
      <rect x="2" y="2" width="96" height="56" rx="4" fill="#26233c"/>
      <circle cx="20" cy="18" r="3" fill="#2e2a48"/>
      <circle cx="72" cy="40" r="4" fill="#2e2a48"/>
      <circle cx="48" cy="50" r="2.5" fill="#2e2a48"/>
    </pattern>
    <radialGradient id="camera-de-surveillance-autonome-f-flash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0fbff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Mur du plateau, rampe de projecteurs -->
  <rect x="0" y="0" width="750" height="1040" fill="url(#camera-de-surveillance-autonome-f-mur)"/>
  <rect x="0" y="0" width="750" height="64" fill="#171526"/>
  <g stroke="#05060c" stroke-width="7">
    <path d="M0 120 H750" stroke="#3a3652" stroke-width="14"/>
    <rect x="70" y="120" width="60" height="44" rx="8" fill="#3a3652"/>
    <ellipse cx="100" cy="240" rx="90" ry="70" fill="#fde047" opacity="0.07"/>
    <rect x="620" y="120" width="60" height="44" rx="8" fill="#3a3652"/>
    <ellipse cx="650" cy="240" rx="90" ry="70" fill="#fde047" opacity="0.07"/>
  </g>
  <!-- Enseigne « à l'antenne » (formes illisibles) -->
  <g stroke="#05060c" stroke-width="6">
    <rect x="285" y="62" width="180" height="58" rx="12" fill="#2a1a24"/>
    <g fill="#f43f5e" stroke="none" opacity="0.55">
      <rect x="305" y="80" width="24" height="22" rx="10"/><rect x="337" y="80" width="18" height="22" rx="4"/>
      <rect x="378" y="80" width="18" height="22" rx="4"/><rect x="402" y="80" width="10" height="22" rx="3"/><rect x="420" y="80" width="24" height="22" rx="6"/>
    </g>
  </g>
  <ellipse cx="375" cy="96" rx="130" ry="50" fill="#f43f5e" opacity="0.06"/>
  <!-- Décor en carton (palmier et soleil de télé-achat), à gauche -->
  <g stroke="#05060c" stroke-width="6" stroke-linejoin="round">
    <path d="M40 760 L52 520 L76 520 L88 760 Z" fill="#3a3044"/>
    <path d="M64 520 q-70 -10 -90 30 q50 -28 90 -16 q-30 -50 -86 -50 q60 -10 86 32 q10 -60 60 -74 q-30 40 -40 76 q60 -30 104 6 q-60 -6 -104 6 q50 10 70 54 q-40 -34 -70 -48 Z" fill="#2f3a36"/>
    <circle cx="190" cy="430" r="44" fill="#4a3c34"/>
    <path d="M20 760 h190 v26 h-190 Z" fill="#33304e"/>
    <path d="M150 786 l-14 40 M60 786 l12 40" stroke-width="7"/>
  </g>
  <!-- Grosse caméra de plateau sur trépied, à droite : la vieille collègue -->
  <g stroke="#05060c" stroke-width="6" stroke-linejoin="round">
    <path d="M660 640 L610 900 M660 640 L700 900 M660 640 L670 905" fill="none" stroke="#2c2a3e" stroke-width="12"/>
    <path d="M660 640 L610 900 M660 640 L700 900 M660 640 L670 905" fill="none" stroke-width="3"/>
    <rect x="610" y="560" width="140" height="84" rx="10" fill="#33304e"/>
    <rect x="580" y="578" width="40" height="48" rx="6" fill="#26233c"/>
    <ellipse cx="580" cy="602" rx="12" ry="22" fill="#1a2430"/>
    <circle cx="700" cy="580" r="6" fill="#7a2a33"/>
  </g>
  <!-- Plancher -->
  <rect x="0" y="1040" width="750" height="294" fill="#232038"/>
  <path d="M0 1040 H750" stroke="#05060c" stroke-width="6"/>
  <g fill="none" stroke="#1a1828" stroke-width="6">
    <path d="M0 1110 H750 M0 1200 H750 M0 1290 H750"/>
    <path d="M170 1040 l-60 70 M430 1040 l-10 70 M640 1040 l50 70 M80 1110 l-40 90 M330 1110 l-20 90 M560 1110 l40 90"/>
  </g>
  <rect x="0" y="0" width="55" height="1334" fill="#05060c" opacity="0.24"/>
  <rect x="695" y="0" width="55" height="1334" fill="#05060c" opacity="0.24"/>

  <!-- Halo de flash irrégulier derrière l'objectif -->
  <path d="M360 230 C520 220 640 330 640 480 C650 610 560 700 420 720 C280 740 150 660 130 520 C110 380 220 240 360 230 Z" fill="#22d3ee" opacity="0.08"/>
  <path d="M370 330 C470 320 550 390 548 480 C552 570 480 630 395 632 C300 640 230 580 222 495 C214 400 280 335 370 330 Z" fill="#22d3ee" opacity="0.1"/>
  <ellipse cx="380" cy="480" rx="260" ry="240" fill="url(#camera-de-surveillance-autonome-f-flash)"/>

  <!-- Ombre au sol, poussière -->
  <ellipse cx="380" cy="1036" rx="230" ry="30" fill="#05060c" opacity="0.5"/>
  <g fill="#3a3652" stroke="#05060c" stroke-width="4">
    <path d="M150 1030 q20 -34 50 -18 q24 -26 50 4 q14 22 -8 26 Z"/>
    <path d="M520 1034 q16 -26 40 -12 q22 -18 38 8 q8 16 -10 18 Z"/>
  </g>
  <!-- Lignes de mouvement (elle fonce vers nous en diagonale) -->
  <g fill="none" stroke="#8a929c" stroke-width="7" stroke-linecap="round" opacity="0.45">
    <path d="M640 330 h70 M660 380 h60 M650 760 h80 M670 820 h50"/>
  </g>

  <!-- ===== LA CAMÉRA ===== -->
  <g stroke="#05060c" stroke-linejoin="round" stroke-linecap="round" transform="rotate(-6 380 640)">
    <!-- Pied arrière (droite) et pied avant levé (gauche) -->
    <path d="M470 900 L590 890 L596 960 L478 972 Z" fill="#4f5560" stroke-width="9"/>
    <g transform="rotate(-10 270 960)">
      <path d="M196 920 L340 912 L348 996 L192 1006 Z" fill="#4f5560" stroke-width="10"/>
      <path d="M206 986 L340 980" stroke-width="5" fill="none"/>
    </g>
    <!-- Antenne + boule rouge (en haut à gauche, comme le sprite) -->
    <path d="M262 330 L236 150" stroke-width="12" fill="none"/>
    <path d="M262 330 L236 150" stroke="#4f5560" stroke-width="5" fill="none"/>
    <circle cx="234" cy="138" r="24" fill="#ef4444" stroke-width="8"/>
    <circle cx="226" cy="130" r="7" fill="#fca5a5" stroke="none"/>
    <!-- Flanc droit du boîtier (dans l'ombre) -->
    <path d="M560 320 L640 372 L648 870 L572 920 Z" fill="#4f5560" stroke-width="11"/>
    <g fill="none" stroke="#3a3f48" stroke-width="8"><path d="M590 450 L624 470 M590 490 L624 510 M590 530 L624 550 M590 570 L624 590"/></g>
    <!-- Face avant du boîtier -->
    <path d="M190 340 L560 320 L572 920 L178 936 Z" fill="#8a929c" stroke-width="12"/>
    <path d="M196 352 L552 334 L554 360 L196 378 Z" fill="#a3aab3" stroke="none"/>
    <path d="M520 360 L548 360 L560 900 L532 904 Z" fill="#6f7782" stroke="none"/>
    <!-- Voyant d'enregistrement (en haut à gauche) -->
    <circle cx="226" cy="372" r="28" fill="#ef4444" opacity="0.25" stroke="none"/>
    <circle cx="226" cy="372" r="14" fill="#ef4444" stroke-width="6"/>
    <circle cx="222" cy="367" r="4" fill="#fecaca" stroke="none"/>
    <!-- Panneau rouge (accent du sprite), à droite de l'objectif -->
    <rect x="470" y="380" width="66" height="50" rx="8" fill="#ef4444" stroke-width="7"/>
    <path d="M482 395 h42 M482 413 h28" stroke="#7f1d1d" stroke-width="6"/>
    <!-- Boîtier de l'objectif, braqué sur nous -->
    <path d="M232 470 C232 400 300 382 372 386 C450 390 506 420 504 500 C502 590 446 640 368 640 C286 640 232 580 232 470 Z" fill="#2a2f3a" stroke-width="12"/>
    <ellipse cx="366" cy="508" rx="118" ry="112" fill="#1b1f28" stroke-width="9"/>
    <ellipse cx="362" cy="514" rx="96" ry="92" fill="#3a4250" stroke-width="7"/>
    <g stroke="#55606e" stroke-width="6" fill="none"><path d="M290 470 l14 8 M286 540 l16 -4 M340 600 l4 -14 M420 594 l-8 -12 M440 470 l-14 8"/></g>
    <circle cx="360" cy="518" r="72" fill="#22d3ee" stroke-width="8"/>
    <circle cx="366" cy="526" r="44" fill="#0e7490" stroke-width="5"/>
    <circle cx="370" cy="530" r="24" fill="#05060c" stroke="none"/>
    <circle cx="336" cy="488" r="16" fill="#e0fbff" stroke="none" opacity="0.9"/>
    <circle cx="392" cy="556" r="7" fill="#e0fbff" stroke="none" opacity="0.7"/>
    <!-- Volets-sourcils furieux sur l'objectif -->
    <path d="M250 404 L360 446 L352 470 L240 432 Z" fill="#4f5560" stroke-width="8"/>
    <path d="M488 418 L382 448 L388 472 L500 446 Z" fill="#4f5560" stroke-width="8"/>
    <!-- Grille-bouche serrée (le petit trait du sprite) -->
    <rect x="300" y="672" width="150" height="40" rx="10" fill="#2a2f3a" stroke-width="8"/>
    <path d="M326 674 v36 M352 674 v36 M378 674 v36 M404 674 v36 M428 674 v36" stroke-width="5"/>
    <!-- Deux boulons (cercles sombres du sprite) -->
    <circle cx="262" cy="800" r="24" fill="#4f5560" stroke-width="7"/>
    <circle cx="350" cy="802" r="24" fill="#4f5560" stroke-width="7"/>
    <path d="M250 800 h24 M338 802 h24" stroke-width="5"/>
    <!-- Câble arraché qui fouette derrière -->
    <path d="M572 760 C640 760 680 700 700 640" fill="none" stroke-width="14"/>
    <path d="M572 760 C640 760 680 700 700 640" fill="none" stroke="#2a2f3a" stroke-width="7"/>
    <path d="M692 626 l20 -10 M700 640 l24 2" stroke="#fde047" stroke-width="5"/>
  </g>

  <!-- Éclats de flash (étoiles de crépitement) autour de l'objectif -->
  <g fill="#e0fbff" stroke="#05060c" stroke-width="4" stroke-linejoin="round">
    <path d="M168 470 l10 -34 l10 34 l34 10 l-34 10 l-10 34 l-10 -34 l-34 -10 Z"/>
    <path d="M206 300 l7 -22 l7 22 l22 7 l-22 7 l-7 22 l-7 -22 l-22 -7 Z" opacity="0.9"/>
    <path d="M150 640 l6 -20 l6 20 l20 6 l-20 6 l-6 20 l-6 -20 l-20 -6 Z" opacity="0.85"/>
  </g>
  <g fill="none" stroke="#e0fbff" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <path d="M120 470 h-40 M150 410 l-30 -22 M150 530 l-30 22 M250 260 l-16 -30"/>
  </g>
  <g fill="#22d3ee" stroke="none" opacity="0.8">
    <circle cx="120" cy="580" r="7"/><circle cx="160" cy="370" r="5"/><circle cx="100" cy="420" r="4"/><circle cx="210" cy="720" r="5"/>
  </g>
</svg>
