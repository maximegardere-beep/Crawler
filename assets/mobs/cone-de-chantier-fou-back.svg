    <path d="M-112 -680 Q-138 -520 -80 -356 L84 -356 Q140 -520 116 -680 Q2 -712 -112 -680 Z" fill="#e07a3a" stroke-width="10"/>
    <path d="M-112 -680 Q-70 -690 -60 -680 Q-100 -520 -44 -356 L-80 -356 Q-138 -520 -112 -680 Z" fill="#9a4a1c" opacity="0.5" stroke="none"/>
    <!-- couture du dos et étiquette de mannequin -->
    <path d="M6 -690 Q-6 -520 4 -360" fill="none" stroke="#6e3412" stroke-width="16"/>
    <path d="M6 -690 Q-6 -520 4 -360" fill="none" stroke="#e8e4d8" stroke-width="5" stroke-dasharray="14 14"/>
    <path d="M-124 -512 Q4 -496 128 -512" fill="none" stroke-width="8"/>
    <rect x="30" y="-640" width="34" height="22" rx="4" fill="#e8e4d8" stroke-width="6"/>
    <!-- moignon gauche, tendu vers les petits cônes, qui en tient un -->
    <path d="M-104 -650 Q-200 -610 -250 -520 Q-262 -490 -236 -478 Q-210 -472 -198 -504 Q-170 -570 -100 -596 Z" fill="#e07a3a" stroke-width="10"/>
    <g transform="translate(-236 -476) rotate(14) scale(1.45)">
      <path d="M-34 70 L-6 -16 L6 -16 L34 70 Z" fill="#e07a3a" stroke-width="9"/>
      <path d="M-20 28 h40" stroke="#e8e4d8" stroke-width="12"/>
      <rect x="-44" y="64" width="88" height="16" rx="4" fill="#9a4a1c" stroke-width="8"/>
    </g>
    <!-- moignon droit, posé sur la hanche, très professionnel -->
    <path d="M110 -640 Q170 -590 160 -500 Q156 -470 124 -470 L104 -500 Z" fill="#e07a3a" stroke-width="10"/>
    <!-- collerette du cône, vue de dos -->
    <path d="M-140 -638 L132 -638 L176 -668 L-98 -668 Z" fill="#c7672e" stroke-width="9"/>
    <!-- cône, de dos : bande sans visage -->
    <path d="M-104 -640 L4 -1010 Q14 -1030 26 -1010 L118 -640 Z" fill="#e07a3a" stroke-width="10"/>
    <path d="M-104 -640 L4 -1010 Q14 -1030 0 -980 L-48 -640 Z" fill="#9a4a1c" opacity="0.5" stroke="none"/>
    <path d="M-55 -806 L72 -806 L84 -760 L-68 -760 Z" fill="#e8e4d8" stroke-width="8"/>
    <path d="M-55 -806 L-30 -806 L-42 -760 L-68 -760 Z" fill="#a8a49a" stroke="none"/>
    <path d="M-140 -638 L132 -638 L136 -600 L-146 -600 Z" fill="#e07a3a" stroke-width="9"/>
    <path d="M132 -638 L176 -668 L180 -632 L136 -600 Z" fill="#9a4a1c" stroke-width="9"/>
  </g>
  <!-- Petits traits de concentration -->
  <g fill="none" stroke="#e8e4d8" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <path d="M470 290 l-10 -18 M500 280 l2 -20 M530 292 l12 -16"/>
  </g>
  <!-- Cachette : pilier sombre au premier plan et arrière d'une voiture garée -->
  <path d="M0 0 H170 V1334 H0 Z" fill="#141517" stroke="#05060c" stroke-width="6"/>
  <rect x="150" y="0" width="20" height="1334" fill="#1c1d20"/>
  <g fill="#3e3518" stroke="#05060c" stroke-width="4">
