    </g>
    <g transform="translate(330 726) rotate(-12)">
      <path d="M-13 0 L-3 -34 L3 -34 L13 0 Z" fill="#e07a3a"/><path d="M-8 -16 h16" stroke="#e8e4d8" stroke-width="5"/><rect x="-17" y="-4" width="34" height="6" rx="2" fill="#9a4a1c"/>
    </g>
    <g transform="translate(380 716)">
      <path d="M-12 0 L-3 -32 L3 -32 L12 0 Z" fill="#e07a3a"/><path d="M-7 -15 h14" stroke="#e8e4d8" stroke-width="5"/><rect x="-16" y="-4" width="32" height="6" rx="2" fill="#9a4a1c"/>
    </g>
    <g transform="translate(352 790) rotate(90)">
      <path d="M-15 0 L-3 -38 L3 -38 L15 0 Z" fill="#e07a3a"/><path d="M-9 -18 h18" stroke="#e8e4d8" stroke-width="5"/><rect x="-19" y="-4" width="38" height="7" rx="2" fill="#9a4a1c"/>
