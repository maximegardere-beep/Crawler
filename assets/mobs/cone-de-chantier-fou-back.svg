<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- Cône de Chantier Fou, Parking Souterrain Maudit, cadrage « dos » (tu l'as vu) : il balise
       avec le plus grand sérieux une zone de travaux autour d'une minuscule tache d'huile. Aucun texte. -->
  <defs>
    <pattern id="cone-de-chantier-fou-b-wall" width="120" height="70" patternUnits="userSpaceOnUse" patternTransform="scale(0.62)">
      <rect width="120" height="70" fill="#2e3032"/>
      <rect y="67" width="120" height="3" fill="#232527"/>
      <rect x="58" width="3" height="70" fill="#292b2d"/>
      <circle cx="28" cy="22" r="2.5" fill="#242628"/>
      <circle cx="92" cy="44" r="3" fill="#242628"/>
    </pattern>
    <radialGradient id="cone-de-chantier-fou-b-glow">
      <stop offset="0" stop-color="#dbeafe" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#dbeafe" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Mur du fond -->
  <rect x="0" y="0" width="750" height="580" fill="url(#cone-de-chantier-fou-b-wall)"/>
  <rect x="0" y="0" width="750" height="130" fill="#18191b"/>
  <g stroke="#05060c" stroke-width="4">
    <rect x="-10" y="100" width="770" height="16" fill="#2c2f33"/>
    <rect x="-10" y="60" width="770" height="12" fill="#25282b"/>
    <rect x="300" y="0" width="18" height="104" fill="#232528"/>
    <rect x="600" y="0" width="18" height="104" fill="#232528"/>
  </g>
  <ellipse cx="460" cy="200" rx="230" ry="120" fill="url(#cone-de-chantier-fou-b-glow)"/>
  <g stroke="#05060c" stroke-width="4">
    <rect x="380" y="130" width="170" height="14" rx="6" fill="#dbeafe"/>
    <path d="M400 116 v14 M530 116 v14" stroke-width="5"/>
  </g>
  <!-- Piliers rayés du fond -->
  <g stroke="#05060c" stroke-width="4">
    <rect x="236" y="150" width="56" height="440" fill="#323438"/>
    <rect x="660" y="150" width="56" height="440" fill="#323438"/>
  </g>
  <g fill="#a3852a" stroke="#05060c" stroke-width="3">
    <rect x="238" y="430" width="52" height="20"/>
    <rect x="238" y="474" width="52" height="20"/>
    <rect x="662" y="430" width="52" height="20"/>
    <rect x="662" y="474" width="52" height="20"/>
  </g>
  <!-- Plaques de place (illisibles) -->
  <g stroke="#05060c" stroke-width="4">
    <rect x="370" y="250" width="80" height="46" rx="5" fill="#3a3c40"/>
    <rect x="530" y="250" width="80" height="46" rx="5" fill="#3a3c40"/>
  </g>
  <g fill="#8a8c8f" opacity="0.5">
    <rect x="382" y="262" width="14" height="22" rx="3"/>
    <rect x="402" y="262" width="18" height="10" rx="3"/>
    <rect x="402" y="276" width="18" height="8" rx="3"/>
    <rect x="426" y="262" width="12" height="22" rx="3"/>
    <rect x="542" y="262" width="14" height="22" rx="3"/>
    <rect x="562" y="262" width="16" height="22" rx="6"/>
    <rect x="584" y="262" width="14" height="10" rx="3"/>
  </g>
  <!-- Sol en perspective, places de parking -->
  <rect x="0" y="580" width="750" height="754" fill="#242628"/>
  <path d="M0 580 H750" stroke="#05060c" stroke-width="5"/>
  <rect x="0" y="584" width="750" height="12" fill="#1d1f21"/>
  <g stroke="#6f6c62" stroke-width="7" opacity="0.75" fill="none">
    <path d="M330 600 L250 800"/>
    <path d="M520 600 L560 800"/>
    <path d="M700 600 L820 800"/>
