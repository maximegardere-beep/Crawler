    <path d="M40 -70 Q34 -112 74 -118 Q98 -124 118 -112 Q134 -100 128 -74 Q88 -60 40 -70 Z" fill="#7a7466" stroke-width="8"/>
    <rect x="-16" y="-270" width="34" height="200" rx="6" fill="#9a4a1c" stroke-width="9"/>
    <rect x="-90" y="-372" width="182" height="114" rx="38" fill="#e07a3a" stroke-width="10"/>
    <path d="M-86 -330 Q-90 -270 -50 -262 L-50 -368 Q-86 -366 -86 -330 Z" fill="#9a4a1c" opacity="0.5" stroke="none"/>
