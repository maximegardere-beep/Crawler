  <g fill="#101113">
    <path d="M20 560 l40 0 l-40 56 Z M90 560 l40 0 l-40 56 Z M20 660 l40 0 l-40 56 Z M90 660 l40 0 l-40 56 Z"/>
  </g>
  <path d="M170 0 V1334" stroke="#05060c" stroke-width="8"/>
  <path d="M430 1334 L470 1010 Q480 960 540 950 L790 930 L790 1334 Z" fill="#121315" stroke="#05060c" stroke-width="6"/>
  <path d="M480 1040 L790 1020" stroke="#1d1e21" stroke-width="18"/>
  <rect x="500" y="980" width="70" height="26" rx="6" fill="#3a1618" stroke="#05060c" stroke-width="5"/>
  <rect x="0" y="1040" width="750" height="294" fill="#05060c" opacity="0.2"/>
</svg>
