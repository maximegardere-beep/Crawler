  <g transform="translate(520 742) rotate(-10) scale(0.42)" stroke="#05060c" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-120 -54 L110 -54 L150 -84 L-80 -84 Z" fill="#b85a26" stroke-width="9"/>
    <path d="M-120 -54 L110 -54 L110 -4 Q110 6 100 6 L-110 6 Q-120 6 -120 -4 Z" fill="#9a4a1c" stroke-width="9"/>
