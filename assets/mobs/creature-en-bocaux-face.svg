        <ellipse cx="446" cy="512" rx="34" ry="31" fill="#f2efe4"/>
        <circle cx="332" cy="530" r="16" fill="#c23b3b" stroke-width="4"/>
        <circle cx="440" cy="522" r="15" fill="#c23b3b" stroke-width="4"/>
