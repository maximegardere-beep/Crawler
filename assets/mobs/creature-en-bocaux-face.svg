      <path d="M262 790 L262 420 C262 400 280 392 300 400 C330 412 350 400 380 404 C410 408 430 396 460 404 C490 410 510 404 518 420 L518 790 Z" fill="#6aa8a0" stroke="none"/>
      <path d="M470 410 C500 410 512 420 518 440 L518 790 L488 790 C496 660 494 520 470 410 Z" fill="#4a7a74" stroke="none" opacity="0.7"/>
