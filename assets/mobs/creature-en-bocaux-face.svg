    <path d="M590 250 q-6 14 0 22 q10 4 10 -6 q-2 -8 -10 -16 Z" fill="#79b8b0"/>
    <path d="M150 190 l18 -8 l-6 18 Z M600 330 l20 -4 l-10 16 Z M520 180 l14 -14 l2 18 Z" fill="#cde8e5" fill-opacity="0.7"/>
