  <g fill="#9aa5a0" opacity="0.35"><circle cx="90" cy="1020" r="12"/><circle cx="660" cy="1026" r="14"/><circle cx="700" cy="1005" r="8"/><circle cx="50" cy="1000" r="7"/></g>
</svg>
