      <path d="M248 300 L248 780 Q248 810 278 810 L502 810 Q532 810 532 780 L532 300 Z" fill="#cde8e5" fill-opacity="0.22" stroke-width="9"/>
      <path d="M248 300 Q390 286 532 300" fill="none" stroke-width="6"/>
      <path d="M272 330 L272 760" stroke="#f2fbfa" stroke-width="12" opacity="0.55"/>
      <path d="M296 330 L296 420" stroke="#f2fbfa" stroke-width="6" opacity="0.45"/>
      <path d="M508 340 L508 520" stroke="#f2fbfa" stroke-width="6" opacity="0.3"/>
      <!-- fêlure -->
      <path d="M506 640 l-22 20 l14 12 l-24 26 M484 660 l-20 -6" fill="none" stroke="#f2fbfa" stroke-width="4" opacity="0.8"/>
