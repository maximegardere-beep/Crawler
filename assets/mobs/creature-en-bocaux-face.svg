    <path d="M110 1044 C70 980 110 880 170 820 C200 790 186 650 206 560 C232 460 300 420 396 420 C490 420 560 460 588 560 C604 640 610 790 630 850 C668 930 676 1000 640 1044 Z" fill="#79b8b0" stroke-width="10"/>
