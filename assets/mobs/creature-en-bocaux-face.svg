  <!-- lignes de mouvement et projections -->
  <g fill="none" stroke="#cde8e5" stroke-width="5" stroke-linecap="round" opacity="0.5">
    <path d="M40 600 q-10 30 0 60 M30 760 q20 20 40 20 M700 420 q20 30 10 60"/>
