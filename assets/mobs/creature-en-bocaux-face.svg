        <path d="M256 262 h268" stroke="#b3bac2" stroke-width="7"/>
        <path d="M268 292 v-12 M310 292 v-12 M352 292 v-12 M394 292 v-12 M436 292 v-12 M478 292 v-12 M520 292 v-12" stroke-width="4"/>
      </g>
    </g>
