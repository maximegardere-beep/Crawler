    <g transform="translate(240 800) scale(1.3) translate(-240 -800)">
    <path d="M190 840 C130 820 70 760 60 690 C52 640 90 610 120 630 C150 650 126 690 140 730 C150 760 200 780 240 790 Z" fill="#79b8b0" stroke-width="9"/>
    <path d="M60 690 C52 640 90 610 120 630 C104 628 84 646 86 680 Z" fill="#4a7a74" stroke="none"/>
    <g fill="#4a7a74" stroke-width="4"><circle cx="96" cy="740" r="10"/><circle cx="136" cy="784" r="10"/><circle cx="84" cy="700" r="8"/></g>
    </g>
