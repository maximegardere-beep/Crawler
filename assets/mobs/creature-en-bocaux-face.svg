      <path d="M350 604 l12 16 l10 -18 l12 16 l10 -18 l12 16 l10 -16 l12 14" fill="#f2efe4" stroke-width="4"/>
      <path d="M372 664 q26 -24 54 -8" fill="#c23b3b" stroke-width="4"/>
