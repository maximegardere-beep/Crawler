<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- Ombre Suspicieuse, mob de la Rue des Illusions, cadrage « face ». Silhouette shade (drap d'ombre
       sans jambes), palette du sprite : base #3a4152, sombre #232836, accent #ffd76a. Détail signature :
       fedora à bande, col relevé, yeux jaunes plissés. Elle fond sur nous, griffe tendue, détachée par le
       halo du réverbère dans son dos et un liseré de lumière. Aucun texte. 22 % du bas : sol et brume. -->
  <defs>
    <pattern id="ombre-suspicieuse-f-bricks" width="84" height="44" patternUnits="userSpaceOnUse">
      <rect width="84" height="44" fill="#110e15"/>
      <rect x="2" y="2" width="38" height="18" rx="2" fill="#221c2a"/>
      <rect x="44" y="2" width="38" height="18" rx="2" fill="#1d1824"/>
      <rect x="-19" y="24" width="38" height="18" rx="2" fill="#1d1824"/>
      <rect x="23" y="24" width="38" height="18" rx="2" fill="#241e2d"/>
      <rect x="65" y="24" width="38" height="18" rx="2" fill="#1d1824"/>
    </pattern>
    <radialGradient id="ombre-suspicieuse-f-halo">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#fbbf24" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="750" height="1040" fill="url(#ombre-suspicieuse-f-bricks)"/>
  <!-- Ciel de nuit -->
  <rect x="0" y="0" width="750" height="120" fill="#07080f"/>
  <g fill="#c9c2d8" opacity="0.6"><circle cx="300" cy="40" r="3"/><circle cx="420" cy="78" r="2"/><circle cx="520" cy="30" r="3"/><circle cx="250" cy="96" r="2"/></g>
  <path d="M0 120 H750" stroke="#05060c" stroke-width="5"/>
  <!-- Façade de gauche, de travers (illusion) -->
  <g stroke="#05060c" stroke-width="5">
    <path d="M20 70 L215 92 L230 1040 L0 1040 L0 72 Z" fill="#2b2336"/>
    <path d="M10 60 L225 84 L222 100 L8 78 Z" fill="#05060c" opacity="0.6"/>
    <g stroke-width="3">
      <rect x="34" y="140" width="46" height="56" fill="#0b0d14"/>
      <rect x="120" y="150" width="46" height="56" fill="#e8c46a" fill-opacity="0.35"/>
      <rect x="36" y="260" width="46" height="56" fill="#0b0d14"/>
      <rect x="124" y="270" width="46" height="56" fill="#0b0d14"/>
      <rect x="38" y="380" width="46" height="56" fill="#e8c46a" fill-opacity="0.35"/>
      <rect x="128" y="390" width="46" height="56" fill="#0b0d14"/>
      <rect x="40" y="500" width="46" height="56" fill="#0b0d14"/>
      <rect x="132" y="510" width="46" height="56" fill="#0b0d14"/>
    </g>
    <path d="M120 178 h46 M38 408 h46" stroke="#5a4a36" stroke-width="3" opacity="0.7"/>
  </g>
  <!-- Façade de droite -->
  <g stroke="#05060c" stroke-width="5">
    <path d="M590 140 L750 128 L750 1040 L604 1040 Z" fill="#262032"/>
    <g stroke-width="3">
      <rect x="616" y="200" width="44" height="54" fill="#0b0d14"/>
      <rect x="690" y="196" width="44" height="54" fill="#0b0d14"/>
      <rect x="620" y="320" width="44" height="54" fill="#e8c46a" fill-opacity="0.3"/>
      <rect x="694" y="316" width="44" height="54" fill="#0b0d14"/>
    </g>
  </g>
  <!-- Halo du réverbère, dans le dos de l'ombre -->
  <circle cx="455" cy="330" r="390" fill="url(#ombre-suspicieuse-f-halo)"/>
  <!-- Réverbère -->
  <g stroke="#05060c" stroke-width="5" stroke-linecap="round">
    <rect x="560" y="150" width="20" height="890" fill="#22252c"/>
    <path d="M570 152 Q570 110 500 112" fill="none" stroke="#05060c" stroke-width="20"/>
    <path d="M570 152 Q570 110 500 112" fill="none" stroke="#22252c" stroke-width="10"/>
    <path d="M462 112 L540 112 L528 146 L474 146 Z" fill="#2b2e35"/>
    <ellipse cx="501" cy="150" rx="22" ry="10" fill="#fde68a"/>
    <rect x="550" y="1000" width="40" height="40" fill="#1b1d23"/>
  </g>
  <!-- Sol pavé -->
  <rect x="0" y="1040" width="750" height="294" fill="#27242d"/>
  <path d="M0 1040 H750" stroke="#05060c" stroke-width="6"/>
  <g fill="#222029" stroke="#141218" stroke-width="5">
    <ellipse cx="60" cy="1080" rx="50" ry="18"/><ellipse cx="190" cy="1078" rx="56" ry="18"/><ellipse cx="330" cy="1082" rx="52" ry="18"/>
    <ellipse cx="470" cy="1078" rx="56" ry="18"/><ellipse cx="610" cy="1082" rx="50" ry="18"/><ellipse cx="720" cy="1078" rx="40" ry="18"/>
    <ellipse cx="120" cy="1140" rx="62" ry="22"/><ellipse cx="270" cy="1144" rx="62" ry="22"/><ellipse cx="420" cy="1140" rx="62" ry="22"/>
    <ellipse cx="570" cy="1144" rx="62" ry="22"/><ellipse cx="710" cy="1140" rx="50" ry="22"/>
    <ellipse cx="40" cy="1215" rx="64" ry="26"/><ellipse cx="200" cy="1220" rx="70" ry="26"/><ellipse cx="370" cy="1215" rx="70" ry="26"/>
    <ellipse cx="540" cy="1220" rx="70" ry="26"/><ellipse cx="700" cy="1215" rx="64" ry="26"/>
    <ellipse cx="110" cy="1300" rx="76" ry="30"/><ellipse cx="290" cy="1300" rx="76" ry="30"/><ellipse cx="470" cy="1300" rx="76" ry="30"/><ellipse cx="650" cy="1300" rx="76" ry="30"/>
  </g>
  <ellipse cx="520" cy="1060" rx="150" ry="30" fill="#fbbf24" opacity="0.07"/>
  <rect x="0" y="0" width="50" height="1334" fill="#05060c" opacity="0.25"/>
  <rect x="700" y="0" width="50" height="1334" fill="#05060c" opacity="0.25"/>
  <!-- Aura de suspicion irrégulière + volutes -->
  <path d="M220 330 C200 220 330 150 440 170 C580 190 640 300 620 430 C680 580 700 760 650 900 C540 990 330 1000 200 960 C110 870 140 660 180 560 C140 480 190 400 220 330 Z" fill="#8a96c8" opacity="0.09"/>
  <path d="M260 330 C260 250 350 210 440 220 C540 235 590 320 575 430 C620 560 640 740 600 860 C500 930 340 940 250 900 C200 810 210 640 230 560 C200 480 240 400 260 330 Z" fill="#8a96c8" opacity="0.1"/>
  <g fill="#ffd76a" opacity="0.55"><circle cx="190" cy="300" r="6"/><circle cx="650" cy="520" r="5"/><circle cx="160" cy="720" r="7"/><circle cx="660" cy="300" r="4"/></g>
  <!-- Lignes de mouvement (elle vient de la gauche, au fond) -->
  <g stroke="#6b6084" stroke-width="7" stroke-linecap="round" opacity="0.55"><path d="M120 640 l-80 -24 M110 720 l-90 -14 M130 800 l-80 0 M150 880 l-70 14"/></g>
  <ellipse cx="420" cy="1052" rx="230" ry="28" fill="#05060c" opacity="0.5"/>
  <g transform="rotate(7 400 620)" stroke="#05060c" stroke-linejoin="round" stroke-linecap="round">
    <!-- Bras arrière : volute repliée, poing serré -->
    <path d="M280 560 C220 560 170 520 160 470" fill="none" stroke-width="54"/>
    <path d="M280 560 C220 560 170 520 160 470" fill="none" stroke="#232836" stroke-width="42"/>
    <circle cx="160" cy="462" r="30" fill="#232836" stroke-width="8"/>
    <path d="M144 452 h28 M144 468 h26" fill="none" stroke-width="4"/>
    <!-- Corps-drap d'ombre : traîne qui se dissout en bas à gauche -->
    <path d="M395 250 C500 250 548 340 542 470 C560 600 580 720 604 850 C572 836 548 882 516 862 C490 906 456 870 430 906 C400 942 370 902 340 936 C305 976 270 946 230 990 C200 1012 150 1002 108 1032 C158 950 188 860 214 760 C244 640 244 520 262 430 C276 320 320 250 395 250 Z" fill="#3a4152" stroke-width="10"/>
    <path d="M262 430 C244 520 244 640 214 760 C188 860 158 950 108 1032 C150 1002 200 1012 230 990 C222 920 250 840 272 740 C296 620 284 520 300 440 Z" fill="#232836" stroke="none" opacity="0.9"/>
    <path d="M604 850 C572 836 548 882 516 862 C490 906 456 870 430 906 C400 942 370 902 340 936 C305 976 270 946 230 990" fill="none" stroke="#232836" stroke-width="10"/>
    <!-- Liseré de lumière du réverbère -->
    <path d="M440 262 C512 282 540 360 532 470 C550 600 570 720 592 838" fill="none" stroke="#f2cf72" stroke-width="7" opacity="0.85"/>
    <path d="M300 360 C318 300 350 268 390 262" fill="none" stroke="#f2cf72" stroke-width="5" opacity="0.6"/>
    <!-- Ombre portée du bord du chapeau sur le haut du visage -->
    <path d="M285 300 Q400 280 530 300 L536 345 Q400 330 278 352 Z" fill="#232836" stroke="none" opacity="0.75"/>
    <!-- Yeux jaunes qui brillent, plissés -->
    <ellipse cx="346" cy="372" rx="34" ry="22" fill="#ffd76a" stroke-width="6"/>
    <ellipse cx="452" cy="364" rx="36" ry="23" fill="#ffd76a" stroke-width="6"/>
    <path d="M306 340 L390 372 L392 344 L306 330 Z" fill="#232836" stroke="none"/>
    <path d="M410 365 L496 334 L494 322 L408 338 Z" fill="#232836" stroke="none"/>
    <path d="M304 352 L388 376" fill="none" stroke-width="10"/>
    <path d="M412 368 L496 340" fill="none" stroke-width="10"/>
    <path d="M354 372 v18 M444 366 v20" fill="none" stroke-width="9"/>
    <g stroke="#ffd76a" stroke-width="5" opacity="0.8"><path d="M300 394 l-26 10 M502 352 l28 -6 M498 376 l24 8"/></g>
    <circle cx="334" cy="380" r="5" fill="#fff6d0" stroke="none"/><circle cx="466" cy="372" r="5" fill="#fff6d0" stroke="none"/>
    <!-- Col relevé du trench -->
    <path d="M280 530 L292 408 L356 440 L392 528 Z" fill="#232836" stroke-width="8"/>
    <path d="M520 524 L512 400 L446 436 L408 528 Z" fill="#232836" stroke-width="8"/>
    <path d="M296 420 L350 446 M508 412 L452 440" fill="none" stroke="#3a4152" stroke-width="5"/>
    <path d="M512 404 L520 520" fill="none" stroke="#f2cf72" stroke-width="5" opacity="0.7"/>
    <!-- Mâchoire crispée qui dépasse entre les revers -->
    <path d="M370 452 Q400 470 432 450 L418 476 Q400 486 384 476 Z" fill="#05060c" stroke-width="4"/>
    <path d="M378 458 l8 12 l8 -12 l8 12 l8 -12 l8 10" fill="none" stroke="#ffd76a" stroke-width="3"/>
    <!-- Fedora à bande, penché -->
    <g transform="rotate(-9 400 250)">
      <path d="M322 256 L330 172 Q366 146 400 166 Q434 146 470 172 L478 256 Z" fill="#232836" stroke-width="9"/>
      <rect x="326" y="220" width="148" height="26" fill="#3a4152" stroke-width="6"/>
      <path d="M242 266 Q400 232 560 262 Q572 284 548 292 Q400 266 254 296 Q230 284 242 266 Z" fill="#232836" stroke-width="9"/>
      <path d="M440 158 Q462 164 470 180 L476 250" fill="none" stroke="#f2cf72" stroke-width="5" opacity="0.8"/>
      <path d="M420 240 Q490 244 552 266" fill="none" stroke="#f2cf72" stroke-width="4" opacity="0.6"/>
      <path d="M380 166 Q400 182 420 166" fill="none" stroke-width="5"/>
    </g>
    <!-- Bras avant : griffe tendue vers nous -->
    <path d="M500 560 C560 600 600 660 612 740" fill="none" stroke-width="80"/>
    <path d="M500 560 C560 600 600 660 612 740" fill="none" stroke="#3a4152" stroke-width="64"/>
    <path d="M540 580 C580 610 606 660 616 720" fill="none" stroke="#f2cf72" stroke-width="5" opacity="0.6"/>
    <g fill="#3a4152" stroke-width="8">
      <path d="M560 760 C520 820 520 880 540 920 C548 880 566 840 590 812 Z"/>
      <path d="M600 790 C590 860 600 920 626 950 C624 900 634 856 646 818 Z"/>
      <path d="M640 778 C660 840 684 884 714 904 C700 860 692 820 680 780 Z"/>
      <path d="M660 730 C700 760 728 776 744 776 C730 752 708 730 680 712 Z"/>
      <path d="M556 740 C566 700 640 690 672 724 C696 752 680 810 640 822 C600 834 548 800 556 740 Z"/>
    </g>
    <path d="M580 800 C600 820 630 822 652 806" fill="none" stroke="#232836" stroke-width="10"/>
  </g>
  <!-- Brume de la rue qui s'enroule autour de la traîne -->
  <g fill="#8a8098" opacity="0.14">
    <path d="M0 1000 C120 960 240 1010 360 990 C480 970 600 1010 750 980 L750 1060 L0 1060 Z"/>
    <path d="M60 1050 C200 1030 320 1070 460 1050 C580 1034 680 1060 750 1050 L750 1110 L40 1110 Z"/>
  </g>
  <g fill="#3a4152" stroke="#05060c" stroke-width="4" opacity="0.85"><circle cx="300" cy="1010" r="12"/><circle cx="230" cy="1030" r="8"/><circle cx="520" cy="960" r="9"/></g>
</svg>
