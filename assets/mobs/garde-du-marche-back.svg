<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- Garde du Marché, cadrage « back » : il « contrôle » l'étal de brochettes en les goûtant toutes (et confisque le reste sur sa sagaie). Aucun texte. -->
