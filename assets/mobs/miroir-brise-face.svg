<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- Miroir Brisé, mob de la Rue des Illusions, cadrage « face » : le spectre-miroir fond sur nous en projetant les éclats de son propre miroir. Palette du sprite : base #aac4d8, sombre #5f7590, accent #c23b3b. Aucun texte. -->
  <defs>
    <pattern id="miroir-brise-f-wall" width="120" height="80" patternUnits="userSpaceOnUse">
      <rect width="120" height="80" fill="#211c2e"/>
      <rect x="6" y="6" width="108" height="68" rx="6" fill="#29243b"/>
      <circle cx="30" cy="25" r="4" fill="#2f2945"/>
      <circle cx="85" cy="50" r="5" fill="#2f2945"/>
      <circle cx="60" cy="66" r="3" fill="#2f2945"/>
      <circle cx="100" cy="14" r="3" fill="#2f2945"/>
    </pattern>
    <radialGradient id="miroir-brise-f-glow">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="750" height="1040" fill="url(#miroir-brise-f-wall)"/>
  <rect x="0" y="0" width="750" height="60" fill="#0d0c16"/>
  <path d="M0 60 H750" stroke="#05060c" stroke-width="6"/>
  <!-- Façades penchées de la rue impossible, fenêtres sans lumière -->
  <g stroke="#05060c" stroke-width="6" stroke-linejoin="round">
    <path d="M40 300 L190 280 L200 700 L50 712 Z" fill="#2a2335"/>
    <rect x="72" y="330" width="40" height="56" rx="4" fill="#1a1624"/>
    <rect x="132" y="322" width="40" height="56" rx="4" fill="#1a1624"/>
    <rect x="76" y="440" width="40" height="56" rx="4" fill="#3a3150"/>
    <path d="M590 250 L720 270 L712 680 L582 668 Z" fill="#262031"/>
    <rect x="612" y="300" width="38" height="52" rx="4" fill="#1a1624"/>
    <rect x="664" y="306" width="34" height="52" rx="4" fill="#3a3150"/>
    <rect x="612" y="410" width="38" height="52" rx="4" fill="#1a1624"/>
  </g>
  <!-- Réverbères à gaz -->
  <circle cx="150" cy="190" r="170" fill="url(#miroir-brise-f-glow)"/>
  <circle cx="620" cy="160" r="150" fill="url(#miroir-brise-f-glow)"/>
  <g stroke="#05060c" stroke-width="6" stroke-linejoin="round">
    <path d="M150 1040 V230" stroke="#2c2738" stroke-width="16"/>
    <path d="M150 1040 V230" fill="none" stroke-width="4" opacity="0.6"/>
    <path d="M122 230 h56 l-10 -54 h-36 Z" fill="#ffd76a" opacity="0.8"/>
    <path d="M116 176 h68 l-34 -26 Z" fill="#2c2738"/>
    <path d="M620 60 V110" stroke-width="5"/>
    <path d="M596 170 h48 l-8 -48 h-32 Z" fill="#ffd76a" opacity="0.75"/>
    <path d="M590 122 h60 l-30 -18 Z" fill="#2c2738"/>
  </g>
  <!-- Pavés -->
  <rect x="0" y="1040" width="750" height="294" fill="#27232f"/>
  <path d="M0 1040 H750" stroke="#05060c" stroke-width="6"/>
  <g fill="#211e28" stroke="#15131b" stroke-width="5">
    <rect x="20" y="1062" width="110" height="46" rx="16"/><rect x="150" y="1060" width="120" height="48" rx="16"/><rect x="420" y="1062" width="116" height="46" rx="16"/><rect x="600" y="1060" width="130" height="48" rx="16"/>
    <rect x="80" y="1134" width="130" height="54" rx="18"/><rect x="330" y="1132" width="140" height="56" rx="18"/><rect x="540" y="1136" width="130" height="52" rx="18"/>
    <rect x="10" y="1214" width="150" height="60" rx="20"/><rect x="220" y="1216" width="160" height="58" rx="20"/><rect x="460" y="1214" width="170" height="60" rx="20"/>
  </g>
  <path d="M0 1010 C120 990 220 1030 360 1012 C500 994 610 1030 750 1006 L750 1060 L0 1060 Z" fill="#6d6880" opacity="0.18"/>
  <rect x="0" y="0" width="55" height="1334" fill="#05060c" opacity="0.25"/>
  <rect x="695" y="0" width="55" height="1334" fill="#05060c" opacity="0.25"/>
  <!-- Aura de reflets froids, irrégulière -->
  <path d="M230 230 C300 120 520 120 600 250 C680 380 690 600 650 780 C620 920 520 1000 380 990 C240 980 140 900 120 760 C100 600 140 360 230 230 Z" fill="#aac4d8" opacity="0.08"/>
  <path d="M280 260 C340 190 500 190 560 290 C620 400 620 600 590 740 C560 860 480 920 380 910 C280 900 210 840 190 730 C170 600 210 350 280 260 Z" fill="#cfe0ee" opacity="0.09"/>
  <g fill="#e8f4ff" opacity="0.8">
    <path d="M640 330 l6 -18 l6 18 l18 6 l-18 6 l-6 18 l-6 -18 l-18 -6 Z"/>
    <path d="M110 260 l5 -14 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 Z"/>
    <path d="M660 820 l5 -14 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 Z"/>
  </g>
  <!-- Lignes de mouvement : il fond sur nous depuis la droite -->
  <g stroke="#aac4d8" stroke-width="7" stroke-linecap="round" opacity="0.4">
    <path d="M700 720 l40 18 M690 790 l50 14 M710 860 l36 10"/>
  </g>
  <ellipse cx="400" cy="1050" rx="200" ry="24" fill="#05060c" opacity="0.45"/>
  <g transform="rotate(-7 400 600)" stroke="#05060c" stroke-linejoin="round" stroke-linecap="round">
    <!-- Corps de spectre : la traîne ondule derrière, en bas à droite -->
    <path d="M400 170 C520 170 590 260 594 380 C600 520 620 680 680 860 C640 846 620 900 584 886 C556 930 520 896 496 924 C470 960 436 920 408 950 C380 980 344 944 318 968 C290 990 262 960 236 980 C246 880 222 760 214 640 C206 500 212 380 236 300 C266 210 320 170 400 170 Z" fill="#aac4d8" stroke-width="11" opacity="0.94"/>
    <path d="M236 300 C212 380 206 500 214 640 C222 760 246 880 236 980 C262 960 290 990 318 968 C296 880 286 760 284 640 C282 500 280 380 300 290 Z" fill="#5f7590" stroke="none" opacity="0.7"/>
    <path d="M584 886 C556 930 520 896 496 924 C470 960 436 920 408 950 C380 980 344 944 318 968" fill="none" stroke="#5f7590" stroke-width="9"/>
    <path d="M330 220 C360 196 400 190 440 196" fill="none" stroke="#e8f4ff" stroke-width="10" opacity="0.6"/>
    <!-- Bras droit (à gauche) : projette les éclats vers nous, paume ouverte -->
    <path d="M270 520 C200 500 150 440 120 380" fill="none" stroke-width="66"/>
    <path d="M270 520 C200 500 150 440 120 380" fill="none" stroke="#aac4d8" stroke-width="54"/>
    <path d="M250 500 C200 480 168 440 146 404" fill="none" stroke="#5f7590" stroke-width="12" opacity="0.5"/>
    <path d="M78 380 C70 340 100 316 128 330 L150 316 C168 330 162 356 150 368 C168 392 150 420 120 414 C96 412 84 400 78 380 Z" fill="#aac4d8" stroke-width="7"/>
    <path d="M100 336 l-18 -30 M120 326 l-6 -34 M142 322 l10 -30" stroke-width="16"/>
    <path d="M100 336 l-18 -30 M120 326 l-6 -34 M142 322 l10 -30" stroke="#aac4d8" stroke-width="7"/>
    <!-- Bras gauche (à droite) : poing serré, tremblant de rage -->
    <path d="M572 520 C620 540 640 600 630 650" fill="none" stroke-width="58"/>
    <path d="M572 520 C620 540 640 600 630 650" fill="none" stroke="#aac4d8" stroke-width="46"/>
    <circle cx="628" cy="670" r="32" fill="#aac4d8" stroke-width="7"/>
    <path d="M606 664 h40 M608 680 h36" stroke-width="5"/>
    <!-- Sourcils furieux -->
    <path d="M352 268 L430 300" stroke-width="18"/>
    <path d="M552 262 L478 296" stroke-width="18"/>
    <!-- Yeux rouges braqués sur nous -->
    <circle cx="404" cy="330" r="30" fill="#c23b3b" stroke-width="6"/>
    <circle cx="406" cy="334" r="11" fill="#05060c" stroke="none"/>
    <circle cx="500" cy="326" r="26" fill="#c23b3b" stroke-width="6"/>
    <circle cx="498" cy="330" r="10" fill="#05060c" stroke="none"/>
    <circle cx="396" cy="322" r="5" fill="#ffffff" stroke="none" opacity="0.7"/>
    <!-- Grimace en dents de verre -->
    <path d="M410 390 L428 376 L444 392 L460 376 L476 392 L492 378 L506 394 Q458 414 410 390 Z" fill="#1a2030" stroke-width="6"/>
    <path d="M428 376 L436 388 M460 376 L468 388" stroke="#e8f4ff" stroke-width="4"/>
    <!-- Le miroir ovale incrusté dans la poitrine -->
    <ellipse cx="420" cy="590" rx="128" ry="168" fill="#3d4a5c" stroke-width="10"/>
    <ellipse cx="420" cy="590" rx="104" ry="144" fill="#cfe0ee" stroke-width="6"/>
    <path d="M350 500 C370 470 400 456 430 452" fill="none" stroke="#ffffff" stroke-width="12" opacity="0.6"/>
    <path d="M346 540 L372 506" stroke="#ffffff" stroke-width="8" opacity="0.5"/>
    <!-- Trous des éclats qui manquent -->
    <path d="M470 470 L506 500 L484 530 Z" fill="#1a2030" stroke-width="5"/>
    <path d="M340 640 L372 668 L336 700 Z" fill="#1a2030" stroke-width="5"/>
    <!-- Reflet : l'œil rouge furieux dans la glace -->
    <ellipse cx="440" cy="600" rx="40" ry="28" fill="#f0f6fb" stroke-width="5"/>
    <circle cx="440" cy="600" r="20" fill="#c23b3b" stroke-width="5"/>
    <circle cx="440" cy="600" r="8" fill="#05060c" stroke="none"/>
    <path d="M396 586 L486 570" stroke-width="9"/>
    <!-- Fissures en étoile depuis l'impact -->
    <g fill="none" stroke-width="5">
      <path d="M454 548 L470 470 M454 548 L506 520 L540 534 M454 548 L370 520 L336 470 M454 548 L420 650 L372 668 M454 548 L500 690 L486 730 M454 548 L392 560 L330 590"/>
    </g>
    <circle cx="454" cy="548" r="7" fill="#05060c" stroke="none"/>
    <!-- Pied du porte-miroir -->
    <rect x="270" y="770" width="300" height="30" rx="15" fill="#5f7590" stroke-width="7"/>
    <path d="M300 778 h240" stroke="#aac4d8" stroke-width="5" opacity="0.6"/>
  </g>
  <!-- Éclats de verre projetés vers nous (de plus en plus gros) -->
  <g stroke="#05060c" stroke-width="5" stroke-linejoin="round">
    <path d="M150 230 L196 212 L170 266 Z" fill="#cfe0ee"/>
    <path d="M206 300 L236 290 L222 326 Z" fill="#aac4d8"/>
    <path d="M240 130 L292 104 L286 168 Z" fill="#cfe0ee"/>
    <path d="M30 120 L140 92 L100 214 Z" fill="#e8f4ff" stroke-width="7"/>
    <path d="M-10 520 L110 560 L20 650 Z" fill="#e8f4ff" stroke-width="7"/>
    <path d="M46 300 L96 284 L80 336 Z" fill="#cfe0ee"/>
  </g>
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <path d="M50 124 l50 -12 M252 128 l22 -12 M10 534 l50 18"/>
  </g>
  <g stroke="#cfe0ee" stroke-width="6" stroke-linecap="round" opacity="0.45" stroke-dasharray="8 16">
    <path d="M180 250 L120 210 M206 250 L270 166 M160 360 L60 560 M180 300 L100 310"/>
  </g>
</svg>
