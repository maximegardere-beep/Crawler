<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- Bibliothécaire Fantôme, mob de la Bibliothèque des Oubliés, cadrage « dos » : elle range à la baguette une ronde de livres en lévitation, furieuse contre un volume rangé à l'envers. Aucun texte. -->
  <defs>
    <pattern id="bibliothecaire-fantome-b-wall" width="120" height="100" patternUnits="userSpaceOnUse" patternTransform="scale(0.75)">
      <rect width="120" height="100" fill="#2a2119"/>
      <rect x="4" y="6" width="112" height="42" rx="3" fill="#33281d"/>
      <rect x="4" y="54" width="112" height="42" rx="3" fill="#30261c"/>
      <g fill="#3a2d24">
        <rect x="10" y="12" width="10" height="32" rx="2"/>
        <rect x="24" y="14" width="8" height="30" rx="2" fill="#33242b"/>
        <rect x="36" y="11" width="11" height="33" rx="2"/>
        <rect x="52" y="15" width="7" height="29" rx="2" fill="#262d36"/>
        <rect x="64" y="12" width="10" height="32" rx="2"/>
        <path d="M80 44 L90 15 L97 17 L87 44 Z"/>
        <rect x="100" y="13" width="9" height="31" rx="2" fill="#33242b"/>
        <rect x="12" y="60" width="9" height="32" rx="2" fill="#262d36"/>
        <rect x="25" y="63" width="11" height="29" rx="2"/>
        <rect x="40" y="58" width="8" height="34" rx="2"/>
        <rect x="52" y="62" width="12" height="30" rx="2" fill="#33242b"/>
        <rect x="68" y="59" width="8" height="33" rx="2"/>
        <rect x="80" y="63" width="10" height="29" rx="2"/>
        <rect x="94" y="60" width="8" height="32" rx="2" fill="#262d36"/>
      </g>
    </pattern>
    <radialGradient id="bibliothecaire-fantome-b-glow">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="750" height="760" fill="url(#bibliothecaire-fantome-b-wall)"/>
  <rect x="0" y="0" width="750" height="46" fill="#1a120c"/>
  <path d="M0 46 H750" stroke="#05060c" stroke-width="5"/>
  <!-- Plancher -->
  <rect x="0" y="760" width="750" height="574" fill="#2b2118"/>
  <path d="M0 760 H750" stroke="#05060c" stroke-width="5"/>
  <g stroke="#1a130d" stroke-width="4"><path d="M0 800 H750 M0 860 H750 M0 950 H750 M0 1080 H750 M0 1240 H750 M240 760 v40 M520 760 v40 M380 800 v60 M640 800 v60 M200 860 v90 M480 860 v90"/></g>
  <rect x="0" y="0" width="750" height="1334" fill="#05060c" opacity="0.14"/>
  <!-- Lustre -->
  <circle cx="560" cy="160" r="160" fill="url(#bibliothecaire-fantome-b-glow)"/>
  <g stroke="#05060c" stroke-width="4" stroke-linecap="round">
    <path d="M560 46 V112"/>
    <path d="M504 128 Q560 164 616 128" fill="none" stroke="#5a4630" stroke-width="8"/>
    <rect x="497" y="106" width="13" height="24" fill="#e8dcc0"/>
    <rect x="554" y="118" width="13" height="26" fill="#e8dcc0"/>
    <rect x="610" y="106" width="13" height="24" fill="#e8dcc0"/>
  </g>
  <g fill="#ffd76a"><path d="M503 104 q-6 -11 0 -21 q6 10 0 21 Z"/><path d="M560 116 q-6 -11 0 -21 q6 10 0 21 Z"/><path d="M616 104 q-6 -11 0 -21 q6 10 0 21 Z"/></g>
  <!-- Chariot de retours -->
  <g stroke="#05060c" stroke-width="5" stroke-linejoin="round">
    <rect x="560" y="660" width="150" height="70" fill="#4a3826"/>
    <path d="M560 694 H710" stroke-width="4"/>
    <rect x="572" y="626" width="16" height="34" fill="#33242b"/><rect x="590" y="632" width="14" height="28" fill="#2f3d4a"/><rect x="606" y="624" width="18" height="36" fill="#5a4630"/>
    <path d="M630 660 L648 630 L660 634 L644 660 Z" fill="#33242b"/>
    <circle cx="580" cy="744" r="12" fill="#1a130d"/><circle cx="690" cy="744" r="12" fill="#1a130d"/>
  </g>
  <!-- Le volume rangé à l'envers, cerclé de jaune -->
  <g stroke="#05060c" stroke-width="5">
    <rect x="300" y="148" width="20" height="56" rx="2" fill="#6a2a22"/>
    <path d="M304 196 h12" stroke="#caa23a" stroke-width="4"/>
  </g>
  <path d="M286 140 C280 120 336 118 336 150 C340 200 330 222 300 218 C280 214 276 170 286 140" fill="none" stroke="#ffd76a" stroke-width="5" stroke-dasharray="10 7" opacity="0.85"/>
  <!-- Ronde de livres en lévitation -->
  <g stroke="#05060c" stroke-width="5" stroke-linejoin="round">
    <path d="M250 300 L292 288 L302 322 L260 334 Z" fill="#3c2a35"/>
    <path d="M330 236 L372 244 L366 278 L324 270 Z" fill="#2f3d4a"/>
    <path d="M590 270 L630 284 L620 318 L580 304 Z" fill="#5b2d1a"/>
    <path d="M620 400 L658 392 L664 428 L626 436 Z" fill="#2f3d4a"/>
    <path d="M222 420 L262 412 L270 448 L230 456 Z" fill="#5a4630"/>
  </g>
  <g fill="none" stroke="#a9b8e0" stroke-width="4" stroke-linecap="round" opacity="0.5" stroke-dasharray="4 12">
    <path d="M232 470 C180 380 250 260 350 230"/>
    <path d="M590 250 C680 300 690 420 640 450"/>
  </g>
  <!-- La Bibliothécaire, de dos, qui dirige les livres des deux bras -->
  <g stroke="#05060c" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="450" cy="770" rx="110" ry="14" fill="#05060c" opacity="0.45" stroke="none"/>
    <path d="M446 300 C500 300 530 340 528 390 C532 460 548 540 572 640 C548 630 538 664 514 652 C496 680 476 654 460 676 C442 700 422 670 404 690 C386 712 360 686 340 704 C352 640 362 560 368 480 C372 420 372 360 380 330 C392 308 418 300 446 300 Z" fill="#7c8cb8" stroke-width="7" opacity="0.94"/>
    <path d="M500 330 C524 360 520 420 526 470 C536 540 548 590 572 640 C548 630 538 664 514 652 C506 600 504 520 494 450 C488 400 492 360 500 330 Z" fill="#47536e" stroke="none" opacity="0.8"/>
    <path d="M514 652 C496 680 476 654 460 676 C442 700 422 670 404 690 C386 712 360 686 340 704" fill="none" stroke="#47536e" stroke-width="6"/>
    <!-- Bras gauche levé vers le volume à l'envers, index accusateur -->
    <path d="M384 420 C340 390 320 320 318 250" fill="none" stroke-width="36"/>
    <path d="M384 420 C340 390 320 320 318 250" fill="none" stroke="#7c8cb8" stroke-width="27"/>
    <circle cx="318" cy="246" r="14" fill="#7c8cb8" stroke-width="5"/>
    <path d="M314 236 l-6 -22" stroke-width="12"/>
    <path d="M314 236 l-6 -22" stroke="#7c8cb8" stroke-width="5"/>
    <!-- Bras droit qui fait tourner la ronde -->
    <path d="M512 420 C556 400 586 360 600 320" fill="none" stroke-width="36"/>
    <path d="M512 420 C556 400 586 360 600 320" fill="none" stroke="#7c8cb8" stroke-width="27"/>
    <circle cx="602" cy="314" r="14" fill="#7c8cb8" stroke-width="5"/>
    <!-- Nuque : la chaîne des lunettes pend dans le dos, branches qui dépassent -->
    <path d="M398 336 l-14 -4" stroke-width="5"/>
    <path d="M512 318 C530 316 536 344 520 356" fill="#e8f0ff" fill-opacity="0.2" stroke-width="5"/>
    <path d="M394 340 C392 400 420 432 450 432 C482 432 506 400 504 340" fill="none" stroke="#ffd76a" stroke-width="4" stroke-dasharray="2 7"/>
    <path d="M410 312 C430 302 460 302 476 310" fill="none" stroke="#a9b8e0" stroke-width="6" opacity="0.6"/>
  </g>
  <!-- Grain de poussière dans la lumière -->
  <g fill="#c9d4f0" opacity="0.5"><circle cx="420" cy="220" r="3"/><circle cx="530" cy="250" r="4"/><circle cx="470" cy="190" r="3"/><circle cx="660" cy="520" r="3"/></g>
  <!-- Cachette : flanc d'une étagère au premier plan, pile de livres -->
  <g stroke="#05060c" stroke-linejoin="round">
    <path d="M0 0 H150 L170 1334 H0 Z" fill="#140e0a" stroke-width="6"/>
    <path d="M150 0 L170 1334" stroke="#2a1f15" stroke-width="10"/>
    <g fill="#1d150f" stroke-width="4">
      <rect x="20" y="180" width="110" height="18"/>
      <rect x="20" y="520" width="118" height="18"/>
      <rect x="20" y="880" width="126" height="18"/>
      <rect x="30" y="100" width="22" height="80"/><rect x="58" y="110" width="18" height="70"/><rect x="82" y="96" width="26" height="84"/>
      <rect x="30" y="430" width="24" height="90"/><rect x="60" y="446" width="20" height="74"/><path d="M86 520 L112 440 L130 446 L106 520 Z"/>
    </g>
    <g stroke-width="6">
      <rect x="120" y="1000" width="230" height="44" rx="5" fill="#1d150f"/>
      <rect x="140" y="958" width="190" height="42" rx="5" fill="#22191a" transform="rotate(-4 235 979)"/>
      <rect x="130" y="920" width="170" height="40" rx="5" fill="#1a1e24" transform="rotate(3 215 940)"/>
    </g>
  </g>
</svg>
