<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- Nuage de Chlore Ambulant, mob de la Piscine Municipale Désaffectée, cadrage « dos ». Au fond, de dos,
       il plane au-dessus du pédiluve et y trempe ses bras de vapeur comme dans un jacuzzi : l'eau bouillonne,
       le carrelage blanchit et un bonnet de bain oublié se décolore sur le rebord. On le guette depuis
       un pilier carrelé, derrière une pile de planches de natation.
       Palette du sprite : base #b8d84a, sombre #7a9a2a, accent #22d3ee. Aucun texte. -->
  <defs>
    <pattern id="nuage-de-chlore-ambulant-b-tiles" width="80" height="42" patternUnits="userSpaceOnUse" patternTransform="scale(0.6)">
      <rect width="80" height="42" fill="#162b37"/>
      <rect x="1.5" y="1.5" width="37" height="18" rx="2" fill="#1f3a49"/>
      <rect x="41.5" y="1.5" width="37" height="18" rx="2" fill="#223f4e"/>
      <rect x="-18" y="22.5" width="37" height="18" rx="2" fill="#223f4e"/>
      <rect x="22.5" y="22.5" width="37" height="18" rx="2" fill="#1f3a49"/>
      <rect x="61.5" y="22.5" width="37" height="18" rx="2" fill="#213d4c"/>
    </pattern>
    <pattern id="nuage-de-chlore-ambulant-b-pillar" width="80" height="42" patternUnits="userSpaceOnUse">
      <rect width="80" height="42" fill="#070c10"/>
      <rect x="1.5" y="1.5" width="37" height="18" rx="2" fill="#0f1a21"/>
      <rect x="41.5" y="1.5" width="37" height="18" rx="2" fill="#111d25"/>
      <rect x="-18" y="22.5" width="37" height="18" rx="2" fill="#111d25"/>
      <rect x="22.5" y="22.5" width="37" height="18" rx="2" fill="#0f1a21"/>
      <rect x="61.5" y="22.5" width="37" height="18" rx="2" fill="#101c23"/>
    </pattern>
    <radialGradient id="nuage-de-chlore-ambulant-b-halo">
      <stop offset="0" stop-color="#bae6fd" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#bae6fd" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Mur du fond carrelé, plafond à poutrelles -->
  <rect x="0" y="0" width="750" height="620" fill="url(#nuage-de-chlore-ambulant-b-tiles)"/>
  <rect x="0" y="0" width="750" height="80" fill="#121c24"/>
  <g stroke="#05060c" stroke-width="4">
    <path d="M0 64 H750" stroke="#2a3a45" stroke-width="10"/>
    <path d="M0 58 H750 M0 70 H750"/>
    <path d="M250 0 V60 M500 0 V60" stroke="#2a3a45" stroke-width="9"/>
  </g>
  <path d="M0 80 H750" stroke="#05060c" stroke-width="4"/>
  <circle cx="560" cy="110" r="200" fill="url(#nuage-de-chlore-ambulant-b-halo)"/>
  <g stroke="#05060c" stroke-width="4">
    <path d="M520 80 V96 M600 80 V96"/>
    <rect x="505" y="94" width="110" height="16" rx="7" fill="#bae6fd"/>
  </g>
  <!-- Caustiques -->
  <g fill="none" stroke="#9fe7f5" stroke-width="5" stroke-linecap="round" opacity="0.1">
    <path d="M200 200 q30 -16 60 0 t60 0 t60 0 M480 260 q30 -16 60 0 t60 0 t60 0"/>
    <path d="M260 420 q26 14 52 0 t52 0 t52 0 M560 400 q26 14 52 0 t52 0"/>
  </g>
  <!-- Panneau illisible (pictogramme de pied) -->
  <g stroke="#05060c" stroke-width="4">
    <rect x="250" y="250" width="86" height="60" rx="6" fill="#1d3b4a"/>
    <path d="M276 296 q-6 -26 8 -34 q14 4 8 34 Z" fill="#6f8994" stroke-width="3"/>
    <path d="M304 272 h20 M304 286 h14" stroke="#6f8994" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Plongeoir au fond à droite -->
  <g stroke="#05060c" stroke-width="4" stroke-linejoin="round">
    <path d="M664 620 V530 M706 620 V530" stroke="#3a4a52" stroke-width="10"/>
    <path d="M600 520 L750 506 L750 524 L604 538 Z" fill="#4a5f66"/>
  </g>
  <!-- Sol en perspective -->
  <rect x="0" y="620" width="750" height="714" fill="#1c2e39"/>
  <rect x="0" y="620" width="750" height="16" fill="#2c4250"/>
  <path d="M0 620 H750" stroke="#05060c" stroke-width="5"/>
  <g stroke="#14232c" stroke-width="4" fill="none">
    <path d="M0 660 H750 M0 712 H750 M0 784 H750 M0 880 H750 M0 1010 H750 M0 1180 H750"/>
    <path d="M330 636 L120 1334 M400 636 L400 1334 M470 636 L680 1334 M260 636 L-160 1334 M540 636 L960 1334 M190 636 L-440 1334 M610 636 L1240 1334"/>
  </g>
  <!-- Carreaux blanchis par le chlore autour du pédiluve -->
  <g fill="#c9dccf" opacity="0.14">
    <path d="M200 760 C170 720 230 690 280 700 C300 740 260 790 200 760 Z"/><path d="M560 700 C600 680 660 720 640 770 C600 790 560 750 560 700 Z"/>
    <path d="M300 790 C360 772 470 776 520 796 C500 830 420 840 360 830 C320 826 296 812 300 790 Z"/>
  </g>
  <!-- Le carrelage du mur « pleure » (coulures décolorées) -->
  <g stroke="#9fb8c4" stroke-width="6" stroke-linecap="round" opacity="0.18">
    <path d="M330 560 V610 M380 540 V612 M450 556 V606 M500 548 V610"/>
  </g>
  <!-- Le pédiluve -->
  <g stroke="#05060c" stroke-linejoin="round">
    <path d="M230 690 L590 690 L630 770 L190 770 Z" fill="#3b5560" stroke-width="5"/>
    <path d="M256 700 L566 700 L596 758 L222 758 Z" fill="#2e6a62" stroke-width="4"/>
    <path d="M280 712 L540 712 L560 748 L256 748 Z" fill="#7fae3e" opacity="0.4" stroke="none"/>
  </g>
  <!-- Bouillonnement -->
  <g fill="none" stroke="#d9f0a0" stroke-width="4" opacity="0.6">
    <ellipse cx="330" cy="730" rx="30" ry="7"/><ellipse cx="480" cy="732" rx="32" ry="7"/>
  </g>
  <!-- Vapeur qui monte du pédiluve -->
  <g fill="none" stroke="#d9f0a0" stroke-width="5" stroke-linecap="round" opacity="0.4">
    <path d="M250 690 q-14 -24 0 -46 q14 -22 0 -44"/><path d="M580 686 q14 -24 0 -46 q-14 -22 0 -44"/>
  </g>
  <!-- Ombre verte sur l'eau -->
  <ellipse cx="408" cy="726" rx="140" ry="14" fill="#05060c" opacity="0.35"/>

  <!-- Le nuage, de dos, qui trempe ses bras de vapeur dans le pédiluve -->
  <g transform="translate(408 520) rotate(5) scale(0.46)" stroke="#05060c" stroke-linejoin="round" stroke-linecap="round">
    <!-- Bras (derrière le corps), plongés dans l'eau -->
    <path d="M-200 80 Q-310 220 -230 400" fill="none" stroke-width="100"/>
    <path d="M-200 80 Q-310 220 -230 400" fill="none" stroke="#9cbc3a" stroke-width="80"/>
    <path d="M200 80 Q320 220 240 400" fill="none" stroke-width="100"/>
    <path d="M200 80 Q320 220 240 400" fill="none" stroke="#9cbc3a" stroke-width="80"/>
    <!-- Corps : même silhouette, vue de derrière (aucun visage) -->
    <path d="M-230 300 A75 75 0 0 1 -245 170 A75 75 0 0 1 -235 40 A78 78 0 0 1 -205 -90 A75 75 0 0 1 -160 -210 A70 70 0 0 1 -95 -310 A68 68 0 0 1 0 -370 A68 68 0 0 1 100 -330 A66 66 0 0 1 170 -240 A72 72 0 0 1 215 -120 A76 76 0 0 1 240 10 A76 76 0 0 1 250 150 A82 82 0 0 1 245 300 Q205 380 160 310 Q115 372 70 315 Q20 388 -30 315 Q-80 376 -125 312 Q-178 382 -230 300 Z" fill="#b8d84a" stroke-width="12"/>
    <path d="M150 -250 C220 -150 240 0 230 150 C228 240 210 290 160 300 Q115 360 70 305 Q20 370 -30 305 C40 300 120 240 150 120 C175 20 175 -140 150 -250 Z" fill="#7a9a2a" opacity="0.85" stroke="none"/>
    <path d="M-170 -150 C-150 -230 -100 -290 -40 -320" fill="none" stroke="#e4f5a8" stroke-width="18" opacity="0.7"/>
    <!-- Bouffées du dos -->
    <g fill="none" stroke="#7a9a2a" stroke-width="9" opacity="0.85">
      <path d="M-170 0 a50 50 0 0 1 90 -14 a46 46 0 0 1 80 12"/>
      <path d="M-140 170 a46 46 0 0 1 80 -10 a40 40 0 0 1 70 10"/>
      <path d="M-60 -200 a44 44 0 0 1 80 -6"/>
    </g>
    <!-- Bouffées qui montent (détail signature) -->
    <circle cx="-110" cy="-400" r="46" fill="#b8d84a" opacity="0.6" stroke-width="9"/>
    <circle cx="70" cy="-424" r="54" fill="#cbe86a" opacity="0.55" stroke-width="9"/>
    <circle cx="-20" cy="-500" r="38" fill="#b8d84a" opacity="0.55" stroke-width="8"/>
  </g>
  <!-- Remous là où plongent les bras -->
  <g fill="none" stroke="#9fe7f5" stroke-width="4" opacity="0.55">
    <ellipse cx="315" cy="712" rx="40" ry="8"/><ellipse cx="510" cy="716" rx="40" ry="8"/>
  </g>
  <!-- Bulles de chlore cyan qui remontent -->
  <g fill="#22d3ee" stroke="#05060c" stroke-width="3">
    <circle cx="300" cy="640" r="9"/><circle cx="340" cy="590" r="6"/><circle cx="530" cy="620" r="8"/>
    <circle cx="560" cy="560" r="6"/><circle cx="270" cy="520" r="7"/><circle cx="520" cy="440" r="5"/>
  </g>
  <!-- Bonnet de bain oublié qui se décolore sur le rebord -->
  <g stroke="#05060c" stroke-width="4" stroke-linejoin="round">
    <path d="M582 744 C578 712 598 696 620 698 C640 700 652 716 650 744 Z" fill="#c94f3d"/>
    <path d="M582 744 C580 724 588 710 600 704 C606 720 606 734 610 744 Z" fill="#ecc8bf"/>
    <path d="M596 744 q2 14 -2 22 q-6 -8 2 -22" fill="#ecc8bf" stroke-width="3"/>
    <path d="M582 744 H650" stroke-width="5"/>
  </g>
  <path d="M624 692 q-10 -14 2 -26 q10 -12 0 -26" fill="none" stroke="#d9f0a0" stroke-width="4" opacity="0.5"/>

  <!-- Cachette : pilier carrelé et pile de planches de natation au premier plan -->
  <rect x="0" y="0" width="150" height="1334" fill="url(#nuage-de-chlore-ambulant-b-pillar)"/>
  <path d="M150 0 V1334" stroke="#05060c" stroke-width="6"/>
  <path d="M150 0 V1334" stroke="#1d3440" stroke-width="3" transform="translate(-6 0)"/>
  <g stroke="#05060c" stroke-width="5" stroke-linejoin="round">
    <path d="M60 1080 L330 1060 L336 1110 L60 1130 Z" fill="#20323a"/>
    <path d="M70 1020 L320 990 Q350 988 352 1010 L352 1040 L70 1070 Z" fill="#2a3540"/>
    <path d="M80 960 L300 932 Q332 930 334 952 L334 980 L80 1010 Z" fill="#3a2d33"/>
    <path d="M90 902 L290 878 Q318 876 320 896 L320 922 L90 948 Z" fill="#253844"/>
    <path d="M100 848 L270 828 Q296 828 298 846 L298 868 L100 890 Z" fill="#3a3527"/>
  </g>
  <g fill="#05060c" opacity="0.35"><circle cx="270" cy="854" r="7"/><circle cx="290" cy="908" r="7"/><circle cx="305" cy="964" r="7"/></g>
  <rect x="150" y="820" width="220" height="514" fill="#05060c" opacity="0.18"/>
  <rect x="700" y="0" width="50" height="1334" fill="#05060c" opacity="0.25"/>
  <rect x="0" y="1180" width="750" height="154" fill="#05060c" opacity="0.2"/>
</svg>
