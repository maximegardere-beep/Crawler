    <g transform="rotate(6 0 -200)">
      <path d="M-78 -64 L-78 -290 C-60 -300 -40 -290 -20 -294 C0 -298 20 -288 40 -294 C60 -298 74 -290 82 -286 L82 -64 Z" fill="#6aa8a0" stroke="none"/>
      <path d="M50 -294 C70 -296 78 -290 82 -286 L82 -64 L60 -64 C66 -140 64 -230 50 -294 Z" fill="#4a7a74" stroke="none" opacity="0.7"/>
