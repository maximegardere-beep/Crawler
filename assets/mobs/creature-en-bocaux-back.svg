      <path d="M76 -330 L76 -200" stroke="#f2fbfa" stroke-width="4" opacity="0.3"/>
      <rect x="-96" y="-376" width="196" height="30" rx="8" fill="#8a929c" stroke-width="6"/>
      <path d="M-82 -366 h168" stroke="#b3bac2" stroke-width="5"/>
