      <g fill="#cde8e5" stroke-width="2" opacity="0.8"><circle cx="-50" cy="-200" r="5"/><circle cx="-40" cy="-236" r="3.5"/></g>
      <path d="M-88 -350 L-88 -70 Q-88 -50 -68 -50 L72 -50 Q92 -50 92 -70 L92 -350 Z" fill="#cde8e5" fill-opacity="0.22" stroke-width="6"/>
