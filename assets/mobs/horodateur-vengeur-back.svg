    <path d="M56 540 q170 -14 338 0" fill="none" stroke="#3b3e44" stroke-width="5"/>
    <ellipse cx="94" cy="572" rx="30" ry="18" fill="#9a9c90"/>
    <ellipse cx="356" cy="572" rx="30" ry="18" fill="#9a9c90"/>
    <rect x="156" y="560" width="138" height="34" rx="6" fill="#26282c"/>
    <path d="M178 562 v30 M202 562 v30 M226 562 v30 M250 562 v30 M274 562 v30" stroke-width="4"/>
    <rect x="184" y="604" width="82" height="20" rx="3" fill="#b8b8ae"/>
    <rect x="34" y="616" width="382" height="18" rx="8" fill="#3b3e44"/>
    <path d="M100 524 L210 506 M250 524 L350 504" stroke-width="6" stroke-linecap="round"/>
  </g>
