      <circle cx="22" cy="14" r="2" fill="#1f2022"/>
      <circle cx="84" cy="42" r="2.5" fill="#1f2022"/>
    </pattern>
    <radialGradient id="horodateur-vengeur-b-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
