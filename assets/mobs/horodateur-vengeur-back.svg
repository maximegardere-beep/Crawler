  <ellipse cx="500" cy="684" rx="96" ry="12" fill="#05060c" opacity="0.5"/>
  <!-- LA VOITURE GARÉE, vue de face, couverte de contraventions -->
  <g stroke="#05060c" stroke-linejoin="round" stroke-width="5">
    <rect x="58" y="618" width="54" height="56" rx="8" fill="#16171a"/>
    <rect x="338" y="618" width="54" height="56" rx="8" fill="#16171a"/>
    <path d="M100 418 L350 418 L362 434 L88 434 Z" fill="#43474e"/>
    <path d="M88 434 L362 434 L398 528 L52 528 Z" fill="#4a4f57"/>
    <path d="M98 444 L352 444 L384 520 L66 520 Z" fill="#1a2430"/>
    <path d="M110 452 L160 452 L104 512 L80 512 Z" fill="#2a3644" stroke="none"/>
