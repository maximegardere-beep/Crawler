    <rect x="176" y="462" width="44" height="26" rx="2" transform="rotate(6 198 475)"/>
    <rect x="226" y="450" width="44" height="26" rx="2" transform="rotate(-4 248 463)"/>
    <rect x="276" y="464" width="44" height="26" rx="2" transform="rotate(10 298 477)"/>
    <rect x="140" y="486" width="44" height="26" rx="2" transform="rotate(12 162 499)"/>
    <rect x="200" y="490" width="44" height="26" rx="2" transform="rotate(-10 222 503)"/>
    <rect x="256" y="492" width="44" height="26" rx="2" transform="rotate(4 278 505)"/>
    <rect x="318" y="488" width="44" height="26" rx="2" transform="rotate(-14 340 501)"/>
    <rect x="96" y="530" width="44" height="26" rx="2" transform="rotate(-20 118 543)"/>
    <rect x="300" y="532" width="44" height="26" rx="2" transform="rotate(16 322 545)"/>
    <rect x="20" y="676" width="44" height="26" rx="2" transform="rotate(-30 42 689)"/>
    <rect x="140" y="690" width="44" height="26" rx="2" transform="rotate(20 162 703)"/>
    <rect x="300" y="684" width="44" height="26" rx="2" transform="rotate(-12 322 697)"/>
  </g>
  <g stroke="#6f6a5c" stroke-width="3" opacity="0.9">
    <path d="M128 466 h24 M184 472 h24 M234 460 h24 M284 474 h24 M148 496 h24 M208 500 h24 M264 502 h24 M324 498 h24"/>
  </g>
  <!-- La lueur de son afficheur, qu'on ne voit pas, éclaire le pare-brise -->
  <ellipse cx="400" cy="500" rx="110" ry="80" fill="url(#horodateur-vengeur-b-glow)"/>
  <!-- L'HORODATEUR, de trois-quarts dos, penché sur la voiture, sur la pointe d'un pied -->
  <g transform="rotate(-11 500 678)" stroke="#05060c" stroke-linejoin="round" stroke-width="5">
    <!-- Pieds : l'un levé derrière (il fait des pointes) -->
    <path d="M436 650 L492 652 L494 682 L434 680 Z" fill="#4a553a"/>
    <path d="M518 640 L572 628 L584 656 L528 668 Z" fill="#4a553a" transform="rotate(-24 548 648)"/>
    <!-- Antenne + voyant ambré (à sa gauche, donc à droite vu de dos) -->
    <path d="M552 414 L562 344 L580 318" fill="none" stroke-width="7"/>
    <circle cx="584" cy="310" r="40" fill="url(#horodateur-vengeur-b-glow)" stroke="none"/>
    <circle cx="584" cy="310" r="15" fill="#fbbf24" stroke-width="5"/>
    <circle cx="579" cy="305" r="4" fill="#fff6d0" stroke="none"/>
    <!-- Chapeau à fente à pièces (vu de derrière) -->
    <rect x="456" y="392" width="88" height="28" rx="6" fill="#4a553a"/>
    <!-- Flanc gauche, côté fente à tickets -->
    <path d="M398 434 L424 416 L424 656 L400 668 Z" fill="#4a553a"/>
    <rect x="398" y="556" width="10" height="34" fill="#05060c" stroke="none"/>
    <!-- Dos -->
    <path d="M424 422 Q424 410 436 410 L570 410 Q582 410 582 422 L582 650 Q582 662 570 662 L436 662 Q424 662 424 650 Z" fill="#7c8a5a" stroke-width="7"/>
    <path d="M566 418 L578 418 L578 654 L566 654 Z" fill="#6b7850" stroke="none"/>
    <!-- Grille d'aération -->
    <g stroke="#4a553a" stroke-width="5" stroke-linecap="round">
      <path d="M448 436 H556 M448 450 H556 M448 464 H556"/>
    </g>
    <!-- Porte de service, cadenas -->
    <rect x="446" y="492" width="112" height="146" rx="8" fill="#72804f" stroke="#4a553a" stroke-width="6"/>
    <path d="M496 556 q0 -16 12 -16 q12 0 12 16" fill="none" stroke-width="5"/>
    <rect x="490" y="554" width="36" height="28" rx="4" fill="#fbbf24" stroke-width="4"/>
    <circle cx="508" cy="566" r="4" fill="#05060c" stroke="none"/>
    <circle cx="456" cy="502" r="4" fill="#4a553a" stroke="none"/>
    <circle cx="548" cy="628" r="4" fill="#4a553a" stroke="none"/>
  </g>
  <!-- Le ruban de contraventions qu'il crache jusqu'au pare-brise -->
  <g stroke="#05060c" stroke-linejoin="round">
    <path d="M412 566 L396 592 C370 586 356 566 362 540 L372 506 L394 508 L386 540 C382 556 392 566 412 566 Z" fill="#e8e4d8" stroke-width="4.5"/>
    <path d="M370 530 h18 M368 546 h18 M372 562 l16 4" stroke="#6f6a5c" stroke-width="3"/>
    <rect x="352" y="488" width="46" height="26" rx="2" fill="#f4f1e6" stroke-width="4" transform="rotate(-18 375 501)"/>
    <path d="M358 498 h26" stroke="#6f6a5c" stroke-width="3" transform="rotate(-18 375 501)"/>
  </g>
  <g stroke="#f4f1e6" stroke-width="4" stroke-linecap="round" opacity="0.75">
    <path d="M344 486 l-14 -10 M362 474 l-4 -16 M398 480 l12 -10"/>
  </g>
  <!-- Pièces qu'il a fait tomber -->
  <g fill="#fbbf24" stroke="#05060c" stroke-width="3">
    <ellipse cx="560" cy="690" rx="9" ry="4"/><ellipse cx="584" cy="696" rx="9" ry="4"/><ellipse cx="420" cy="700" rx="8" ry="3.5"/>
  </g>
  <!-- Premier plan : cachette derrière un pilier rayé et une voiture garée, dans l'ombre -->
  <rect x="0" y="0" width="750" height="1334" fill="#05060c" opacity="0.14"/>
  <g stroke="#05060c" stroke-width="6" stroke-linejoin="round">
    <path d="M630 0 L750 0 L750 1334 L614 1334 Z" fill="#17181b"/>
    <path d="M620 760 L750 760 L750 820 L619 820 Z M618 880 L750 880 L750 940 L617 940 Z" fill="#3a3214" stroke="none"/>
    <path d="M644 0 L660 0 L646 1334 L630 1334 Z" fill="#23252a" stroke="none"/>
    <path d="M0 900 L250 900 Q268 900 272 916 L292 1050 L330 1150 L330 1334 L0 1334 Z" fill="#17181b"/>
    <path d="M0 916 L262 916" stroke="#26282d" stroke-width="10"/>
    <path d="M30 990 l40 -40 M110 990 l40 -40 M190 990 l40 -40" stroke="#3a3214" stroke-width="18"/>
    <path d="M150 900 L178 798 L206 900 Z" fill="#3b2216"/>
    <path d="M166 846 h24" stroke="#4a4a44" stroke-width="10"/>
    <rect x="134" y="892" width="88" height="14" rx="3" fill="#2a1a12"/>
  </g>
  <ellipse cx="375" cy="1300" rx="300" ry="40" fill="#05060c" opacity="0.4"/>
</svg>
