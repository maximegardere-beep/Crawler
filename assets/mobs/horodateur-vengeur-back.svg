  <rect x="0" y="0" width="750" height="650" fill="url(#horodateur-vengeur-b-beton)"/>
  <rect x="0" y="0" width="750" height="80" fill="#18191b"/>
  <g stroke="#05060c" stroke-width="4">
    <rect x="-10" y="78" width="770" height="20" fill="#202124"/>
    <path d="M120 0 V78 M380 0 V78 M620 0 V78" stroke="#202124" stroke-width="18"/>
  </g>
  <g stroke="#05060c" stroke-width="4">
    <rect x="150" y="116" width="170" height="15" rx="7" fill="#c9d6e6"/>
    <rect x="460" y="116" width="140" height="15" rx="7" fill="#4f5964"/>
    <path d="M176 98 v18 M296 98 v18 M486 98 v18 M576 98 v18"/>
  </g>
  <ellipse cx="235" cy="160" rx="200" ry="70" fill="#dbeafe" opacity="0.07"/>
  <g fill="#a3a3a3" opacity="0.16">
    <path d="M146 222 h44 l-5 18 h-33 Z M198 224 h18 v34 h-18 Z M152 250 h32 l3 26 h-38 Z M226 228 l26 -5 l7 22 l-29 8 Z M204 264 h48 l-7 18 h-37 Z"/>
    <path d="M496 224 h42 l-4 16 h-35 Z M546 220 h22 v38 h-22 Z M500 250 h34 l2 26 h-38 Z M576 226 l28 3 l-3 24 l-27 -3 Z M548 266 h54 l-8 16 h-42 Z"/>
    <rect x="146" y="292" width="118" height="7"/><rect x="496" y="292" width="118" height="7"/>
  </g>
  <g stroke="#05060c" stroke-width="5">
    <rect x="440" y="98" width="60" height="552" fill="#303236"/>
    <rect x="440" y="520" width="60" height="110" fill="#141414"/>
  </g>
  <g fill="#8a7424" opacity="0.8"><rect x="442" y="530" width="56" height="11"/><rect x="442" y="556" width="56" height="11"/><rect x="442" y="582" width="56" height="11"/><rect x="442" y="608" width="56" height="11"/></g>
  <!-- Sol : béton, lignes de place, flèche -->
  <rect x="0" y="650" width="750" height="684" fill="#27292b"/>
  <path d="M0 650 H750" stroke="#05060c" stroke-width="5"/>
  <g stroke="#8a7424" stroke-width="10" opacity="0.38">
    <path d="M20 650 L-120 1334 M430 650 L560 1334"/>
  </g>
  <path d="M120 900 H300 V878 L364 918 L300 958 V936 H120 Z" fill="#d4d4d4" opacity="0.1"/>
