<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- Horodateur Vengeur, Parking Souterrain Maudit, cadrage « back » : il colle contravention sur contravention sur une voiture garée. Aucun texte. -->
  <defs>
    <pattern id="horodateur-vengeur-b-beton" width="110" height="56" patternUnits="userSpaceOnUse">
      <rect width="110" height="56" fill="#2c2e30"/>
      <rect x="55" y="28" width="55" height="28" fill="#292b2d"/>
      <rect x="0" y="0" width="55" height="28" fill="#2a2c2e"/>
