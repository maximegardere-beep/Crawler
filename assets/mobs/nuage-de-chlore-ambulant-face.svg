<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- Nuage de Chlore Ambulant, mob de la Piscine Municipale Désaffectée, cadrage « face ». Il fond sur nous
       en diagonale, poing de vapeur en avant, yeux cyan furibonds, et nous souffle son haleine de pédiluve.
       Palette du sprite : base #b8d84a, sombre #7a9a2a, accent #22d3ee (bulles et yeux). Aucun texte. -->
  <defs>
    <pattern id="nuage-de-chlore-ambulant-f-tiles" width="80" height="42" patternUnits="userSpaceOnUse">
      <rect width="80" height="42" fill="#162b37"/>
      <rect x="1.5" y="1.5" width="37" height="18" rx="2" fill="#1f3a49"/>
      <rect x="41.5" y="1.5" width="37" height="18" rx="2" fill="#223f4e"/>
      <rect x="-18" y="22.5" width="37" height="18" rx="2" fill="#223f4e"/>
      <rect x="22.5" y="22.5" width="37" height="18" rx="2" fill="#1f3a49"/>
      <rect x="61.5" y="22.5" width="37" height="18" rx="2" fill="#213d4c"/>
    </pattern>
    <radialGradient id="nuage-de-chlore-ambulant-f-halo">
      <stop offset="0" stop-color="#bae6fd" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#bae6fd" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Mur carrelé, plafond à poutrelles -->
  <rect x="0" y="0" width="750" height="900" fill="url(#nuage-de-chlore-ambulant-f-tiles)"/>
  <rect x="0" y="0" width="750" height="92" fill="#121c24"/>
  <g stroke="#05060c" stroke-width="5">
    <path d="M0 74 H750" stroke="#2a3a45" stroke-width="14"/>
    <path d="M0 66 H750 M0 82 H750"/>
    <path d="M120 0 V70 M375 0 V70 M630 0 V70" stroke="#2a3a45" stroke-width="12"/>
  </g>
  <path d="M0 92 H750" stroke="#05060c" stroke-width="5"/>
  <!-- Néon tube en haut à droite -->
  <circle cx="620" cy="130" r="230" fill="url(#nuage-de-chlore-ambulant-f-halo)"/>
  <g stroke="#05060c" stroke-width="5">
    <path d="M560 92 V112 M680 92 V112" fill="none"/>
    <rect x="540" y="110" width="160" height="22" rx="10" fill="#bae6fd"/>
  </g>
  <!-- Reflets d'eau (caustiques) sur le carrelage -->
  <g fill="none" stroke="#9fe7f5" stroke-width="6" stroke-linecap="round" opacity="0.1">
    <path d="M20 250 q40 -24 80 0 t80 0 t80 0 M420 230 q40 -24 80 0 t80 0 t80 0"/>
    <path d="M60 330 q35 20 70 0 t70 0 M480 320 q35 20 70 0 t70 0 t70 0"/>
    <path d="M0 640 q40 -22 80 0 t80 0 M560 600 q40 -22 80 0 t80 0 t80 0"/>
  </g>
  <!-- Panneau de profondeur illisible -->
  <g stroke="#05060c" stroke-width="5">
    <rect x="36" y="440" width="130" height="58" rx="8" fill="#1d3b4a"/>
    <path d="M54 462 h94 M54 480 h60" stroke="#6f8994" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- Plongeoir à gauche -->
  <g transform="translate(750 0) scale(-1 1)" stroke="#05060c" stroke-width="6" stroke-linejoin="round">
    <path d="M650 900 V760 M714 900 V760" stroke="#3a4a52" stroke-width="16"/>
    <path d="M650 900 V760 M714 900 V760" fill="none" stroke-width="4"/>
    <path d="M560 744 L760 724 L760 752 L566 770 Z" fill="#4a5f66"/>
    <path d="M572 752 L740 736" stroke="#6f8a8e" stroke-width="4"/>
  </g>
  <!-- Sol de bord de bassin, carrelage en perspective -->
  <rect x="0" y="900" width="750" height="434" fill="#1c2e39"/>
  <rect x="0" y="900" width="750" height="26" fill="#2c4250"/>
  <path d="M0 900 H750" stroke="#05060c" stroke-width="6"/>
  <g stroke="#14232c" stroke-width="5" fill="none">
    <path d="M0 970 H750 M0 1040 H750 M0 1130 H750 M0 1240 H750"/>
    <path d="M300 926 L120 1334 M375 926 L375 1334 M450 926 L630 1334 M225 926 L-120 1334 M525 926 L870 1334 M150 926 L-300 1334 M600 926 L1050 1334"/>
  </g>
  <!-- Échelle de piscine, au premier plan à droite -->
  <g stroke="#05060c" stroke-linecap="round" fill="none" transform="translate(760 0) scale(-1 1)">
    <path d="M70 1090 V880 Q70 820 130 820 Q170 820 170 870" stroke-width="22"/>
    <path d="M70 1090 V880 Q70 820 130 820 Q170 820 170 870" stroke="#7d8f96" stroke-width="12"/>
    <path d="M150 1110 V900 Q150 846 200 846 Q236 846 236 890" stroke-width="22"/>
    <path d="M150 1110 V900 Q150 846 200 846 Q236 846 236 890" stroke="#6b7c83" stroke-width="12"/>
  </g>
  <!-- Flaque décolorée -->
  <ellipse cx="200" cy="1170" rx="120" ry="20" fill="#2c4a52" stroke="#05060c" stroke-width="4"/>
  <ellipse cx="180" cy="1166" rx="50" ry="6" fill="#d9f0a0" opacity="0.18"/>
  <rect x="0" y="0" width="50" height="1334" fill="#05060c" opacity="0.25"/>
  <rect x="700" y="0" width="50" height="1334" fill="#05060c" opacity="0.25"/>

  <!-- Aura de chlore : nappes irrégulières vert-jaune + particules -->
  <path d="M380 150 C560 170 690 330 670 560 C655 760 560 930 380 960 C210 950 70 820 70 600 C80 360 200 160 380 150 Z" fill="#cbe86a" opacity="0.08"/>
  <path d="M400 250 C530 280 600 400 590 560 C580 720 500 840 370 850 C240 840 150 720 160 560 C170 400 260 260 400 250 Z" fill="#cbe86a" opacity="0.1"/>
  <g fill="#cbe86a" opacity="0.3"><circle cx="120" cy="400" r="12"/><circle cx="650" cy="470" r="9"/><circle cx="600" cy="300" r="7"/><circle cx="160" cy="720" r="8"/></g>

  <!-- Lignes de mouvement (il arrive de la droite, au fond) -->
  <g stroke="#d9f0a0" stroke-width="7" stroke-linecap="round" opacity="0.35">
    <path d="M620 560 h90 M640 610 h70 M610 660 h100 M650 380 h60"/>
  </g>
  <!-- Ombre au sol -->
  <ellipse cx="360" cy="1030" rx="250" ry="28" fill="#05060c" opacity="0.45"/>
  <ellipse cx="360" cy="1028" rx="150" ry="14" fill="#b8d84a" opacity="0.08"/>

  <!-- Le nuage -->
  <g transform="translate(395 625) rotate(-9)" stroke="#05060c" stroke-linejoin="round" stroke-linecap="round">
    <!-- Traînée de vapeur derrière lui -->
    <path d="M200 240 C300 250 360 200 420 230 C380 280 300 300 230 300 Z" fill="#7a9a2a" stroke-width="6"/>
    <path d="M230 120 C320 110 360 60 430 80 C400 130 330 160 250 170 Z" fill="#9cbc3a" stroke-width="6"/>
    <!-- Bras arrière, poing levé -->
    <path d="M200 -40 Q260 -80 290 -150" fill="none" stroke-width="76"/>
    <path d="M200 -40 Q260 -80 290 -150" fill="none" stroke="#9cbc3a" stroke-width="62"/>
    <g fill="#9cbc3a" stroke-width="6">
      <circle cx="290" cy="-172" r="40"/><circle cx="322" cy="-150" r="30"/><circle cx="272" cy="-204" r="30"/>
    </g>
    <!-- Corps : silhouette du fantôme, bord en bouffées de nuage -->
    <path d="M-230 300 A75 75 0 0 1 -245 170 A75 75 0 0 1 -235 40 A78 78 0 0 1 -205 -90 A75 75 0 0 1 -160 -210 A70 70 0 0 1 -95 -310 A68 68 0 0 1 0 -370 A68 68 0 0 1 100 -330 A66 66 0 0 1 170 -240 A72 72 0 0 1 215 -120 A76 76 0 0 1 240 10 A76 76 0 0 1 250 150 A82 82 0 0 1 245 300 Q205 380 160 310 Q115 372 70 315 Q20 388 -30 315 Q-80 376 -125 312 Q-178 382 -230 300 Z" fill="#b8d84a" stroke-width="10"/>
    <!-- Ombre (côté droit et ourlet) -->
    <path d="M150 -250 C220 -150 240 0 230 150 C228 240 210 290 160 300 Q115 360 70 305 Q20 370 -30 305 C40 300 120 240 150 120 C175 20 175 -140 150 -250 Z" fill="#7a9a2a" opacity="0.85" stroke="none"/>
    <!-- Reflets clairs -->
    <path d="M-170 -150 C-150 -230 -100 -290 -40 -320" fill="none" stroke="#e4f5a8" stroke-width="16" opacity="0.8"/>
    <circle cx="-185" cy="-60" r="12" fill="#e4f5a8" stroke="none" opacity="0.8"/>
    <!-- Bouffées internes -->
    <g fill="none" stroke="#7a9a2a" stroke-width="6" opacity="0.8">
      <path d="M-180 120 a40 40 0 0 1 70 -10 a36 36 0 0 1 60 10"/>
      <path d="M-120 230 a36 36 0 0 1 60 -8"/>
    </g>
    <!-- Yeux cyan furieux, braqués sur nous -->
    <ellipse cx="-80" cy="-175" rx="54" ry="46" fill="#22d3ee" stroke-width="9"/>
    <ellipse cx="62" cy="-188" rx="44" ry="40" fill="#22d3ee" stroke-width="9"/>
    <circle cx="-74" cy="-168" r="20" fill="#05060c" stroke="none"/>
    <circle cx="58" cy="-180" r="17" fill="#05060c" stroke="none"/>
    <circle cx="-66" cy="-176" r="6" fill="#f0fdff" stroke="none"/>
    <circle cx="64" cy="-187" r="5" fill="#f0fdff" stroke="none"/>
    <path d="M-150 -258 L-34 -212" stroke-width="22"/>
    <path d="M18 -222 L118 -268" stroke-width="20"/>
    <path d="M-150 -258 L-34 -212 M18 -222 L118 -268" stroke="#4a6418" stroke-width="8"/>
    <!-- Bouche grande ouverte : il souffle -->
    <path d="M-95 -80 Q-10 -120 70 -92 Q66 10 -10 22 Q-86 18 -95 -80 Z" fill="#2a3a0e" stroke-width="9"/>
    <path d="M-60 -6 Q-12 -40 36 -8 Q14 14 -14 16 Q-46 14 -60 -6 Z" fill="#5f7a1e" stroke-width="5"/>
    <!-- Bras avant, poing de vapeur vers nous -->
    <path d="M-190 30 Q-280 90 -330 190" fill="none" stroke-width="104"/>
    <path d="M-190 30 Q-280 90 -330 190" fill="none" stroke="#b8d84a" stroke-width="88"/>
    <path d="M-230 60 Q-290 110 -318 170" fill="none" stroke="#7a9a2a" stroke-width="14" opacity="0.7"/>
    <g fill="#b8d84a" stroke-width="8">
      <circle cx="-318" cy="226" r="62"/><circle cx="-372" cy="190" r="46"/><circle cx="-266" cy="270" r="44"/><circle cx="-350" cy="268" r="42"/>
    </g>
    <path d="M-360 214 q24 -8 40 10 M-312 250 q22 -6 34 12" fill="none" stroke-width="6"/>
    <!-- Bouffées translucides qui montent de sa tête (détail signature) -->
    <circle cx="-110" cy="-400" r="44" fill="#b8d84a" opacity="0.6" stroke-width="6"/>
    <circle cx="70" cy="-418" r="52" fill="#cbe86a" opacity="0.55" stroke-width="6"/>
    <circle cx="-20" cy="-480" r="36" fill="#b8d84a" opacity="0.55" stroke-width="5"/>
  </g>

  <!-- Postillons de chlore -->
  <g fill="#d9f0a0" stroke="#05060c" stroke-width="4" opacity="0.8">
    <circle cx="300" cy="640" r="9"/><circle cx="270" cy="680" r="6"/><circle cx="440" cy="660" r="7"/>
  </g>
  <!-- Bulles de chlore cyan -->
  <g fill="#22d3ee" stroke="#05060c" stroke-width="4">
    <circle cx="560" cy="230" r="16"/><circle cx="610" cy="300" r="10"/><circle cx="150" cy="300" r="13"/>
    <circle cx="640" cy="760" r="14"/><circle cx="110" cy="610" r="9"/><circle cx="270" cy="930" r="11"/>
    <circle cx="500" cy="960" r="8"/><circle cx="210" cy="180" r="8"/>
  </g>
  <g fill="#f0fdff"><circle cx="555" cy="224" r="5"/><circle cx="146" cy="295" r="4"/><circle cx="636" cy="755" r="4"/></g>
  <!-- Éclats de carrelage décollé -->
  <g fill="#2f5566" stroke="#05060c" stroke-width="4">
    <path d="M610 880 l26 -8 l6 20 l-26 8 Z"/><path d="M90 960 l22 6 l-6 20 l-22 -6 Z"/><path d="M680 960 l18 -4 l4 16 l-18 4 Z"/>
  </g>
</svg>
