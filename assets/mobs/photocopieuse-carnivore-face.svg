    <path d="M496 664 L582 698 L584 742 L498 712 Z" fill="#3a4047" stroke-width="6"/>
    <path d="M520 684 L668 634 L690 698 L548 752 Z" fill="#e8e4d8" stroke-width="6"/>
    <path d="M560 690 L650 660 M566 706 L660 674 M572 722 L640 698" stroke="#8a8478" stroke-width="5"/>
