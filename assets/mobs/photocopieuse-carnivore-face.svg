  <g transform="translate(36 0) rotate(-7 370 1030)" stroke="#05060c" stroke-linejoin="round">
    <!-- Antenne et voyant rouge -->
    <path d="M232 250 L238 150 L214 108" fill="none" stroke-width="8"/>
    <circle cx="210" cy="102" r="42" fill="url(#photocopieuse-carnivore-f-glow)" stroke="none"/>
    <circle cx="210" cy="102" r="18" fill="#c23b3b" stroke-width="6"/>
    <circle cx="204" cy="96" r="5" fill="#ffb3a8" stroke="none"/>
    <!-- Roulettes -->
    <g fill="#5f6770" stroke-width="7">
      <rect x="150" y="1000" width="80" height="34" rx="6"/>
      <rect x="392" y="992" width="80" height="34" rx="6"/>
      <rect x="532" y="956" width="56" height="30" rx="6"/>
    </g>
    <g fill="#05060c"><circle cx="190" cy="1040" r="14"/><circle cx="432" cy="1032" r="14"/><circle cx="560" cy="992" r="11"/></g>
