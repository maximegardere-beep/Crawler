    <path d="M140 330 L485 282 L592 345 L594 500 L470 452 L140 480 Z" fill="#2a0d10" stroke-width="9"/>
    <ellipse cx="310" cy="440" rx="190" ry="50" fill="url(#photocopieuse-carnivore-f-glow)" stroke="none"/>
    <path d="M150 462 L466 434 L466 420 L150 448 Z" fill="#ff6a55" stroke="none"/>
    <path d="M240 400 C280 380 340 380 380 392 C350 410 290 414 240 400 Z" fill="#7a1e22" stroke="none"/>
    <!-- Flanc droit (sombre) -->
    <path d="M470 452 L592 497 L602 950 L490 995 Z" fill="#5f6770" stroke-width="9"/>
    <path d="M500 520 L572 548 M500 560 L572 588 M502 600 L574 628" stroke="#4a5058" stroke-width="7"/>
    <!-- Façade -->
    <path d="M140 480 L470 452 L490 995 L124 1010 Z" fill="#9aa3ad" stroke-width="11"/>
    <path d="M444 456 L470 452 L490 995 L464 997 Z" fill="#7f8892" stroke="none"/>
    <path d="M158 506 L186 503 L170 982 L142 984 Z" fill="#b6bec7" stroke="none"/>
