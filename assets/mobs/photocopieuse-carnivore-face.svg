<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <defs>
    <pattern id="photocopieuse-carnivore-f-panels" width="100" height="70" patternUnits="userSpaceOnUse">
      <rect width="100" height="70" fill="#2b2d33"/>
      <rect x="3" y="3" width="44" height="64" rx="3" fill="#363841"/>
      <rect x="52" y="3" width="44" height="64" rx="3" fill="#33353e"/>
      <rect x="3" y="3" width="44" height="8" fill="#3d4049"/>
      <rect x="52" y="3" width="44" height="8" fill="#3b3e47"/>
    </pattern>
    <radialGradient id="photocopieuse-carnivore-f-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a4a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff5a4a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Décor : bureaux pénitentiaires (panneaux, néons, fenêtre à barreaux, horloge, classeur, panneau rouge) -->
  <rect x="0" y="0" width="750" height="1040" fill="url(#photocopieuse-carnivore-f-panels)"/>
  <rect x="0" y="0" width="750" height="70" fill="#202227"/>
  <g stroke="#05060c" stroke-width="4">
    <rect x="70" y="32" width="210" height="24" rx="10" fill="#c9d6cc"/>
    <rect x="470" y="32" width="210" height="24" rx="10" fill="#5a6460"/>
  </g>
  <ellipse cx="175" cy="110" rx="190" ry="70" fill="#e2f0e6" opacity="0.07"/>
  <g stroke="#05060c" stroke-width="6">
    <rect x="48" y="170" width="190" height="150" fill="#18202a"/>
    <path d="M86 170 V320 M124 170 V320 M162 170 V320 M200 170 V320" stroke="#4a4e56" stroke-width="9"/>
    <rect x="48" y="170" width="190" height="150" fill="none"/>
    <circle cx="635" cy="215" r="48" fill="#cbc6b4"/>
    <path d="M635 215 V182 M635 215 L660 228" stroke-width="7" stroke-linecap="round"/>
    <rect x="555" y="505" width="160" height="56" rx="6" fill="#4a1d1d"/>
    <rect x="25" y="600" width="165" height="440" fill="#363841"/>
    <path d="M25 710 h165 M25 820 h165 M25 930 h165" stroke-width="4"/>
    <rect x="52" y="640" width="110" height="12" rx="4" fill="#474a55"/>
    <rect x="52" y="750" width="110" height="12" rx="4" fill="#474a55"/>
    <rect x="52" y="860" width="110" height="12" rx="4" fill="#474a55"/>
  </g>
  <g fill="#8a826c"><rect x="575" y="524" width="38" height="16" rx="3"/><rect x="620" y="524" width="72" height="16" rx="3"/></g>
  <path d="M60 300 L230 190" stroke="#7dd3fc" stroke-width="5" opacity="0.08"/>
  <!-- Sol -->
  <rect x="0" y="1040" width="750" height="294" fill="#2c2d30"/>
  <path d="M0 1040 H750" stroke="#05060c" stroke-width="6"/>
  <g stroke="#232427" stroke-width="4"><path d="M110 1120 h520 M70 1200 h610 M40 1280 h670"/></g>
  <rect x="0" y="0" width="55" height="1334" fill="#05060c" opacity="0.22"/>
  <rect x="695" y="0" width="55" height="1334" fill="#05060c" opacity="0.22"/>
  <!-- Aura de fureur, irrégulière -->
  <path d="M110 620 C90 430 160 250 300 210 C420 170 560 220 620 330 C680 450 660 650 640 820 C620 960 540 1030 370 1030 C210 1030 130 880 110 620 Z" fill="#c23b3b" opacity="0.07"/>
  <path d="M170 640 C160 480 220 330 330 300 C440 270 560 330 590 450 C620 580 600 760 580 880 C560 980 470 1010 370 1000 C250 990 180 830 170 640 Z" fill="#ff5a4a" opacity="0.07"/>
