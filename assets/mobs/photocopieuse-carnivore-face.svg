  <g stroke="#a6aeb8" stroke-width="6" stroke-linecap="round" opacity="0.5">
    <path d="M640 640 h70"/><path d="M655 720 h50"/><path d="M630 900 h80"/><path d="M40 440 h50"/>
  </g>
  <!-- Ombre au sol -->
  <ellipse cx="370" cy="1040" rx="260" ry="26" fill="#05060c" opacity="0.5"/>
