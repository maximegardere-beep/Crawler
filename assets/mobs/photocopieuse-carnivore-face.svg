    <path d="M340 508 L450 498 L452 576 L342 586 Z" fill="#c23b3b" stroke-width="7"/>
    <path d="M350 518 L440 510 L442 566 L352 574 Z" fill="#e0574b" stroke="none"/>
    <rect x="376" y="524" width="36" height="36" fill="#05060c" stroke="none"/>
    <rect x="380" y="528" width="11" height="11" fill="#ffd8d0" stroke="none"/>
    <path d="M326 534 L466 482" stroke-width="18" stroke-linecap="round"/>
    <!-- Clavier sous l'écran -->
    <g fill="#5f6770" stroke-width="3">
      <rect x="352" y="604" width="20" height="14" rx="2"/><rect x="378" y="602" width="20" height="14" rx="2"/><rect x="404" y="600" width="20" height="14" rx="2"/>
      <rect x="353" y="624" width="20" height="14" rx="2"/><rect x="379" y="622" width="20" height="14" rx="2"/>
      <rect x="405" y="620" width="20" height="14" rx="2" fill="#6fae5a"/>
    </g>
    <!-- Bacs à papier et leurs deux boutons sombres -->
    <path d="M134 730 L474 712 M131 838 L478 822 M128 938 L482 924" fill="none" stroke-width="6"/>
    <g fill="#5f6770" stroke-width="6">
      <circle cx="226" cy="780" r="21"/><circle cx="344" cy="774" r="21"/>
      <rect x="236" y="872" width="116" height="18" rx="6"/>
    </g>
    <circle cx="220" cy="774" r="6" fill="#8a929c" stroke="none"/>
    <circle cx="338" cy="768" r="6" fill="#8a929c" stroke="none"/>
    <!-- Dents du bas (bord de la vitre) -->
    <path d="M146 480 L161 433 L175 478 L190 437 L205 475 L219 428 L234 473 L248 432 L263 470 L278 423 L292 468 L307 427 L322 465 L336 418 L351 463 L366 422 L380 460 L395 413 L409 458 L424 418 L439 455 L453 408 L468 453 Z" fill="#e8e4d8" stroke-width="4"/>
    <!-- Couvercle relevé (mâchoire du haut) avec chargeur de documents -->
    <path d="M170 298 L452 258 L430 196 L196 226 Z" fill="#7a828c" stroke-width="8"/>
    <path d="M212 248 L420 220 L428 242 L218 270 Z" fill="#4a5058" stroke="none"/>
    <path d="M136 296 L482 248 L596 310 L592 345 L485 282 L140 330 Z" fill="#5f6770" stroke-width="9"/>
    <path d="M140 330 L485 282 L592 345 L588 358 L484 296 L142 344 Z" fill="#3a4047" stroke-width="5"/>
    <!-- Dents du haut -->
    <path d="M142 344 L158 396 L173 340 L189 383 L204 335 L220 387 L235 331 L251 375 L266 327 L282 378 L297 322 L313 366 L329 318 L344 370 L360 313 L375 357 L391 309 L406 361 L422 305 L437 348 L453 300 L468 352 L484 296 Z" fill="#e8e4d8" stroke-width="4"/>
    <!-- Voyant rouge du couvercle -->
    <circle cx="424" cy="270" r="30" fill="url(#photocopieuse-carnivore-f-glow)" stroke="none"/>
    <circle cx="424" cy="270" r="12" fill="#c23b3b" stroke-width="5"/>
    <!-- Formulaire à moitié mâché qui pend de la gueule -->
    <path d="M168 440 L232 430 L248 520 L224 508 L210 536 L194 512 L172 528 Z" fill="#e8e4d8" stroke-width="5"/>
    <path d="M182 460 L226 454 M186 480 L230 474 M188 498 L218 494" stroke="#8a8478" stroke-width="4"/>
  </g>
  <!-- Feuilles crachées comme des projectiles -->
  <g stroke="#05060c" stroke-width="5" stroke-linejoin="round">
    <g transform="rotate(-24 600 300)">
      <rect x="560" y="250" width="84" height="108" rx="3" fill="#e8e4d8"/>
      <path d="M574 274 h56 M574 292 h56 M574 310 h40" stroke="#8a8478" stroke-width="5"/>
    </g>
    <g transform="translate(-34 210) rotate(18 110 560) scale(0.85)">
      <rect x="62" y="500" width="100" height="128" rx="3" fill="#f2efe6"/>
      <path d="M78 528 h68 M78 548 h68 M78 568 h48" stroke="#8a8478" stroke-width="6"/>
    </g>
    <g transform="rotate(-38 640 820)">
      <rect x="606" y="776" width="68" height="88" rx="3" fill="#ddd8ca"/>
      <path d="M618 796 h44 M618 812 h44" stroke="#8a8478" stroke-width="4"/>
    </g>
    <g transform="rotate(30 330 120)">
      <rect x="306" y="92" width="50" height="62" rx="2" fill="#d6d1c2"/>
    </g>
  </g>
  <!-- Traînées des feuilles -->
  <g stroke="#e8e4d8" stroke-width="5" stroke-linecap="round" opacity="0.45">
    <path d="M540 360 l-46 40 M556 380 l-34 30"/>
    <path d="M140 760 l40 22 M136 790 l30 16"/>
    <path d="M590 860 l-40 -10"/>
  </g>
  <!-- Agrafes et éclats -->
  <g fill="none" stroke="#c8ccd2" stroke-width="5" stroke-linecap="round">
    <path d="M510 230 v-12 h16 v12"/><path d="M96 760 h12 v16 h-12"/><path d="M660 470 v12 h14 v-12"/><path d="M262 150 l8 -9 l12 10 l-8 9"/>
  </g>
  <!-- Poussière soulevée -->
  <g fill="#3e4046" stroke="#05060c" stroke-width="3">
    <path d="M520 1040 q20 -34 50 -20 q26 -22 48 4 q26 6 10 30 Z"/>
    <path d="M100 1046 q8 -26 34 -18 q20 -14 34 6 q14 10 -4 20 Z"/>
  </g>
</svg>
