<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- Mime Aggressif (Rue des Illusions), cadrage « dos ». Même mannequin sur pied (beige #d9cbb0, béret
       #2a2f3a, marinière, gants blancs #e8e4d8, foulard #c23b3b) vu de dos sous un réverbère : il est
       coincé dans sa boîte invisible, une main au mur, l'autre au plafond, devant un chapeau de quête
       vide. On l'observe depuis l'angle d'un mur sombre. Aucun texte. -->
  <defs>
    <pattern id="mime-aggressif-b-bricks" width="84" height="44" patternUnits="userSpaceOnUse" patternTransform="scale(0.6)">
      <rect width="84" height="44" fill="#110e15"/>
      <rect x="2" y="2" width="38" height="18" rx="2" fill="#221c2a"/>
      <rect x="44" y="2" width="38" height="18" rx="2" fill="#1d1824"/>
      <rect x="-19" y="24" width="38" height="18" rx="2" fill="#1d1824"/>
      <rect x="23" y="24" width="38" height="18" rx="2" fill="#221c2a"/>
      <rect x="65" y="24" width="38" height="18" rx="2" fill="#201a27"/>
    </pattern>
    <pattern id="mime-aggressif-b-dark" width="84" height="44" patternUnits="userSpaceOnUse">
      <rect width="84" height="44" fill="#050408"/>
      <rect x="2" y="2" width="38" height="18" rx="2" fill="#0e0c12"/>
      <rect x="44" y="2" width="38" height="18" rx="2" fill="#0b0a0f"/>
      <rect x="-19" y="24" width="38" height="18" rx="2" fill="#0b0a0f"/>
      <rect x="23" y="24" width="38" height="18" rx="2" fill="#0e0c12"/>
      <rect x="65" y="24" width="38" height="18" rx="2" fill="#0c0b10"/>
    </pattern>
    <pattern id="mime-aggressif-b-cobbles" width="70" height="36" patternUnits="userSpaceOnUse" patternTransform="scale(0.8)">
      <rect width="70" height="36" fill="#141218"/>
      <rect x="3" y="3" width="30" height="13" rx="6" fill="#27242d"/>
      <rect x="37" y="3" width="30" height="13" rx="6" fill="#222029"/>
      <rect x="-14" y="20" width="30" height="13" rx="6" fill="#222029"/>
      <rect x="20" y="20" width="30" height="13" rx="6" fill="#27242d"/>
      <rect x="54" y="20" width="30" height="13" rx="6" fill="#25222b"/>
    </pattern>
    <radialGradient id="mime-aggressif-b-glow">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="mime-aggressif-b-torso">
      <path d="M-10 -62 Q-12 -46 -7 -32 L7 -32 Q12 -46 10 -62 Z"/>
    </clipPath>
  </defs>
  <!-- Rue la nuit -->
  <rect x="0" y="0" width="750" height="720" fill="url(#mime-aggressif-b-bricks)"/>
  <rect x="0" y="0" width="750" height="110" fill="#07080f"/>
  <g fill="#3a3450"><circle cx="260" cy="40" r="3"/><circle cx="470" cy="22" r="2"/><circle cx="640" cy="60" r="3"/></g>
  <g stroke="#05060c" stroke-width="5" stroke-linejoin="round">
    <path d="M560 150 L760 174 L760 720 L552 720 Z" fill="#262032"/>
    <g stroke-width="4">
      <rect x="590" y="220" width="44" height="58" fill="#14111a"/>
      <rect x="670" y="228" width="44" height="58" fill="#544630"/>
      <rect x="590" y="340" width="44" height="58" fill="#4a3f2c"/>
      <rect x="670" y="348" width="44" height="58" fill="#14111a"/>
    </g>
    <path d="M190 160 L330 142 L336 720 L190 720 Z" fill="#2b2336"/>
    <rect x="226" y="210" width="40" height="54" fill="#14111a" stroke-width="4"/>
    <rect x="226" y="320" width="40" height="54" fill="#4a3f2c" stroke-width="4"/>
  </g>
  <!-- affiche illisible -->
  <g stroke="#05060c" stroke-width="4" transform="rotate(-4 400 250)">
    <rect x="364" y="200" width="72" height="96" rx="5" fill="#2f2840"/>
    <ellipse cx="400" cy="236" rx="18" ry="22" fill="#8d8698"/>
    <path d="M382 274 h36 M388 285 h24" stroke="#4d4462" stroke-width="5"/>
  </g>
  <!-- réverbère et son halo -->
  <ellipse cx="520" cy="450" rx="240" ry="270" fill="url(#mime-aggressif-b-glow)"/>
  <g stroke="#05060c" stroke-width="5" stroke-linejoin="round" transform="translate(96 -20)">
    <rect x="532" y="250" width="12" height="490" fill="#1a1620"/>
    <path d="M538 256 q-16 -44 -56 -26" fill="none" stroke="#1a1620" stroke-width="9"/>
    <path d="M508 232 h-42 l8 32 h26 Z" fill="#1a1620"/>
    <rect x="476" y="264" width="22" height="14" fill="#e8c46a"/>
  </g>
  <!-- pavés, brume -->
  <rect x="0" y="710" width="750" height="624" fill="url(#mime-aggressif-b-cobbles)"/>
  <path d="M0 710 H750" stroke="#05060c" stroke-width="5"/>
  <path d="M0 668 Q200 640 400 680 T750 664 L750 740 L0 740 Z" fill="#8b84a0" opacity="0.09"/>
  <rect x="0" y="900" width="750" height="434" fill="#05060c" opacity="0.25"/>
  <ellipse cx="452" cy="740" rx="200" ry="36" fill="#ffd76a" opacity="0.06"/>

  <!-- chapeau de quête vide -->
  <g stroke="#05060c" stroke-width="4">
    <ellipse cx="330" cy="722" rx="34" ry="9" fill="#1d1a24"/>
    <path d="M306 722 Q307 702 330 701 Q353 702 354 722 Z" fill="#25212e"/>
    <ellipse cx="330" cy="705" rx="20" ry="4.5" fill="#0d0b11"/>
  </g>
  <!-- boîte invisible : reflets à peine visibles -->
  <g fill="none" stroke="#e8e4d8" stroke-linecap="round" opacity="0.28" stroke-width="4">
    <path d="M354 270 H534 M354 270 V712 M534 270 V712" stroke-dasharray="6 18"/>
    <path d="M364 300 l26 -20 M366 326 l14 -11 M518 600 l-22 18"/>
  </g>

  <!-- ===== LE MIME, de dos ===== -->
  <g transform="translate(444 716) scale(4.6)" stroke="#05060c" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="0" cy="0" rx="15" ry="3" fill="#05060c" opacity="0.45" stroke="none"/>
    <rect x="-10" y="-4" width="20" height="4" rx="1" fill="#2a2f3a" stroke-width="1.1"/>
    <rect x="-1.6" y="-24" width="3.2" height="21" fill="#2a2f3a" stroke-width="1"/>
    <!-- bras gauche : main à plat contre le mur invisible -->
    <path d="M-9 -58 L-15 -55 L-19 -63" fill="none" stroke-width="4.6"/>
    <path d="M-9 -58 L-15 -55 L-19 -63" fill="none" stroke="#d9cbb0" stroke-width="3"/>
    <circle cx="-15" cy="-55" r="1.9" fill="#c9bb9f" stroke-width="0.9"/>
    <path d="M-21.5 -71 C-23 -68 -23 -62 -21.5 -59 L-17.5 -60 C-17 -63 -17 -68 -17.5 -71 Z" fill="#e8e4d8" stroke-width="1.1"/>
    <path d="M-19.5 -69 v7" stroke="#a9a293" stroke-width="0.6"/>
    <path d="M-18.5 -61 l2 1.5 l-1 2 l-2.5 -1 Z" fill="#e8e4d8" stroke-width="0.9"/>
    <!-- bras droit : main à plat contre le plafond invisible -->
    <path d="M9 -59 L16 -70 L13 -92" fill="none" stroke-width="4.6"/>
    <path d="M9 -59 L16 -70 L13 -92" fill="none" stroke="#d9cbb0" stroke-width="3"/>
    <circle cx="16" cy="-70" r="1.9" fill="#c9bb9f" stroke-width="0.9"/>
    <path d="M7 -97 C10 -98.5 16 -98.5 20 -97 L19 -93 C16 -92.5 10 -92.5 8 -93 Z" fill="#e8e4d8" stroke-width="1.1"/>
    <path d="M10 -95.3 h8" stroke="#a9a293" stroke-width="0.6"/>
    <path d="M11 -93 l1 3 h3 l0.5 -3 Z" fill="#e8e4d8" stroke-width="0.9"/>
    <!-- hanches, buste en marinière vu de dos -->
    <rect x="-8" y="-33" width="16" height="10" rx="3" fill="#d9cbb0" stroke-width="1.3"/>
    <path d="M-10 -62 Q-12 -46 -7 -32 L7 -32 Q12 -46 10 -62 Z" fill="#d9cbb0" stroke-width="1.4"/>
    <g clip-path="url(#mime-aggressif-b-torso)" fill="#2a2f3a" stroke="none">
      <rect x="-14" y="-57.5" width="28" height="2.6"/>
      <rect x="-14" y="-51.5" width="28" height="2.6"/>
      <rect x="-14" y="-45.5" width="28" height="2.6"/>
      <rect x="-14" y="-39.5" width="28" height="2.6"/>
      <path d="M3 -63 Q8 -48 4 -31 L14 -31 L14 -63 Z" fill="#05060c" opacity="0.2"/>
    </g>
    <path d="M0 -61 V-33" stroke="#9a8d72" stroke-width="0.7"/>
    <path d="M-10 -62 Q-12 -46 -7 -32 L7 -32 Q12 -46 10 -62 Z" fill="none" stroke-width="1.4"/>
    <!-- nuque, foulard noué devant (on n'en voit que le tour) -->
    <rect x="-2.5" y="-69" width="5" height="8" fill="#d9cbb0" stroke-width="1.1"/>
    <path d="M-8 -62.6 Q0 -60 8 -62.6" fill="none" stroke-width="2.6"/>
    <path d="M-8 -62.6 Q0 -60 8 -62.6" fill="none" stroke="#c23b3b" stroke-width="1.4"/>
    <!-- crâne de dos, sans visage, et l'arrière du béret -->
    <ellipse cx="0" cy="-77" rx="8" ry="10" fill="#d9cbb0" stroke-width="1.4"/>
    <path d="M3 -85 Q8 -78 4 -69" fill="none" stroke="#b5a688" stroke-width="1.2"/>
    <path d="M-8 -84 Q-6 -90 1 -90.5 Q8 -90 9.5 -85 Z" fill="#2a2f3a" stroke-width="1.1"/>
    <ellipse cx="1" cy="-84.5" rx="9.5" ry="2.8" fill="#2a2f3a" stroke-width="1.1"/>
    <path d="M1 -90.5 l-0.6 -2.6" stroke="#2a2f3a" stroke-width="1.6"/>
  </g>
  <!-- petits traits d'effort (il pousse fort sur rien) -->
  <g fill="none" stroke="#e8e4d8" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <path d="M330 386 l-16 -6 M332 404 h-18"/><path d="M540 268 l14 -10 M548 284 h16"/>
  </g>

  <!-- ===== CACHETTE : angle de mur au premier plan ===== -->
  <path d="M0 0 H186 L176 1334 H0 Z" fill="url(#mime-aggressif-b-dark)"/>
  <path d="M186 0 L176 1334" stroke="#05060c" stroke-width="8"/>
  <path d="M180 0 L170 1334" stroke="#2a2433" stroke-width="3" opacity="0.7"/>
  <g stroke="#05060c" stroke-width="5">
    <rect x="128" y="0" width="22" height="1334" fill="#141118"/>
    <rect x="122" y="300" width="34" height="14" rx="3" fill="#1c1822"/>
    <rect x="122" y="700" width="34" height="14" rx="3" fill="#1c1822"/>
  </g>
  <ellipse cx="180" cy="1180" rx="160" ry="40" fill="#05060c" opacity="0.45"/>
</svg>
