    <path d="M520 470 C600 430 640 360 620 300 C605 250 640 210 690 200" stroke="#7a3a1c" stroke-width="26"/>
    <path d="M560 440 C605 405 628 360 618 316" stroke="#a0522d" stroke-width="7" opacity="0.7"/>
  </g>
