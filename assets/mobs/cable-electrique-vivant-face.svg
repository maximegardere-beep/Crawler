  <path d="M420 190 C600 220 690 380 660 560 C640 720 560 860 400 900 C250 930 120 840 100 660 C80 480 210 170 420 190 Z" fill="#fde047" opacity="0.08"/>
  <path d="M430 280 C560 300 610 410 590 530 C570 650 500 720 400 730 C290 735 200 660 195 540 C190 410 300 265 430 280 Z" fill="#fde047" opacity="0.1"/>
  <circle cx="420" cy="470" r="250" fill="url(#cable-electrique-vivant-f-glow)"/>
