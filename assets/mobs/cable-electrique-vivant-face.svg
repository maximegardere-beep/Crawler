  <g stroke-linecap="round">
    <path d="M688 200 l26 -24 M690 202 l34 -4 M688 204 l26 18 M686 196 l4 -32" stroke="#05060c" stroke-width="11"/>
    <path d="M688 200 l26 -24 M690 202 l34 -4 M688 204 l26 18 M686 196 l4 -32" stroke="#c97a3a" stroke-width="5"/>
