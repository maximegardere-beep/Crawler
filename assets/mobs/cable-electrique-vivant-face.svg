  <g stroke="#05060c" stroke-linejoin="round">
    <circle cx="420" cy="455" r="185" fill="#c97a3a" stroke-width="12"/>
    <path d="M560 340 C640 450 600 600 470 636 C560 560 600 450 560 340 Z" fill="#a8612c"/>
    <path d="M300 340 C330 300 380 282 420 284" fill="none" stroke="#e8a46a" stroke-width="16" stroke-linecap="round"/>
    <!-- gaine : anneaux de l'isolant -->
