<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- Câble Électrique Vivant, Salle des Machines Infernales, cadrage « face ». Aucun texte. -->
  <defs>
    <pattern id="cable-electrique-vivant-f-tole" width="110" height="70" patternUnits="userSpaceOnUse">
      <rect width="110" height="70" fill="#2c3136"/>
      <rect x="2" y="2" width="106" height="66" rx="5" fill="#373e45"/>
      <circle cx="12" cy="12" r="3" fill="#252a30"/>
      <circle cx="98" cy="12" r="3" fill="#252a30"/>
      <circle cx="12" cy="58" r="3" fill="#252a30"/>
      <circle cx="98" cy="58" r="3" fill="#252a30"/>
      <path d="M0 35 h110" stroke="#252a30" stroke-width="5"/>
      <rect x="20" y="16" width="26" height="12" rx="2" fill="#3f4750"/>
      <rect x="64" y="44" width="26" height="12" rx="2" fill="#3f4750"/>
    </pattern>
    <radialGradient id="cable-electrique-vivant-f-glow" cx="0.5" cy="0.5" r="0.5">
