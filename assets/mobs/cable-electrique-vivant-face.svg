    <path d="M0 96 H750" stroke="#2f353b" stroke-width="15"/>
    <path d="M610 96 V170 H750" stroke="#05060c" stroke-width="20"/>
    <path d="M610 96 V170 H750" stroke="#2f353b" stroke-width="11"/>
  </g>
  <g fill="#3a4148" stroke="#05060c" stroke-width="4"><rect x="180" y="82" width="18" height="28" rx="3"/><rect x="470" y="82" width="18" height="28" rx="3"/></g>
  <!-- Engrenages muraux -->
  <g stroke="#05060c" stroke-width="6" stroke-linejoin="round">
    <path d="M118 236 l14 -4 l6 -18 l18 4 l10 -14 l16 10 l14 -8 l8 18 l18 2 l-2 18 l14 12 l-12 14 l4 18 l-18 6 l-6 18 l-18 -4 l-10 14 l-16 -10 l-14 8 l-8 -18 l-18 -2 l2 -18 l-14 -12 l12 -14 Z" fill="#3b4147"/>
    <circle cx="156" cy="262" r="20" fill="#2a2f35"/>
    <path d="M236 176 l10 -2 l4 -12 l12 4 l8 -8 l10 8 l10 -4 l4 12 l12 2 l-2 12 l8 8 l-8 10 l2 12 l-12 4 l-4 12 l-12 -4 l-8 8 l-10 -8 l-10 4 l-4 -12 l-12 -2 l2 -12 l-8 -8 l8 -10 Z" fill="#353b41"/>
    <circle cx="262" cy="198" r="12" fill="#2a2f35"/>
