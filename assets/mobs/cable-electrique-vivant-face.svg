  <path d="M0 1040 H750" stroke="#05060c" stroke-width="6"/>
  <g stroke="#1f2328" stroke-width="6">
    <path d="M30 1100 h690 M10 1170 h730 M0 1245 h750 M0 1315 h750"/>
    <path d="M150 1045 L110 1334 M300 1045 L285 1334 M450 1045 L465 1334 M600 1045 L640 1334"/>
  </g>
  <rect x="0" y="0" width="55" height="1334" fill="#05060c" opacity="0.24"/>
  <rect x="695" y="0" width="55" height="1334" fill="#05060c" opacity="0.24"/>

