    <path d="M276 580 C350 610 470 615 560 580" fill="none" stroke="#a8612c" stroke-width="7"/>
  </g>

  <!-- Câble avant gauche, qui se tend vers nous (au premier plan) -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M360 610 C330 720 250 800 160 860 C110 895 80 940 70 990" stroke="#05060c" stroke-width="58"/>
    <path d="M360 610 C330 720 250 800 160 860 C110 895 80 940 70 990" stroke="#7a3a1c" stroke-width="44"/>
    <path d="M330 700 C300 770 240 820 180 858" stroke="#a0522d" stroke-width="9" opacity="0.7"/>
  </g>
  <g stroke-linecap="round">
    <path d="M70 990 l-34 14 M72 994 l-14 34 M76 994 l18 34 M66 984 l-40 -12" stroke="#05060c" stroke-width="13"/>
    <path d="M70 990 l-34 14 M72 994 l-14 34 M76 994 l18 34 M66 984 l-40 -12" stroke="#c97a3a" stroke-width="6"/>
  </g>

