  <!-- L'oeil, braqué sur nous -->
  <g stroke="#05060c" stroke-linejoin="round">
    <circle cx="368" cy="430" r="66" fill="#fde047" stroke-width="10"/>
    <circle cx="350" cy="440" r="30" fill="#05060c"/>
    <circle cx="340" cy="430" r="9" fill="#fff8d0" stroke="none"/>
    <!-- paupière furieuse -->
    <path d="M292 400 C320 352 410 350 440 382 L432 400 C396 386 340 388 302 418 Z" fill="#7a3a1c" stroke-width="8"/>
    <path d="M276 360 L458 338" stroke-width="22" stroke-linecap="round"/>
    <path d="M276 360 L458 338" stroke="#4a220f" stroke-width="10" stroke-linecap="round"/>
    <!-- mâchoire-craquelure : fissure grimaçante -->
    <path d="M330 540 l24 -14 l20 16 l22 -16 l20 14 l22 -14" fill="none" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Étincelle en zigzag au-dessus -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M520 250 L578 214 L540 196 L604 148" stroke="#05060c" stroke-width="22"/>
    <path d="M520 250 L578 214 L540 196 L604 148" stroke="#fde047" stroke-width="12"/>
  </g>
  <!-- Arcs et étincelles autour -->
  <g fill="none" stroke="#fde047" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M230 260 l-20 -26 l18 -8 l-16 -26" stroke-width="7"/>
    <path d="M620 560 l26 10 l-12 16 l24 12" stroke-width="6"/>
    <path d="M300 930 l-16 22 l18 6 l-14 22" stroke-width="6"/>
    <path d="M730 180 l-10 -24 M724 214 l22 6" stroke-width="5"/>
  </g>
  <g fill="#fde047" stroke="#05060c" stroke-width="3">
    <circle cx="40" cy="430" r="8"/><circle cx="28" cy="520" r="6"/><circle cx="260" cy="980" r="7"/>
    <circle cx="640" cy="990" r="6"/><circle cx="110" cy="1030" r="7"/><circle cx="700" cy="250" r="6"/>
    <path d="M44 950 l10 -18 l4 12 l12 -6 l-8 16 l-4 -8 Z"/>
  </g>
