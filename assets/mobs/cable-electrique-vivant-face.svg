  <g stroke="#05060c" stroke-linejoin="round" stroke-width="10">
    <path d="M250 430 L300 420 L304 520 L254 534 Z" fill="#1c2028"/>
    <path d="M150 420 L250 400 L256 548 L156 560 Z" fill="#2a2f3a"/>
    <path d="M150 420 L250 400 L256 420 L154 440 Z" fill="#3a404c" stroke="none"/>
    <path d="M166 470 h80 M168 500 h80" stroke="#1c2028" stroke-width="5"/>
  </g>
  <g stroke="#05060c" stroke-width="7" stroke-linejoin="round">
    <rect x="60" y="436" width="96" height="26" rx="4" fill="#b8b2a0"/>
    <rect x="60" y="500" width="96" height="26" rx="4" fill="#b8b2a0"/>
    <path d="M70 444 h70 M70 508 h70" stroke="#e8e4d8" stroke-width="5"/>
