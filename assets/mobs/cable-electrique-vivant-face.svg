  <g fill="#6b6259" stroke="#05060c" stroke-width="3" opacity="0.8">
    <path d="M150 1030 q-8 -26 18 -30 q8 -20 30 -8 q22 -4 20 20 q8 18 -14 24 Z"/>
    <path d="M560 1032 q-6 -20 16 -24 q10 -16 28 -4 q18 0 14 18 Z"/>
  </g>
</svg>
