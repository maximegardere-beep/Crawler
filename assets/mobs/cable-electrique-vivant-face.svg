    <path d="M46 572 h108 M46 632 h108 M46 692 h108 M46 752 h108 M46 812 h108" stroke-width="4"/>
    <circle cx="66" cy="572" r="6" fill="#4ade80"/>
    <circle cx="66" cy="692" r="6" fill="#ef4444"/>
    <rect x="590" y="470" width="140" height="450" rx="8" fill="#323940"/>
    <path d="M606 530 h108 M606 590 h108 M606 650 h108 M606 710 h108 M606 770 h108" stroke-width="4"/>
