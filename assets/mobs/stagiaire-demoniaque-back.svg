    <rect x="8" y="-34" width="48" height="30" rx="9" fill="#1c1f2a" stroke-width="6"/>
    <path d="M-64 -246 Q0 -268 64 -246 Q78 -176 60 -112 L-60 -112 Q-78 -176 -64 -246 Z" fill="#8fae5a" stroke-width="7"/>
    <path d="M40 -244 Q70 -176 50 -114 L60 -114 Q78 -176 64 -246 Z" fill="#74924a" stroke="none"/>
    <rect x="-62" y="-134" width="124" height="22" rx="6" fill="#74924a" stroke-width="6"/>
