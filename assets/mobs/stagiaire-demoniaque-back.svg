        <rect x="-132" y="-210" width="50" height="34" rx="4" fill="#d8d2bf"/>
        <rect x="-138" y="-244" width="52" height="34" rx="4"/>
        <rect x="-132" y="-278" width="50" height="34" rx="4" fill="#c23b3b"/>
        <rect x="-136" y="-312" width="52" height="34" rx="4"/>
        <rect x="-128" y="-346" width="50" height="34" rx="4" fill="#d8d2bf"/>
        <rect x="-134" y="-380" width="52" height="34" rx="4"/>
        <rect x="-126" y="-414" width="50" height="34" rx="4" fill="#3a4a6b"/>
        <rect x="-130" y="-448" width="52" height="34" rx="4"/>
        <rect x="-122" y="-482" width="50" height="34" rx="4" fill="#d8d2bf"/>
      </g>
      <g fill="none" stroke-width="4">
        <path d="M-136 -166 q-12 4 0 14 M-132 -200 q-12 4 0 14 M-138 -234 q-12 4 0 14 M-132 -268 q-12 4 0 14 M-136 -302 q-12 4 0 14 M-128 -336 q-12 4 0 14 M-134 -370 q-12 4 0 14 M-126 -404 q-12 4 0 14 M-130 -438 q-12 4 0 14 M-122 -472 q-12 4 0 14"/>
      </g>
    </g>
    <circle cx="-96" cy="-150" r="12" fill="#8fae5a" stroke-width="5"/>
    <!-- Traits de vacillement -->
    <path d="M-176 -420 q-10 20 0 40 M-62 -470 q10 20 0 40" fill="none" stroke="#cbc4ad" stroke-width="4" opacity="0.8"/>
    <!-- Oreilles, tête, cornes, post-it collé dans le dos de la tête -->
    <path d="M-38 -296 L-120 -330 Q-94 -288 -38 -270 Z" fill="#8fae5a" stroke-width="6"/>
    <path d="M-50 -294 L-102 -316 Q-86 -296 -48 -280" fill="none" stroke="#5f7a3a" stroke-width="5"/>
    <path d="M40 -298 L120 -324 Q96 -282 40 -270 Z" fill="#8fae5a" stroke-width="6"/>
    <circle cx="0" cy="-290" r="50" fill="#8fae5a" stroke-width="7"/>
    <path d="M-48 -300 Q-44 -334 -10 -340" fill="none" stroke="#a4c26e" stroke-width="6"/>
    <path d="M30 -322 Q56 -292 34 -252 Q40 -292 22 -320 Z" fill="#74924a" stroke="none"/>
