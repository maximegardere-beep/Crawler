    <path d="M618 548 Q600 560 606 600 L622 600 Q620 570 626 556 Z" fill="#5a3a22" stroke-width="4"/>
    <path d="M520 700 Q560 690 610 706 Q560 720 520 712 Z" fill="#5a3a22" opacity="0.8" stroke-width="3"/>
    <g fill="none" stroke="#9aa0a6" stroke-width="5" opacity="0.6"><path d="M630 372 q-12 -20 0 -40 M652 368 q12 -22 0 -44"/></g>
  </g>
