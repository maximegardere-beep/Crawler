    <path d="M56 -232 Q100 -236 116 -262" fill="none" stroke="#3a4a6b" stroke-width="18"/>
    <circle cx="120" cy="-266" r="12" fill="#8fae5a" stroke-width="5"/>
    <path d="M126 -272 l14 -6" stroke-width="10"/>
    <path d="M126 -272 l14 -6" stroke="#8fae5a" stroke-width="4"/>
