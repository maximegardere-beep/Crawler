<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- Stagiaire Démoniaque, mob des Bureaux de l'Administration Pénitentiaire, cadrage « dos » : il fait la tournée du café pour tout le service, une tour de mugs sous le bras. Aucun texte. -->
  <defs>
    <pattern id="stagiaire-demoniaque-b-wall" width="100" height="70" patternUnits="userSpaceOnUse" patternTransform="scale(0.7)">
      <rect width="100" height="70" fill="#2a2a33"/>
      <rect x="3" y="3" width="44" height="64" rx="3" fill="#34343f"/>
      <rect x="52" y="3" width="44" height="64" rx="3" fill="#31313c"/>
      <rect x="3" y="3" width="44" height="8" fill="#3b3b46"/>
      <rect x="52" y="3" width="44" height="8" fill="#393944"/>
    </pattern>
    <radialGradient id="stagiaire-demoniaque-b-glow">
      <stop offset="0" stop-color="#e2f0e6" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#e2f0e6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="750" height="660" fill="url(#stagiaire-demoniaque-b-wall)"/>
  <rect x="0" y="0" width="750" height="54" fill="#202026"/>
  <rect x="300" y="22" width="180" height="18" rx="8" fill="#5a6a6a"/>
  <path d="M320 40 L230 640 L620 640 L460 40 Z" fill="#e2f0e6" opacity="0.04"/>
