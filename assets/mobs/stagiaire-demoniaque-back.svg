    <path d="M44 -298 Q70 -292 66 -276 Q56 -272 44 -276 Z" fill="#8fae5a" stroke-width="5"/>
    <path d="M-6 -336 q4 -14 14 -16 q-2 10 4 16" fill="#8fae5a" stroke-width="4"/>
    <path d="M-26 -330 Q-40 -350 -42 -372 Q-24 -362 -12 -338 Z" fill="#8a4a3a" stroke-width="5"/>
    <path d="M22 -334 Q34 -356 54 -364 Q50 -342 34 -330 Z" fill="#8a4a3a" stroke-width="5"/>
    <!-- Post-it rouge que quelqu'un lui a collé derrière la tête -->
    <g transform="rotate(14 -24 -300)">
      <rect x="-40" y="-318" width="28" height="26" fill="#c23b3b" stroke-width="4"/>
      <path d="M-35 -309 h18 M-35 -300 h12" stroke="#7a1f1f" stroke-width="3"/>
    </g>
  </g>
  <!-- Cachette : l'armoire à dossiers du premier plan, et un dossier tombé -->
  <g stroke="#05060c" stroke-linejoin="round">
    <rect x="-20" y="520" width="250" height="830" fill="#1a1a21" stroke-width="7"/>
    <rect x="230" y="520" width="34" height="830" fill="#131318" stroke-width="7"/>
    <path d="M-20 700 H230 M-20 900 H230 M-20 1100 H230" stroke-width="6"/>
    <rect x="70" y="600" width="90" height="16" rx="5" fill="#26262f" stroke-width="5"/>
    <rect x="70" y="790" width="90" height="16" rx="5" fill="#26262f" stroke-width="5"/>
    <rect x="70" y="990" width="90" height="16" rx="5" fill="#26262f" stroke-width="5"/>
    <path d="M10 520 L30 470 L200 470 L230 520 Z" fill="#202027" stroke-width="6"/>
    <path d="M40 480 L60 440 L180 446 L170 486 Z" fill="#3a382f" stroke-width="5"/>
    <path d="M290 990 L400 970 L420 1010 L310 1030 Z" fill="#3a382f" stroke-width="5"/>
