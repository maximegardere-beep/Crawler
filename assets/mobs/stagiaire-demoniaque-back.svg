    <path d="M-30 -252 Q0 -238 30 -252 L26 -238 Q0 -226 -26 -238 Z" fill="#e8e4d8" stroke-width="5"/>
    <path d="M-30 -246 Q-46 -220 -52 -196 M30 -246 Q44 -222 50 -198" fill="none" stroke="#3a4a6b" stroke-width="5"/>
    <path d="M0 -226 V-120" stroke="#74924a" stroke-width="5"/>
