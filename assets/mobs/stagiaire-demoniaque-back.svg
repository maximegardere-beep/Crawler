    <path d="M308 120 V208 M335 120 V208 M362 120 V208" stroke-width="6"/>
    <circle cx="620" cy="140" r="34" fill="#3e3e48"/>
    <circle cx="620" cy="140" r="25" fill="#cbc4ad"/>
    <path d="M620 140 V120 M620 140 L634 150" stroke-width="4"/>
    <rect x="470" y="210" width="120" height="40" rx="4" fill="#4a1d1d"/>
  </g>
  <path d="M486 230 h88" stroke="#cbbf9f" stroke-width="6" opacity="0.5"/>
  <!-- Sol -->
  <rect x="0" y="660" width="750" height="674" fill="#2f2f37"/>
  <path d="M0 660 H750" stroke="#05060c" stroke-width="5"/>
  <g stroke="#24242b" stroke-width="4"><path d="M0 700 H750 M0 760 H750 M0 850 H750 M0 980 H750 M0 1160 H750"/></g>
  <rect x="0" y="0" width="750" height="1334" fill="#05060c" opacity="0.14"/>
  <ellipse cx="520" cy="500" rx="260" ry="230" fill="url(#stagiaire-demoniaque-b-glow)"/>
  <!-- Comptoir et machine à café -->
  <g stroke="#05060c" stroke-linejoin="round" stroke-linecap="round">
    <rect x="520" y="600" width="240" height="100" fill="#3d3a33" stroke-width="6"/>
    <rect x="510" y="588" width="250" height="18" fill="#4a463d" stroke-width="6"/>
    <path d="M560 620 h60 M650 620 h60" stroke="#2a2822" stroke-width="5"/>
    <rect x="570" y="380" width="140" height="210" rx="10" fill="#4a4a54" stroke-width="6"/>
    <rect x="584" y="398" width="112" height="56" rx="6" fill="#2a2a33" stroke-width="5"/>
    <circle cx="604" cy="426" r="8" fill="#c23b3b" stroke-width="3"/>
    <circle cx="630" cy="426" r="8" fill="#5a6a6a" stroke-width="3"/>
    <circle cx="656" cy="426" r="8" fill="#5a6a6a" stroke-width="3"/>
    <rect x="596" y="470" width="88" height="96" fill="#1c1c22" stroke-width="5"/>
    <rect x="628" y="470" width="24" height="18" fill="#6a6a74" stroke-width="4"/>
