<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- Voiture Abandonnée Rouillée, Parking Souterrain Maudit, cadrage « back » : elle tente de se garer entre deux piliers trop serrés. Aucun texte. -->
  <defs>
    <pattern id="voiture-abandonnee-rouillee-b-beton" width="84" height="50" patternUnits="userSpaceOnUse">
      <rect width="84" height="50" fill="#2c2e30"/>
      <rect y="48" width="84" height="2" fill="#1d1e20"/>
      <rect x="40" y="0" width="2" height="48" fill="#262829"/>
      <circle cx="20" cy="14" r="2" fill="#222325"/>
      <circle cx="64" cy="32" r="2.4" fill="#222325"/>
    </pattern>
    <radialGradient id="voiture-abandonnee-rouillee-b-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dbeafe" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#dbeafe" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Mur de béton, plafond, néon -->
  <rect x="0" y="0" width="750" height="600" fill="url(#voiture-abandonnee-rouillee-b-beton)"/>
  <rect x="0" y="0" width="750" height="104" fill="#18191b"/>
  <g fill="#202124" stroke="#05060c" stroke-width="4">
    <rect x="-10" y="84" width="770" height="18"/>
    <rect x="250" y="0" width="20" height="86"/>
    <rect x="560" y="0" width="20" height="86"/>
  </g>
  <ellipse cx="420" cy="170" rx="240" ry="110" fill="url(#voiture-abandonnee-rouillee-b-glow)"/>
  <rect x="350" y="118" width="140" height="11" rx="4" fill="#dbeafe" stroke="#05060c" stroke-width="3" opacity="0.85"/>
  <path d="M372 104 v14 M468 104 v14" stroke="#05060c" stroke-width="3"/>
  <!-- Numéros de place effacés (illisibles) -->
  <g fill="#a3a3a3" opacity="0.18">
    <path d="M396 198 q22 -6 44 2 q10 8 6 26 q-6 18 -26 14 q-18 4 -24 -8 q-4 -18 0 -34 z"/>
    <rect x="392" y="254" width="58" height="5"/>
    <path d="M662 198 q20 -4 42 4 q6 22 -4 40 q-20 6 -38 -2 q-4 -22 0 -42 z"/>
  </g>
  <!-- Sol -->
  <rect x="0" y="600" width="750" height="734" fill="#27292b"/>
  <path d="M0 600 H750" stroke="#05060c" stroke-width="5"/>
  <g fill="none" stroke="#151617" stroke-width="4">
    <path d="M0 660 H750 M0 760 H750 M0 900 H750"/>
  </g>
  <g fill="#d4d4d4" opacity="0.14">
    <path d="M300 604 h8 l-60 436 h-14 z"/>
    <path d="M552 604 h8 l70 436 h-14 z"/>
    <path d="M360 880 h80 v-14 l40 24 l-40 24 v-14 h-80 z" transform="rotate(-90 420 890)"/>
  </g>
  <!-- Traces de pneus : tentatives de créneau -->
  <g fill="none" stroke="#141516" stroke-width="12" stroke-linecap="round" opacity="0.8">
    <path d="M360 640 C330 720 250 760 300 840 C350 920 520 900 560 990"/>
    <path d="M520 640 C540 720 610 740 580 820 C540 910 380 880 340 990"/>
    <path d="M440 640 C470 700 400 760 440 820"/>
  </g>
  <!-- Piliers rayés qui l'enserrent (raclés de rouille) -->
  <g stroke="#05060c" stroke-width="4">
    <rect x="252" y="102" width="44" height="540" fill="#34363a"/>
    <rect x="252" y="572" width="44" height="70" fill="#141414"/>
    <rect x="592" y="102" width="44" height="540" fill="#34363a"/>
    <rect x="592" y="572" width="44" height="70" fill="#141414"/>
  </g>
  <g fill="#8a7424" opacity="0.85">
    <path d="M252 580 h44 v8 h-44 z M252 598 h44 v8 h-44 z M252 616 h44 v8 h-44 z"/>
    <path d="M592 580 h44 v8 h-44 z M592 598 h44 v8 h-44 z M592 616 h44 v8 h-44 z"/>
  </g>
  <g fill="#a8543a" opacity="0.75">
    <path d="M290 470 l6 -2 v56 l-6 4 z M286 500 l10 -4 v10 l-10 4 z"/>
    <path d="M592 462 l6 2 v60 l-6 -2 z"/>
  </g>
  <!-- Ombre de la voiture -->
  <ellipse cx="444" cy="640" rx="190" ry="20" fill="#05060c" opacity="0.6"/>
  <!-- LA VOITURE, vue de l'arrière, coincée et penchée (pneu avant gauche crevé) -->
  <g transform="rotate(-3 444 520)" stroke="#05060c" stroke-linejoin="round" stroke-linecap="round">
    <!-- rétroviseurs pliés contre les piliers -->
    <path d="M296 452 l-14 -10 l4 -14 l18 8 z" fill="#6b3a28" stroke-width="4"/>
    <path d="M592 452 l14 -10 l-4 -14 l-18 8 z" fill="#6b3a28" stroke-width="4"/>
    <!-- pneus arrière -->
    <rect x="300" y="574" width="54" height="66" rx="12" fill="#2a1a12" stroke-width="5"/>
    <rect x="534" y="574" width="54" height="66" rx="12" fill="#2a1a12" stroke-width="5"/>
    <!-- toit + lunette arrière -->
    <path d="M346 352 L542 352 Q556 352 560 364 L586 452 L302 452 L328 364 Q332 352 346 352 Z" fill="#a8543a" stroke-width="6"/>
    <path d="M350 368 L538 368 L562 444 L326 444 Z" fill="#1a2430" stroke-width="5"/>
    <path d="M380 436 L410 378 M410 436 L438 378" stroke="#3b4c5e" stroke-width="7" fill="none"/>
    <ellipse cx="452" cy="358" rx="32" ry="4" fill="#8a4a24" stroke="none"/>
    <!-- toile d'araignée au coin arrière -->
    <g stroke="#cbd5e1" stroke-width="2.2" fill="none" opacity="0.85">
      <path d="M328 368 L378 376 M328 368 L364 396 M328 368 L340 420"/>
      <path d="M350 372 Q348 384 340 386 M366 374 Q362 392 348 400 M372 386 Q362 404 338 410"/>
    </g>
    <!-- caisse arrière / coffre -->
    <path d="M296 452 L592 452 Q604 454 604 468 L606 584 Q604 596 590 596 L298 596 Q284 596 282 584 L284 468 Q284 454 296 452 Z" fill="#a8543a" stroke-width="6"/>
    <path d="M314 468 L574 468 L568 528 L320 528 Z" fill="#a8543a" stroke-width="4"/>
    <path d="M320 528 H568" stroke="#6b3a28" stroke-width="6"/>
    <path d="M330 480 q22 -8 34 6 q-6 16 -30 10 z" fill="#8a4a24" stroke="none"/>
    <path d="M500 500 q20 -6 30 8 q-10 12 -28 6 z" fill="#8a4a24" stroke="none"/>
    <path d="M300 556 L360 548" stroke-width="3" opacity="0.7"/>
    <path d="M284 500 q10 8 0 18 M604 492 q-10 10 0 20" fill="none" stroke-width="4"/>
    <!-- feux arrière + clignotant orange qui clignote -->
    <rect x="290" y="474" width="22" height="44" rx="4" fill="#b91c1c" stroke-width="4"/>
    <rect x="576" y="474" width="22" height="44" rx="4" fill="#b91c1c" stroke-width="4"/>
    <rect x="290" y="520" width="22" height="16" rx="3" fill="#fbbf24" stroke-width="4"/>
    <rect x="576" y="520" width="22" height="16" rx="3" fill="#6b3a28" stroke-width="4"/>
    <!-- pare-chocs cabossé + plaque illisible -->
    <path d="M286 560 L430 566 L452 576 L604 568 L604 590 Q602 600 590 600 L298 600 Q286 600 286 590 Z" fill="#8a929c" stroke-width="5"/>
    <rect x="410" y="538" width="68" height="22" rx="3" fill="#e8e4d8" stroke-width="4"/>
    <path d="M420 546 h18 M444 546 h24 M422 553 h36" stroke="#6b3a28" stroke-width="3.5"/>
    <!-- pot d'échappement -->
    <rect x="540" y="596" width="26" height="14" rx="5" fill="#4a4d52" stroke-width="4"/>
  </g>
  <!-- Fumée d'échappement -->
  <g fill="#6b6f75" stroke="#05060c" stroke-width="3" opacity="0.7">
    <circle cx="582" cy="620" r="16"/>
    <circle cx="612" cy="604" r="22"/>
    <circle cx="650" cy="580" r="28"/>
    <circle cx="690" cy="548" r="22"/>
  </g>
  <!-- Clignotement + étincelles sur le pilier -->
  <g stroke="#fbbf24" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M264 530 l-16 -4 M262 548 l-18 4 M270 512 l-12 -12"/>
  </g>
  <g stroke="#fde68a" stroke-width="4" stroke-linecap="round">
    <path d="M604 448 l18 -16 M608 460 l24 -2 M604 438 l6 -22"/>
  </g>
  <!-- Secousses de manœuvre -->
  <g fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <path d="M322 640 q-14 4 -20 16 M572 640 q14 4 20 16"/>
    <path d="M430 330 q14 -14 28 0"/>
  </g>
  <!-- Cône écrasé -->
  <g stroke="#05060c" stroke-width="4" stroke-linejoin="round">
    <path d="M244 704 L314 716 L246 736 Z" fill="#9a4f2a"/>
    <path d="M266 710 L272 728" stroke="#cbd5e1" stroke-width="7"/>
    <rect x="230" y="700" width="16" height="40" rx="3" fill="#5a4030"/>
  </g>
  <!-- Assombrissement général -->
  <rect x="0" y="0" width="750" height="1334" fill="#05060c" opacity="0.12"/>
  <!-- CACHETTE : gros pilier au premier plan à gauche -->
  <rect x="-20" y="0" width="230" height="1334" fill="#141516" stroke="#05060c" stroke-width="6"/>
  <rect x="150" y="0" width="60" height="1334" fill="#0c0d0e"/>
  <g fill="#3d3418">
    <path d="M-20 820 h230 v40 h-230 z M-20 900 h230 v40 h-230 z M-20 980 h230 v40 h-230 z"/>
  </g>
  <rect x="-20" y="780" width="230" height="300" fill="#05060c" opacity="0.25"/>
  <path d="M210 0 V1334" stroke="#05060c" stroke-width="8"/>
  <path d="M210 1060 L460 1334 H210 Z" fill="#05060c" opacity="0.35"/>
  <rect x="690" y="0" width="60" height="1334" fill="#05060c" opacity="0.25"/>
</svg>
