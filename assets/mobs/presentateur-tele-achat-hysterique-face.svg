<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- Présentateur Télé-Achat Hystérique, mob du Studio de Télé-Achat Abandonné, cadrage « face » : il fonce sur nous en brandissant l'éplucheur miracle. Aucun texte. -->
  <defs>
