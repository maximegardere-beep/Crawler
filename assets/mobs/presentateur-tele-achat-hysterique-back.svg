  <g stroke="#05060c" stroke-width="3">
    <path d="M300 690 q14 -10 26 0 q-12 8 -26 0 Z M520 704 q12 -8 22 2 q-12 6 -22 -2 Z M560 680 q10 -8 18 0 q-8 6 -18 0 Z" fill="#c9a86a"/>
    <ellipse cx="350" cy="706" rx="14" ry="10" fill="#a8844a"/>
    <ellipse cx="496" cy="690" rx="11" ry="8" fill="#a8844a"/>
  </g>

