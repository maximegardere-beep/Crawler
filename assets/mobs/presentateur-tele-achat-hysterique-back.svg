    <path d="M10 -172 L48 -172 L50 -12 L18 -12 Z" fill="#6a3f7a" stroke-width="6"/>
    <path d="M-68 -16 L-26 -16 L-24 2 L-72 2 Z" fill="#241a20" stroke-width="5"/>
    <path d="M14 -16 L54 -16 L58 2 L12 2 Z" fill="#241a20" stroke-width="5"/>
    <!-- Bras gauche tendu vers le public absent -->
    <path d="M-50 -306 Q-110 -322 -150 -340 L-142 -312 Q-104 -294 -54 -270 Z" fill="#6a3f7a" stroke-width="6"/>
    <path d="M-152 -344 L-138 -310 L-150 -306 L-164 -340 Z" fill="#e8e4d8" stroke-width="4"/>
    <path d="M-160 -340 Q-196 -362 -204 -336 Q-206 -312 -170 -310 Z" fill="#9cb06e" stroke-width="5"/>
    <path d="M-196 -350 l-14 -14 M-202 -336 l-20 -4 M-198 -322 l-18 6" fill="none" stroke="#05060c" stroke-width="10"/>
    <path d="M-196 -350 l-14 -14 M-202 -336 l-20 -4 M-198 -322 l-18 6" fill="none" stroke="#9cb06e" stroke-width="5"/>
    <!-- Veste violette vue de dos : couture, fente -->
    <path d="M-64 -310 Q0 -326 64 -310 Q72 -230 62 -150 L-62 -150 Q-72 -230 -64 -310 Z" fill="#7a4a8a" stroke-width="7"/>
    <path d="M30 -306 Q58 -230 50 -152 L62 -150 Q72 -230 64 -310 Z" fill="#5f3a6e" stroke="none"/>
    <path d="M-48 -296 Q-58 -230 -50 -164" fill="none" stroke="#9a62ac" stroke-width="5" opacity="0.8"/>
    <path d="M0 -320 L0 -150 M0 -190 L-8 -150" fill="none" stroke="#4e2e5c" stroke-width="4"/>
    <path d="M-40 -232 Q0 -222 40 -232" fill="none" stroke="#4e2e5c" stroke-width="4"/>
    <!-- Col de veste et liseré de chemise -->
    <path d="M-30 -322 Q0 -330 30 -322 L28 -306 Q0 -312 -28 -306 Z" fill="#5f3a6e" stroke-width="5"/>
    <path d="M-20 -330 Q0 -335 20 -330 L20 -322 Q0 -326 -20 -322 Z" fill="#e8e4d8" stroke-width="3"/>
    <!-- Bras droit levé, produit brandi bien haut -->
    <path d="M44 -306 Q90 -330 102 -386 L76 -396 Q68 -350 40 -276 Z" fill="#7a4a8a" stroke-width="6"/>
    <path d="M74 -398 L104 -390 L106 -402 L76 -410 Z" fill="#e8e4d8" stroke-width="4"/>
    <path d="M78 -408 Q74 -440 92 -446 Q112 -444 108 -404 Z" fill="#9cb06e" stroke-width="5"/>
    <path d="M94 -440 L104 -506" fill="none" stroke-width="16"/>
    <path d="M94 -440 L104 -506" fill="none" stroke="#9ca3af" stroke-width="9"/>
    <path d="M104 -506 L70 -556 L86 -560 Z M104 -506 L102 -566 L118 -564 Z M104 -506 L134 -552 L146 -540 Z" fill="#d6dde4" stroke-width="4"/>
    <circle cx="104" cy="-506" r="7" fill="#6b7280" stroke-width="4"/>
    <!-- Nuque, oreilles et arrière du crâne -->
    <rect x="-17" y="-346" width="34" height="26" fill="#9cb06e" stroke-width="5"/>
    <path d="M-44 -372 q-14 0 -14 14 q2 12 15 10 Z" fill="#9cb06e" stroke-width="4"/>
    <path d="M44 -372 q14 0 14 14 q-2 12 -15 10 Z" fill="#9cb06e" stroke-width="4"/>
    <circle cx="0" cy="-376" r="44" fill="#9cb06e" stroke-width="6"/>
    <path d="M-44 -382 Q-46 -428 0 -422 Q46 -428 44 -382 Q24 -366 0 -372 Q-24 -366 -44 -382 Z" fill="#2a1f2e" stroke-width="5"/>
    <path d="M-26 -406 Q0 -414 26 -406 M-32 -392 Q0 -400 32 -392" fill="none" stroke="#5a4660" stroke-width="4"/>
    <path d="M6 -420 Q2 -446 22 -452 Q12 -436 26 -430" fill="none" stroke="#05060c" stroke-width="9"/>
    <path d="M6 -420 Q2 -446 22 -452 Q12 -436 26 -430" fill="none" stroke="#2a1f2e" stroke-width="4"/>
    <!-- Serre-tête et écouteur du micro-casque -->
    <path d="M-46 -372 Q-40 -430 0 -432 Q40 -430 46 -372" fill="none" stroke="#05060c" stroke-width="9"/>
    <path d="M-46 -372 Q-40 -430 0 -432 Q40 -430 46 -372" fill="none" stroke="#3a3a44" stroke-width="4"/>
    <rect x="42" y="-382" width="16" height="28" rx="6" fill="#2a2a34" stroke-width="4"/>
    <path d="M56 -360 Q66 -344 58 -334" fill="none" stroke="#3a3a44" stroke-width="4"/>
  </g>
  <!-- Paillettes du produit (accent jaune) + lignes d'enthousiasme -->
  <g fill="#fde047" stroke="#05060c" stroke-width="3">
    <path d="M490 144 l4 -14 l4 14 l14 4 l-14 4 l-4 14 l-4 -14 l-14 -4 Z"/>
    <path d="M590 182 l3 -10 l3 10 l10 3 l-10 3 l-3 10 l-3 -10 l-10 -3 Z"/>
    <path d="M500 230 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 Z"/>
  </g>
  <g fill="none" stroke="#e8e4d8" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <path d="M196 320 l-24 -12 M200 344 h-28 M488 270 l16 -14 M560 248 l20 -6"/>
  </g>

  <!-- Cachette au premier plan : caisse de transport + pan de rideau -->
  <g stroke="#05060c" stroke-width="6" stroke-linejoin="round">
    <path d="M0 0 L70 0 Q40 300 66 620 Q86 760 40 900 L0 900 Z" fill="#1c1016"/>
    <path d="M26 10 Q10 400 30 890" fill="none" stroke="#120a0e" stroke-width="10"/>
    <path d="M-10 860 L250 830 L290 870 L290 1334 L-10 1334 Z" fill="#17141c"/>
    <path d="M-10 860 L250 830 L290 870 L20 900 Z" fill="#221e28"/>
    <path d="M250 830 L290 870 L290 1334 L250 1334 Z" fill="#100e14"/>
    <path d="M0 980 L256 952 M0 1120 L256 1096" fill="none" stroke="#2c2a34" stroke-width="10"/>
    <rect x="216" y="900" width="34" height="34" rx="4" fill="#3a3a44"/>
    <rect x="216" y="1060" width="34" height="34" rx="4" fill="#3a3a44"/>
    <path d="M60 864 q40 -30 90 -14 q40 16 4 30 q-50 14 -90 -2" fill="none" stroke="#2a2a34" stroke-width="10"/>
  </g>
  <rect x="0" y="1040" width="750" height="294" fill="#05060c" opacity="0.25"/>
  <rect x="695" y="0" width="55" height="1334" fill="#05060c" opacity="0.22"/>
</svg>
