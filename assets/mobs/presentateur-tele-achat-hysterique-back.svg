<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- Présentateur Télé-Achat Hystérique, cadrage « back » : de dos, il fait la démonstration de l'éplucheur miracle devant des chaises vides et une caméra éteinte. Aucun texte. -->
  <defs>
    <pattern id="presentateur-tele-achat-hysterique-b-mur" width="60" height="36" patternUnits="userSpaceOnUse">
      <rect width="60" height="36" fill="#1c1a2a"/>
      <rect x="1.5" y="1.5" width="57" height="33" rx="3" fill="#232035"/>
      <circle cx="12" cy="11" r="2" fill="#2a2740"/>
      <circle cx="43" cy="24" r="2.5" fill="#2a2740"/>
    </pattern>
    <pattern id="presentateur-tele-achat-hysterique-b-sol" width="120" height="32" patternUnits="userSpaceOnUse">
      <rect width="120" height="32" fill="#1e1a1c"/>
      <rect x="0" y="2" width="76" height="12" rx="2" fill="#262022"/>
      <rect x="79" y="2" width="41" height="12" rx="2" fill="#231e20"/>
      <rect x="-24" y="18" width="64" height="12" rx="2" fill="#231e20"/>
      <rect x="43" y="18" width="90" height="12" rx="2" fill="#262022"/>
    </pattern>
  </defs>
  <!-- Mur du fond -->
  <rect x="0" y="0" width="750" height="570" fill="url(#presentateur-tele-achat-hysterique-b-mur)"/>
  <rect x="0" y="0" width="750" height="80" fill="#141220"/>
  <g stroke="#05060c" stroke-width="5">
    <path d="M0 100 H750" stroke="#34304a" stroke-width="10"/>
    <path d="M430 100 v18 M640 100 v18" fill="none" stroke-width="6"/>
    <path d="M408 116 L452 116 L462 150 L398 150 Z" fill="#34304a"/>
    <path d="M618 116 L662 116 L672 150 L608 150 Z" fill="#34304a"/>
  </g>
  <!-- Néon éteint (formes illisibles) -->
  <g stroke="#05060c" stroke-width="5">
    <rect x="120" y="150" width="130" height="44" rx="10" fill="#2a1c26"/>
  </g>
  <g fill="#f43f5e" opacity="0.25">
    <rect x="132" y="162" width="26" height="18" rx="6"/><rect x="166" y="162" width="18" height="18" rx="6"/><rect x="192" y="162" width="46" height="18" rx="6"/>
  </g>
  <!-- Rideau bordeaux au fond -->
  <g stroke="#05060c" stroke-width="5">
    <path d="M520 190 L750 190 L750 570 L540 570 Q560 380 520 190 Z" fill="#2e1a24"/>
    <path d="M590 196 Q610 380 596 566 M670 196 Q684 380 676 566" fill="none" stroke="#1f1118" stroke-width="8"/>
  </g>
  <!-- Sol du plateau -->
  <rect x="0" y="570" width="750" height="764" fill="url(#presentateur-tele-achat-hysterique-b-sol)"/>
  <path d="M0 570 H750" stroke="#05060c" stroke-width="5"/>
  <rect x="0" y="570" width="750" height="40" fill="#05060c" opacity="0.25"/>

  <!-- Chaises pliantes vides du public (face à lui) -->
  <g stroke="#05060c" stroke-width="4" stroke-linejoin="round">
    <g transform="translate(140 612)">
      <path d="M-26 0 L-22 -96 M26 0 L22 -96" fill="none" stroke="#4a4652" stroke-width="7"/>
      <rect x="-26" y="-100" width="52" height="34" rx="4" fill="#3a3642"/>
      <path d="M-30 -48 L30 -48 L26 -38 L-26 -38 Z" fill="#4a4652"/>
      <path d="M-24 0 L20 -46 M24 0 L-20 -46" fill="none" stroke="#4a4652" stroke-width="5"/>
    </g>
    <g transform="translate(240 600) scale(0.92)">
      <path d="M-26 0 L-22 -96 M26 0 L22 -96" fill="none" stroke="#4a4652" stroke-width="7"/>
      <rect x="-26" y="-100" width="52" height="34" rx="4" fill="#3a3642"/>
      <path d="M-30 -48 L30 -48 L26 -38 L-26 -38 Z" fill="#4a4652"/>
      <path d="M-24 0 L20 -46 M24 0 L-20 -46" fill="none" stroke="#4a4652" stroke-width="5"/>
    </g>
    <g transform="translate(340 596) scale(0.86)">
      <path d="M-26 0 L-22 -96 M26 0 L22 -96" fill="none" stroke="#4a4652" stroke-width="7"/>
      <rect x="-26" y="-100" width="52" height="34" rx="4" fill="#3a3642"/>
      <path d="M-30 -48 L30 -48 L26 -38 L-26 -38 Z" fill="#4a4652"/>
      <path d="M-24 0 L20 -46 M24 0 L-20 -46" fill="none" stroke="#4a4652" stroke-width="5"/>
    </g>
    <!-- Une chaise renversée -->
    <g transform="translate(700 620) rotate(-80)">
      <path d="M-26 0 L-22 -96 M26 0 L22 -96" fill="none" stroke="#4a4652" stroke-width="7"/>
      <rect x="-26" y="-100" width="52" height="34" rx="4" fill="#3a3642"/>
      <path d="M-30 -48 L30 -48 L26 -38 L-26 -38 Z" fill="#4a4652"/>
    </g>
  </g>
  <!-- Caméra éteinte sur trépied, braquée sur lui -->
  <g stroke="#05060c" stroke-width="4" stroke-linejoin="round">
    <path d="M610 486 L578 612 M610 486 L644 612 M610 486 L612 612" fill="none" stroke="#2c2a36" stroke-width="8"/>
    <rect x="570" y="430" width="82" height="58" rx="7" fill="#2c2a36"/>
    <rect x="548" y="442" width="28" height="34" rx="4" fill="#24222e"/>
    <circle cx="550" cy="459" r="16" fill="#14141c"/>
    <circle cx="550" cy="459" r="6" fill="#2a2a34"/>
    <circle cx="642" cy="440" r="4" fill="#3a2a2e"/>
  </g>
  <!-- Toile d'araignée entre la caméra et la chaise -->
  <path d="M652 432 L700 470 M652 432 L690 420 M666 444 q10 -10 18 -6 M676 452 q12 -14 20 -12" fill="none" stroke="#6a6474" stroke-width="2" opacity="0.6"/>

  <!-- Faisceau du seul projecteur encore allumé -->
  <path d="M400 150 L462 150 L600 700 L270 700 Z" fill="#fde047" opacity="0.07"/>
  <ellipse cx="434" cy="694" rx="170" ry="30" fill="#fde047" opacity="0.08"/>

