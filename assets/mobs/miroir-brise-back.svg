<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <!-- Miroir Brisé, mob de la Rue des Illusions, cadrage « dos » : sous un réverbère, il tente de recoller ses éclats au scotch et s'est déjà scotché le dos lui-même. Aucun texte. -->
  <defs>
    <pattern id="miroir-brise-b-wall" width="120" height="80" patternUnits="userSpaceOnUse" patternTransform="scale(0.7)">
      <rect width="120" height="80" fill="#211c2e"/>
      <rect x="6" y="6" width="108" height="68" rx="6" fill="#29243b"/>
      <circle cx="30" cy="25" r="4" fill="#2f2945"/>
      <circle cx="85" cy="50" r="5" fill="#2f2945"/>
      <circle cx="60" cy="66" r="3" fill="#2f2945"/>
      <circle cx="100" cy="14" r="3" fill="#2f2945"/>
    </pattern>
    <radialGradient id="miroir-brise-b-glow">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="750" height="760" fill="url(#miroir-brise-b-wall)"/>
  <rect x="0" y="0" width="750" height="46" fill="#0d0c16"/>
  <path d="M0 46 H750" stroke="#05060c" stroke-width="5"/>
  <!-- Façades penchées au fond -->
  <g stroke="#05060c" stroke-width="5" stroke-linejoin="round">
    <path d="M30 250 L170 236 L176 640 L36 650 Z" fill="#2a2335"/>
    <rect x="58" y="280" width="34" height="46" rx="4" fill="#1a1624"/>
    <rect x="110" y="274" width="34" height="46" rx="4" fill="#3a3150"/>
    <rect x="58" y="380" width="34" height="46" rx="4" fill="#1a1624"/>
    <path d="M500 200 L600 214 L596 560 L496 552 Z" fill="#262031"/>
    <rect x="518" y="240" width="30" height="42" rx="4" fill="#1a1624"/>
    <rect x="558" y="246" width="28" height="42" rx="4" fill="#1a1624"/>
  </g>
  <!-- Pavés -->
  <rect x="0" y="760" width="750" height="574" fill="#27232f"/>
  <path d="M0 760 H750" stroke="#05060c" stroke-width="5"/>
  <g fill="#211e28" stroke="#15131b" stroke-width="4">
    <rect x="20" y="776" width="80" height="30" rx="11"/><rect x="120" y="778" width="90" height="28" rx="11"/><rect x="230" y="776" width="86" height="30" rx="11"/><rect x="560" y="778" width="80" height="28" rx="11"/>
    <rect x="60" y="826" width="100" height="38" rx="14"/><rect x="190" y="828" width="110" height="36" rx="14"/><rect x="480" y="826" width="104" height="38" rx="14"/>
    <rect x="10" y="890" width="130" height="48" rx="16"/><rect x="170" y="892" width="140" height="46" rx="16"/><rect x="340" y="890" width="130" height="48" rx="16"/>
    <rect x="40" y="970" width="160" height="58" rx="18"/><rect x="230" y="972" width="170" height="56" rx="18"/>
    <rect x="0" y="1070" width="190" height="70" rx="22"/><rect x="220" y="1072" width="200" height="68" rx="22"/>
    <rect x="40" y="1180" width="220" height="80" rx="24"/><rect x="290" y="1182" width="200" height="78" rx="24"/>
  </g>
  <path d="M0 740 C140 720 260 760 400 742 C540 724 640 756 750 736 L750 790 L0 790 Z" fill="#6d6880" opacity="0.16"/>
  <rect x="0" y="0" width="750" height="1334" fill="#05060c" opacity="0.12"/>
  <!-- Réverbère sous lequel il travaille -->
  <circle cx="150" cy="230" r="240" fill="url(#miroir-brise-b-glow)"/>
  <ellipse cx="380" cy="780" rx="200" ry="40" fill="#ffd76a" opacity="0.07"/>
  <g stroke="#05060c" stroke-width="5" stroke-linejoin="round">
    <path d="M110 770 V200" stroke="#2c2738" stroke-width="14"/>
    <path d="M86 200 h48 l-8 -46 h-32 Z" fill="#ffd76a" opacity="0.8"/>
    <path d="M80 154 h60 l-30 -24 Z" fill="#2c2738"/>
    <rect x="92" y="756" width="36" height="16" fill="#2c2738"/>
  </g>
  <!-- Éclats éparpillés sur les pavés, qui scintillent -->
  <g stroke="#05060c" stroke-width="4" stroke-linejoin="round">
    <path d="M300 772 L326 760 L318 786 Z" fill="#cfe0ee"/>
    <path d="M470 790 L500 782 L486 806 Z" fill="#e8f4ff"/>
    <path d="M540 770 L560 762 L556 782 Z" fill="#aac4d8"/>
    <path d="M360 800 L384 794 L372 814 Z" fill="#cfe0ee"/>
    <path d="M420 812 L442 806 L436 826 Z" fill="#e8f4ff"/>
  </g>
  <g fill="#ffffff" opacity="0.8">
    <path d="M490 770 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 Z"/>
    <path d="M318 748 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 Z"/>
  </g>
  <!-- Le Miroir Brisé, de dos, penché sur ses éclats -->
  <g transform="translate(-60 0) translate(430 744) scale(1.2) translate(-430 -744)" stroke="#05060c" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="430" cy="780" rx="110" ry="14" fill="#05060c" opacity="0.45" stroke="none"/>
    <path d="M430 330 C490 330 520 372 522 430 C526 500 540 590 562 690 C540 682 528 712 506 702 C490 728 470 704 454 724 C438 744 418 718 402 736 C384 756 362 728 342 744 C352 660 344 580 342 500 C340 430 352 372 380 346 C394 334 410 330 430 330 Z" fill="#aac4d8" stroke-width="7" opacity="0.94"/>
    <path d="M490 360 C512 390 512 450 516 500 C524 580 540 640 562 690 C540 682 528 712 506 702 C500 640 494 560 484 490 C478 440 480 390 490 360 Z" fill="#5f7590" stroke="none" opacity="0.7"/>
    <path d="M506 702 C490 728 470 704 454 724 C438 744 418 718 402 736 C384 756 362 728 342 744" fill="none" stroke="#5f7590" stroke-width="6"/>
    <path d="M396 352 C412 340 436 338 456 344" fill="none" stroke="#e8f4ff" stroke-width="6" opacity="0.6"/>
    <!-- Dos du miroir vu à travers le spectre : plaque, croisillon, vis -->
    <ellipse cx="434" cy="510" rx="64" ry="84" fill="#3d4a5c" stroke-width="5" opacity="0.55"/>
    <path d="M434 432 V588 M378 510 H490" stroke="#5f7590" stroke-width="8" opacity="0.8"/>
    <g fill="#8a9bb0" stroke-width="3"><circle cx="434" cy="440" r="5"/><circle cx="434" cy="580" r="5"/><circle cx="384" cy="510" r="5"/><circle cx="484" cy="510" r="5"/></g>
    <!-- Pied du porte-miroir -->
    <rect x="370" y="610" width="130" height="16" rx="8" fill="#5f7590" stroke-width="5"/>
    <!-- Bras gauche : il lève un éclat vers la lumière du réverbère -->
    <path d="M372 430 C330 410 306 360 300 310" fill="none" stroke-width="34"/>
    <path d="M372 430 C330 410 306 360 300 310" fill="none" stroke="#aac4d8" stroke-width="25"/>
    <circle cx="300" cy="304" r="14" fill="#aac4d8" stroke-width="5"/>
    <path d="M290 288 L304 250 L318 290 Z" fill="#e8f4ff" stroke-width="4"/>
    <!-- Bras droit : le rouleau de scotch, et le ruban qui ne veut pas se décoller -->
    <path d="M500 440 C540 450 566 490 570 530" fill="none" stroke-width="34"/>
    <path d="M500 440 C540 450 566 490 570 530" fill="none" stroke="#aac4d8" stroke-width="25"/>
    <circle cx="572" cy="540" r="14" fill="#aac4d8" stroke-width="5"/>
    <circle cx="590" cy="556" r="22" fill="#e9dcae" stroke-width="5"/>
    <circle cx="590" cy="556" r="10" fill="#27232f" stroke-width="4"/>
    <path d="M580 576 C560 610 520 600 494 560" fill="none" stroke="#e9dcae" stroke-width="12" opacity="0.85"/>
    <!-- Bandes de scotch collées en croix sur son propre dos -->
    <g stroke-width="3" opacity="0.9">
      <rect x="390" y="456" width="96" height="16" fill="#e9dcae" transform="rotate(-28 438 464)"/>
      <rect x="392" y="456" width="96" height="16" fill="#e9dcae" transform="rotate(32 440 464)"/>
      <rect x="402" y="370" width="64" height="14" fill="#e9dcae" transform="rotate(10 434 377)"/>
    </g>
  </g>
  <!-- Cachette : angle de mur de briques sombre et poubelle au premier plan, à droite -->
  <g stroke="#05060c" stroke-linejoin="round">
    <path d="M620 0 H750 V1334 H600 Z" fill="#141019" stroke-width="6"/>
    <path d="M620 0 L600 1334" stroke="#251e2e" stroke-width="10"/>
    <g fill="none" stroke="#0b090f" stroke-width="5">
      <path d="M618 120 H750 M616 240 H750 M614 360 H750 M612 480 H750 M610 600 H750 M608 720 H750 M606 840 H750"/>
      <path d="M690 0 V120 M660 120 V240 M710 240 V360 M670 360 V480 M700 480 V600 M650 600 V720 M690 720 V840"/>
    </g>
    <g stroke-width="6">
      <path d="M470 900 L640 900 L626 1100 L484 1100 Z" fill="#1b1722"/>
      <rect x="456" y="868" width="198" height="36" rx="10" fill="#221d2a" transform="rotate(-5 555 886)"/>
      <path d="M520 930 V1080 M560 930 V1080 M600 930 V1080" stroke="#0e0c12" stroke-width="6"/>
    </g>
  </g>
</svg>
